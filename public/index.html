<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Our Secret Space 💖</title>
    <!-- 브라우저 탭 아이콘 (파비콘) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FF8282'%3E%3Cpath d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/%3E%3C/svg%3E">
    <!-- Web Fonts & Icons -->
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* 2026 Premium Soft App Theme */
            --primary: #FF7B7B;       
            --primary-light: #FFF0F0; 
            --primary-dark: #E56A6A;
            --secondary: #8ECAE6;     
            --secondary-light: #E8F6FA;
            --holiday: #F87171;
            --saturday: #60A5FA;
            --bg-base: #FDFBF9;       
            --surface: rgba(255, 255, 255, 0.9); 
            --text-main: #333333;
            --text-muted: #9CA3AF;
            --border-light: rgba(0, 0, 0, 0.04);
            --shadow-app: 0 20px 60px rgba(0, 0, 0, 0.05);
            --shadow-card: 0 12px 30px rgba(255, 123, 123, 0.06);
            --shadow-float: 0 10px 25px rgba(255, 123, 123, 0.35);
            --shadow-glass: 0 8px 32px rgba(0, 0, 0, 0.08);
            --radius-sm: 16px;
            --radius-md: 24px;
            --radius-lg: 36px;
            --nav-height: 80px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background: #E5E7EB; color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100dvh; overflow: hidden; font-weight: 400; }
        
        #app-wrapper { width: 100%; height: 100dvh; max-width: 480px; background: var(--bg-base); position: relative; display: flex; flex-direction: column; box-shadow: var(--shadow-app); overflow: hidden; transition: max-width 0.3s ease; }
        body:not(.mobile-frame-mode) #app-wrapper { max-width: 100%; }

        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 123, 123, 0.3); border-radius: 10px; }
        
        /* 공통 애니메이션 */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.9) translateY(10px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes pulseHeart { 0%, 100% { transform: scale(1); filter: drop-shadow(0 4px 10px rgba(255,123,123,0.4)); } 50% { transform: scale(1.1); filter: drop-shadow(0 8px 20px rgba(255,123,123,0.6)); } }
        @keyframes slideUpSheet { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .fade-up { opacity: 0; transform: translateY(20px); transition: opacity 0.6s ease-out, transform 0.6s ease-out; }
        .fade-up.visible { opacity: 1; transform: translateY(0); }
        .glass { background: var(--surface); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.8); }

        /* 뷰 컨트롤 */
        .view-section { display: none; flex-grow: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: calc(var(--nav-height) + 30px); scroll-behavior: smooth; }
        .view-section.active { display: block; animation: fadeIn 0.4s ease-out; }

        .edit-mode-only { display: none !important; }
        body.edit-mode .edit-mode-only { display: flex !important; }
        body.edit-mode .edit-mode-only-inline { display: inline-block !important; }

        /* 1. 로그인 인증 화면 */
        #auth-wall { position: absolute; inset: 0; background: url('https://images.unsplash.com/photo-1518621736915-f3b1c41bfd00?q=80&w=1920&auto=format&fit=crop') center/cover; z-index: 9999; display: flex; align-items: center; justify-content: center; transition: opacity 0.5s ease; }
        #auth-wall::before { content: ''; position: absolute; inset: 0; background: rgba(253, 251, 247, 0.7); backdrop-filter: blur(15px); }
        .auth-box { position: relative; z-index: 1; width: 85%; padding: 40px 30px; border-radius: var(--radius-lg); box-shadow: var(--shadow-glass); text-align: center; }
        .auth-box i.fa-heart { font-size: 3.5rem; color: var(--primary); margin-bottom: 20px; animation: pulseHeart 2s infinite; }
        .auth-box h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 25px; color: var(--text-main); letter-spacing: 1px; }

        /* 공통 폼 UI */
        .form-input, .form-textarea, .form-select { width: 100%; padding: 18px 20px; background: rgba(255,255,255,0.9); border: 1px solid var(--border-light); border-radius: var(--radius-sm); margin-bottom: 15px; font-size: 1.05rem; transition: 0.3s; outline: none; box-shadow: inset 0 2px 5px rgba(0,0,0,0.01); color: var(--text-main); }
        .form-input.center { text-align: center; letter-spacing: 2px; }
        .form-input:focus, .form-textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); background: white; }
        .btn-primary { width: 100%; background: var(--primary); color: white; border: none; padding: 18px; border-radius: var(--radius-sm); font-size: 1.1rem; font-weight: 800; cursor: pointer; transition: 0.2s; box-shadow: var(--shadow-float); }
        .btn-primary:active { transform: scale(0.96); box-shadow: 0 5px 15px rgba(255, 123, 123, 0.2); }

        /* 역할(이름) 선택 버튼 UI */
        .role-btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; }
        .role-btn { background: white; border: 2px solid var(--border-light); border-radius: var(--radius-md); padding: 25px 10px; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; align-items: center; gap: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .role-btn i { font-size: 2.5rem; color: var(--text-muted); transition: 0.3s; }
        .role-btn span { font-size: 1.1rem; font-weight: 800; color: var(--text-main); }
        .role-btn:active { transform: scale(0.95); }
        .role-btn.boy:hover { border-color: var(--secondary); background: var(--secondary-light); }
        .role-btn.boy:hover i { color: var(--secondary); }
        .role-btn.girl:hover { border-color: var(--primary); background: var(--primary-light); }
        .role-btn.girl:hover i { color: var(--primary); }

        /* 토스트 및 모달 공통 */
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: rgba(30, 30, 30, 0.9); backdrop-filter: blur(10px); color: white; padding: 14px 24px; border-radius: 30px; font-size: 0.95rem; font-weight: 700; opacity: 0; transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 10000; box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 10px; white-space: nowrap; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 4000; display: none; align-items: center; justify-content: center; opacity: 0; transition: 0.3s; padding: 20px; }
        .modal-overlay.active { display: flex; opacity: 1; }
        
        /* 팝업형 모달 */
        .modal-content.popup { width: 100%; max-width: 450px; max-height: 90vh; border-radius: var(--radius-lg); display: flex; flex-direction: column; transform: scale(0.95) translateY(20px); transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); background: #FFF; box-shadow: var(--shadow-glass); overflow: hidden; }
        .modal-overlay.active .modal-content.popup { transform: scale(1) translateY(0); }
        
        /* 바텀 시트 모달 (달력 Day View, 글쓰기 등) */
        .modal-overlay.bottom-sheet { align-items: flex-end; padding: 0; }
        .modal-content.sheet { width: 100%; max-width: 480px; max-height: 90vh; background: #FFF; border-radius: 32px 32px 0 0; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0,0,0,0.1); }
        body:not(.mobile-frame-mode) .modal-content.sheet { max-width: 600px; margin: 0 auto; }
        .modal-overlay.active .modal-content.sheet { transform: translateY(0); }
        .sheet-handle { width: 40px; height: 5px; background: #E5E7EB; border-radius: 5px; margin: 15px auto 5px; }

        .modal-header { padding: 20px 25px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-light); }
        .modal-body { padding: 25px; overflow-y: auto; flex-grow: 1; }
        .btn-close { background: none; border: none; font-size: 1.4rem; color: var(--text-muted); cursor: pointer; transition: 0.2s; padding: 5px; }
        .btn-close:hover { color: var(--primary); }

        /* 상단 헤더 & 하단 탭 */
        .app-header { position: sticky; top: 0; width: 100%; height: 65px; z-index: 50; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; border-bottom: 1px solid rgba(0,0,0,0.02); }
        .header-title { font-size: 1.2rem; font-weight: 800; color: var(--primary); letter-spacing: 0.5px; font-family: 'Georgia', serif; font-style: italic; }
        /* 시계 폰트 부드럽게 변경 */
        .header-clock { font-size: 0.9rem; font-weight: 400; color: var(--text-muted); font-variant-numeric: tabular-nums; letter-spacing: 0.5px; }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .icon-btn { background: none; border: none; font-size: 1.25rem; color: var(--text-muted); cursor: pointer; transition: 0.2s; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .icon-btn:hover, .icon-btn.active { color: var(--primary); background: var(--primary-light); }

        .bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; height: var(--nav-height); z-index: 100; display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); border-top: 1px solid var(--border-light); }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 33%; height: 100%; color: var(--text-muted); text-decoration: none; transition: 0.3s; cursor: pointer; gap: 4px; }
        .nav-item i { font-size: 1.35rem; transition: 0.3s; }
        .nav-item span { font-size: 0.75rem; font-weight: 700; }
        .nav-item.active { color: var(--primary); }
        .nav-item.active i { transform: translateY(-3px); filter: drop-shadow(0 2px 5px rgba(255,123,123,0.3)); }

        /* 홈 뷰 */
        .container { padding: 20px; }
        .banner-wrap { position: relative; width: 100%; height: 380px; border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-card); margin-bottom: 25px; cursor: zoom-in; }
        .banner-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.5s ease; z-index: 1; }
        .banner-img.active { opacity: 1; z-index: 2; }
        .banner-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 60%); z-index: 3; }
        .banner-content { position: absolute; bottom: 30px; left: 0; width: 100%; text-align: center; z-index: 4; color: white; }
        .dday-badge { display: inline-block; background: rgba(255,255,255,0.25); backdrop-filter: blur(10px); padding: 6px 18px; border-radius: 20px; font-size: 0.9rem; font-weight: 700; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.4); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .dday-num { font-size: 4.5rem; font-weight: 800; font-family: 'Georgia', serif; line-height: 1; margin-bottom: 5px; text-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        
        .edit-badge { position: absolute; top: 15px; background: rgba(255,255,255,0.95); padding: 8px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; cursor: pointer; border: none; z-index: 10; display: flex; align-items: center; gap: 5px; box-shadow: var(--shadow-glass); transition: 0.2s; color: var(--text-main); }
        .edit-badge:active { transform: scale(0.95); }

        .widget-card { border-radius: var(--radius-md); padding: 25px; margin-bottom: 25px; box-shadow: var(--shadow-card); border: 1px solid var(--border-light); }
        .widget-title { font-size: 1.25rem; font-weight: 800; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; color: var(--text-main); }
        .profile-flex { display: flex; justify-content: space-evenly; align-items: center; }
        .profile-pic { width: 95px; height: 95px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary-light); box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 10px; }
        .profile-item { text-align: center; }
        .profile-item span { font-weight: 800; font-size: 1.1rem; color: var(--text-main); }

        .timeline-box { max-height: 300px; overflow-y: auto; padding-right: 5px; }
        .tl-item { display: flex; gap: 15px; margin-bottom: 20px; position: relative; }
        .tl-line { position: absolute; left: 5px; top: 25px; bottom: -20px; width: 2px; background: var(--border-light); }
        .tl-item:last-child .tl-line { display: none; }
        .tl-dot { width: 12px; height: 12px; background: var(--primary); border-radius: 50%; z-index: 2; margin-top: 5px; box-shadow: 0 0 0 4px var(--primary-light); }
        .tl-content { flex-grow: 1; background: #FFF; padding: 15px 20px; border-radius: 16px; border: 1px solid var(--border-light); }
        .tl-date { font-size: 0.85rem; font-weight: 800; color: var(--primary); margin-bottom: 4px; }
        .tl-desc { font-size: 1.05rem; color: var(--text-main); font-weight: 500; }

        /* 캘린더 화면 */
        .cal-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 0 5px; }
        .cal-month-title { font-size: 1.7rem; font-weight: 800; font-family: 'Georgia', serif; }
        .cal-nav-btn { background: #FFF; border: 1px solid var(--border-light); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.02); transition: 0.2s; }
        .cal-nav-btn:active { background: var(--border-light); }
        
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 20px 15px; border-radius: var(--radius-lg); box-shadow: var(--shadow-card); border: 1px solid var(--border-light); touch-action: pan-y; }
        .cal-day-name { text-align: center; font-weight: 800; font-size: 0.85rem; padding-bottom: 10px; border-bottom: 1px solid var(--border-light); margin-bottom: 5px; color: var(--text-muted); }
        .cal-cell { aspect-ratio: 1/1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 8px; border-radius: 14px; cursor: pointer; font-weight: 600; font-size: 1.05rem; transition: 0.2s; position: relative; border: 2px solid transparent; }
        .cal-cell:active { background: #F3F4F6; transform: scale(0.95); }
        .cal-cell.today { background: var(--primary-light); color: var(--primary); font-weight: 800; }
        .cal-cell.holiday { color: var(--holiday); }
        .cal-cell.saturday { color: var(--saturday); }
        .cal-indicators { display: flex; gap: 4px; margin-top: 4px; }
        .dot-marker { width: 5px; height: 5px; border-radius: 50%; }

        /* 바텀시트: Day View 목록 */
        .day-entry-item { background: #F9FAFB; padding: 18px; border-radius: 16px; margin-bottom: 12px; border-left: 4px solid var(--primary); cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; gap: 4px; }
        .day-entry-item:active { background: var(--primary-light); transform: scale(0.98); }
        .day-entry-item.schedule { border-left-color: var(--secondary); }
        .entry-cat { font-size: 0.8rem; font-weight: 800; color: var(--text-muted); }
        .entry-title { font-size: 1.15rem; font-weight: 800; color: var(--text-main); }

        /* 게시판 화면 */
        .board-tabs { display: flex; gap: 12px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .board-tab { background: none; border: none; font-size: 1.1rem; font-weight: 800; color: var(--text-muted); cursor: pointer; padding: 8px 4px; position: relative; white-space: nowrap; transition: 0.2s; }
        .board-tab.active { color: var(--text-main); }
        .board-tab.active::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 100%; height: 4px; background: var(--primary); border-radius: 4px; }

        .post-card { border-radius: var(--radius-md); padding: 22px; cursor: pointer; border: 1px solid var(--border-light); margin-bottom: 15px; display: flex; gap: 15px; box-shadow: var(--shadow-card); transition: 0.3s; }
        .post-card:active { transform: scale(0.98); }
        .post-text-wrap { flex-grow: 1; overflow: hidden; }
        .post-cat-badge { background: var(--primary-light); color: var(--primary-dark); padding: 5px 12px; border-radius: 12px; font-weight: 800; font-size: 0.8rem; display: inline-block; margin-bottom: 8px; }
        .post-title { font-size: 1.25rem; font-weight: 800; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
        .post-preview { font-size: 1rem; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.5; }
        .post-timestamp { font-size: 0.85rem; color: #CBD5E0; margin-top: 12px; font-weight: 500; }
        
        .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .gallery-item { border-radius: var(--radius-sm); overflow: hidden; cursor: pointer; position: relative; aspect-ratio: 1/1; box-shadow: var(--shadow-card); }
        .gallery-item img, .gallery-item video { width: 100%; height: 100%; object-fit: cover; }
        
        /* 인라인 댓글 (목록 뷰 하단) */
        .inline-comments { background: #F8F9FA; padding: 15px; border-radius: 14px; margin-top: 15px; border-top: 1px dashed var(--border-light); }
        .inline-comment-item { display: flex; justify-content: space-between; font-size: 0.95rem; margin-bottom: 8px; align-items: flex-start; }
        .inline-comment-input-wrap { display: flex; gap: 8px; margin-top: 12px; }
        .inline-comment-input-wrap input { flex-grow: 1; padding: 12px 15px; border: 1px solid var(--border-light); border-radius: 12px; outline: none; background: #FFF; font-size: 0.95rem; }
        .inline-comment-input-wrap button { padding: 0 18px; background: var(--text-main); color: white; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; }

        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 25px; }
        .page-btn { width: 36px; height: 36px; border-radius: 50%; background: #FFF; border: 1px solid var(--border-light); color: var(--text-muted); font-weight: 800; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .page-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 15px rgba(255,123,123,0.3); }

        .fab { position: absolute; bottom: calc(var(--nav-height) + 20px); right: 20px; width: 60px; height: 60px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; box-shadow: var(--shadow-float); border: none; z-index: 90; cursor: pointer; transition: 0.2s; }
        .fab:active { transform: scale(0.9) rotate(45deg); }

        #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 6000; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; }
        #lightbox img, #lightbox video { max-width: 95vw; max-height: 95vh; border-radius: 16px; object-fit: contain; }
    </style>
</head>
<body>
    
    <div id="app-wrapper">
        
        <!-- 커스텀 토스트 알림 -->
        <div id="toast"><i class="fa-solid fa-heart" style="color:var(--primary);"></i> <span id="toastMsg">메시지</span></div>

        <!-- 커스텀 Confirm 모달 -->
        <div class="modal-overlay" id="confirmModal" style="z-index: 5000;">
            <div class="modal-content popup glass" style="max-width: 320px; padding: 35px 25px; text-align: center;">
                <i class="fa-solid fa-circle-exclamation" style="font-size: 3rem; color: var(--primary); margin-bottom: 20px;"></i>
                <h3 style="font-size: 1.2rem; font-weight: 800; margin-bottom: 25px; color: var(--text-main);" id="confirmMsg">정말 삭제할까요?</h3>
                <div style="display: flex; gap: 10px; width: 100%;">
                    <button class="btn-primary" style="background: #F1F3F5; color: var(--text-main); flex: 1;" id="confirmBtnNo">취소</button>
                    <button class="btn-primary" style="flex: 1;" id="confirmBtnYes">확인</button>
                </div>
            </div>
        </div>

        <!-- 1. 시크릿 로그인 화면 -->
        <div id="auth-wall">
            <div class="auth-box glass fade-up">
                <i class="fa-solid fa-heart"></i>
                <h1>Secret Place</h1>
                <p style="color:var(--text-muted); font-size:0.95rem; margin-bottom:30px; font-weight:500;">우리만의 암호를 입력해 주세요.</p>
                <input type="text" class="form-input center" id="l_id" placeholder="아이디">
                <input type="password" class="form-input center" id="l_pw" placeholder="비밀번호" onkeydown="if(event.key==='Enter') submitLogin()">
                <button class="btn-primary" onclick="submitLogin()">입장하기</button>

    <script>
        /* =========================================================
           1. 기본 세팅 & 상태 관리
           ========================================================= */
        let user = null;
        let authorName = localStorage.getItem('couple_author') || '';
        let postsData = []; let commentsData = []; let timelineData = []; 
        let siteSettings = {}; let customHolidays = {};
        
        // 대한민국 기본 공휴일 (고정)
        const defaultHolidays = {
            "01-01":"신정", "03-01":"삼일절", "05-05":"어린이날", "06-06":"현충일",
            "08-15":"광복절", "10-03":"개천절", "10-09":"한글날", "12-25":"크리스마스"
        };
        
        let currentBoardTab = '전체'; 
        let pendingConfirmAction = null;
        
        let currentPage = 1;
        const postsPerPage = 5;

        // 하이브리드 앱 모드 (PC 프레임 유지)
        let isHybridMode = localStorage.getItem('hybrid_mode') === 'true';
        if(isHybridMode) document.body.classList.add('mobile-frame-mode');

        function toggleHybridMode() {
            isHybridMode = !isHybridMode; localStorage.setItem('hybrid_mode', isHybridMode);
            if(isHybridMode) document.body.classList.add('mobile-frame-mode');
            else document.body.classList.remove('mobile-frame-mode');
            document.getElementById('hybridToggleBtn').innerText = `현재: ${isHybridMode ? 'ON' : 'OFF'}`;
            showToast("화면 모드가 변경되었습니다.");
        }

        /* =========================================================
           2. 공통 UI 유틸 (토스트, 모달, 포맷팅)
           ========================================================= */
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function customConfirm(msg, action) {
            document.getElementById('confirmMsg').innerText = msg;
            pendingConfirmAction = action;
            showModal('confirmModal');
        }

        function showModal(id) { 
            const el = document.getElementById(id);
            el.style.display = 'flex'; void el.offsetWidth; el.classList.add('active');
        }
        function hideModal(id) { 
            const el = document.getElementById(id);
            el.classList.remove('active');
            setTimeout(() => { if(!el.classList.contains('active')) el.style.display = 'none'; }, 300);
        }
        
        function openLightbox(url) {
            const ext = url.split('.').pop().toLowerCase();
            let html = '';
            if(['mp4','webm','ogg'].includes(ext)) {
                html = `<video src="${url}" controls autoplay style="max-width:95vw; max-height:95vh; border-radius:16px;"></video>`;
            } else {
                html = `<img src="${url}" style="max-width:95vw; max-height:95vh; border-radius:16px; object-fit:contain;">`;
            }
            document.getElementById('lightboxContent').innerHTML = html;
            const lb = document.getElementById('lightbox');
            lb.style.display = 'flex'; void lb.offsetWidth; lb.style.opacity = '1';
        }
        function closeLightbox() {
            const lb = document.getElementById('lightbox');
            lb.style.opacity = '0';
            document.getElementById('lightboxContent').innerHTML = ''; // 미디어 정지
            setTimeout(() => { lb.style.display = 'none'; }, 300);
        }

        function formatDate(date) {
            const d = new Date(date);
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
        }

        function getMediaHTML(url) {
            if(!url) return '';
            const ext = url.split('.').pop().toLowerCase();
            if(['mp4', 'webm', 'ogg'].includes(ext)) {
                return `<video controls src="${url}" style="width:100%; border-radius:16px; margin-bottom:20px;"></video>`;
            } else if(['mp3', 'wav', 'm4a'].includes(ext)) {
                return `<audio controls src="${url}" style="width:100%; margin-bottom:20px; outline:none;"></audio>`;
            } else {
                return `<img src="${url}" style="width:100%; border-radius:16px; margin-bottom:20px; cursor:zoom-in;" onclick="openLightbox('${url}')">`;
            }
        }

        /* =========================================================
           6. 캘린더 & Day View (바텀 시트 모달)
           ========================================================= */
        let currentCalDate = new Date();
        
        function renderCalendar() {
            const year = currentCalDate.getFullYear(); const month = currentCalDate.getMonth();
            document.getElementById('cal-month-year').innerText = `${year}. ${String(month+1).padStart(2,'0')}`;
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const grid = document.getElementById('calendar-days');
            
            const daysArr = ['일','월','화','수','목','금','토'];
            let html = daysArr.map((d,i) => `<div class="cal-day-name ${i===0?'sun':(i===6?'sat':'')}">${d}</div>`).join('');
            const todayStr = new Date().toISOString().split('T')[0];

            for(let i=0; i<firstDay; i++) html += `<div class="cal-cell empty"></div>`;
            
            for(let d=1; d<=daysInMonth; d++) {
                const mmdd = `${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const dateStr = `${year}-${mmdd}`;
                
                // Helper parser for author Meta
                const dayPosts = postsData.filter(p => {
                    const prt = (p.author||'').split('|');
                    return (prt[3] === '다이어리' || prt[3] === '일정') && prt[4] === dateStr;
                });
                const hasDiary = dayPosts.some(p => (p.author||'').split('|')[3] === '다이어리');
                const hasSchedule = dayPosts.some(p => (p.author||'').split('|')[3] === '일정');
                
                let classes = ['cal-cell'];
                if(dateStr === todayStr) classes.push('today');
                
                const dayOfWeek = new Date(year, month, d).getDay();
                
                // 휴일 로직 (기본 + 커스텀)
                let holName = '';
                if(defaultHolidays[mmdd]) holName = defaultHolidays[mmdd];
                if(customHolidays[dateStr]) holName = customHolidays[dateStr];
                
                if(dayOfWeek === 0 || holName !== '') classes.push('holiday');
                else if(dayOfWeek === 6) classes.push('saturday');

                let indicators = '';
                if(hasDiary) indicators += `<div class="dot-diary"></div>`;
                if(hasSchedule) indicators += `<div class="dot-schedule"></div>`;
                
                html += `<div class="${classes.join(' ')}" onclick="openDayView(this, '${dateStr}', '${holName}')">
                    ${d}
                    <div class="cal-holiday-name">${holName}</div>
                    <div class="cal-indicators">${indicators}</div>
                </div>`;
            }
            grid.innerHTML = html;
        }

        }

        function bindEvents() {
            // 스와이프
            let touchStartX = 0;
            const calArea = document.getElementById('calendar-area');
            calArea.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX, {passive: true});
            calArea.addEventListener('touchend', e => {
                let touchEndX = e.changedTouches[0].screenX;
                if(touchEndX < touchStartX - 50) changeMonth(1); 
                if(touchEndX > touchStartX + 50) changeMonth(-1); 
            }, {passive: true});

            // 키보드 화살표
            document.addEventListener('keydown', (e) => {
                if(document.getElementById('view-calendar').classList.contains('active')) {
                    if(e.key === 'ArrowLeft') changeMonth(-1);
                    if(e.key === 'ArrowRight') changeMonth(1);
                }
            });
        }

        async function submitPost() {
            const cat = document.getElementById('postCategory').value; 
            const title = document.getElementById('postTitle').value.trim(); 
            const content = document.getElementById('postContent').value.trim(); 
            const dateStr = document.getElementById('postDate').value || new Date().toISOString().split('T')[0];
            const file = document.getElementById('postImage').files[0];

            if(!title) return showToast('제목을 입력하세요.');
            if(cat === '갤러리' && !file) return showToast('갤러리는 사진 첨부가 필수입니다!');

            const fd = new FormData();
            fd.append('author', authorName); fd.append('username', user?user.username:'ourlove');
            fd.append('title', title); fd.append('category', cat); fd.append('date', dateStr);
            fd.append('content', content); if(file) fd.append('image', file);

            try {
                showToast("기록을 저장하는 중...");
                const res = await fetch('/api/posts', { method:'POST', body:fd });
                if(res.ok) { hideModal('writeModal'); loadApiData(); showToast("기록되었습니다! 💖"); }
                else showToast("저장 실패");
            } catch(e) {
                // 테스트 폴백
                const fakeUrl = file ? 'https://via.placeholder.com/600x400?text=Uploaded' : '';
                postsData.unshift({id: Date.now(), author: `${authorName}||${title}|${cat}|${dateStr}`, content: content, image_url: fakeUrl, created_at: formatDate(new Date())});
                hideModal('writeModal'); renderCalendar(); processFilteredPosts(); showToast("로컬에 기록되었습니다. (API 없음)");
            }
        }

        function processFilteredPosts() {
            const list = document.getElementById('boardList'); const pageArea = document.getElementById('paginationArea');
            list.innerHTML = ''; pageArea.innerHTML = '';
            
            let filtered = postsData.filter(p => {
                const prt = (p.author||'').split('|'); const cat = prt[3] || '일상';
                if(currentBoardTab === '전체') return cat !== '다이어리' && cat !== '일정';
                return cat === currentBoardTab;
            });
            
            if(filtered.length === 0) { list.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:50px 0;">작성된 기록이 없습니다.</p>`; list.className=''; return; }

            const totalPages = Math.ceil(filtered.length / postsPerPage);
            const startIndex = (currentPage - 1) * postsPerPage;
            const paginatedPosts = filtered.slice(startIndex, startIndex + postsPerPage);

            if(currentBoardTab === '갤러리') {
                list.className = 'gallery-grid';
                paginatedPosts.forEach((p) => {
                    const prt = (p.author||'').split('|');
                    list.innerHTML += `
                        <div class="gallery-item glass" onclick="openDetailById(${p.id})">
                            ${getMediaHTML(p.image_url)}
                            <div class="gallery-overlay"><span>${prt[2]||''}</span></div>
                        </div>`;
                });
            } else {
                list.className = 'post-list';
                paginatedPosts.forEach((p) => {
                    const prt = (p.author||'').split('|');
                    const postComments = commentsData.filter(c => c.post_id === p.id);
                    const previewComments = postComments.slice(-3);
                    let inlineHtml = previewComments.map(c => `
                        <div class="inline-comment-item">
                            <div><span class="inline-comment-author">${c.author}</span><span style="color:var(--text-main); font-size:0.95rem;">${c.content}</span></div>
                            <span class="inline-comment-time">${(c.created_at||'').slice(5,16)}</span>
                        </div>
                    `).join('');
                    
                    if(!inlineHtml) inlineHtml = `<div style="font-size:0.85rem; color:var(--text-muted);">첫 댓글을 남겨보세요.</div>`;

                    list.innerHTML += `
                        <div class="post-card glass">
                            <div class="post-text-wrap">
                                <div onclick="openDetailById(${p.id})">
                                    <div><span class="post-cat-badge">${prt[3]||''}</span></div>
                                    <div class="post-title">${prt[2]||''}</div>
                                    <div class="post-preview">${p.content}</div>
                                    <div class="post-timestamp">${p.created_at || ''} · ${prt[0]||''}</div>
                                </div>
                                <div class="inline-comments">
                                    <div style="font-size:0.85rem; font-weight:800; color:var(--primary); margin-bottom:10px;"><i class="fa-regular fa-comment-dots"></i> 댓글 (${postComments.length})</div>
                                    ${inlineHtml}
                                    <div class="inline-comment-input-wrap">
                                        <input type="text" id="inline-comment-${p.id}" placeholder="따뜻한 한마디..." onkeydown="if(event.key==='Enter') submitInlineComment(${p.id})">
                                        <button onclick="submitInlineComment(${p.id})">등록</button>
                                    </div>
                                </div>
                            </div>
                            ${p.image_url ? `<div style="width:110px; height:110px; flex-shrink:0;">${getMediaHTML(p.image_url)}</div>` : ''}
                        </div>`;
                });
            }

            if (totalPages > 1) {
                let pageHtml = '';
                for(let i=1; i<=totalPages; i++) pageHtml += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
                pageArea.innerHTML = pageHtml;
            }
        }

        function goToPage(num) {
            currentPage = num; processFilteredPosts();

        }

        async function submitInlineComment(postId) {
            const input = document.getElementById(`inline-comment-${postId}`); const content = input.value.trim();
            if (!content) return;
            try {
                await fetch('/api/comments', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ postId: postId, author: authorName || '우리', content }) });
                loadApiData(); showToast('댓글이 등록되었습니다.');
            } catch(e) {
                commentsData.push({ id: Date.now(), post_id: postId, author: authorName || '우리', content: content, created_at: formatDate(new Date()) });
                processFilteredPosts(); showToast('로컬 댓글 등록 완료.');
            }
        }

        function openDetailById(id) {
            const p = postsData.find(item => item.id === id); if(!p) return;
            activePost = p;
            const prt = (p.author||'').split('|');
            document.getElementById('modalCategory').innerText = prt[3]||'기록';
            document.getElementById('modalDateMeta').innerText = prt[4] ? `${prt[4]} / ${p.created_at||''}` : (p.created_at||'');
            document.getElementById('modalAuthor').innerText = prt[0]||'';
            document.getElementById('modalTitle').innerText = prt[2]||'무제';
            document.getElementById('modalContent').innerText = p.content;
            document.getElementById('modalImageWrap').innerHTML = getMediaHTML(p.image_url);
            
            renderComments(); showModal('detailModal');

        function renderComments() {
            if(!activePost) return;
            const postComments = commentsData.filter(c => c.post_id === activePost.id);
            document.getElementById('modalCommentsHeader').innerHTML = `댓글 <span style="color:var(--primary);">${postComments.length}</span>`;
            document.getElementById('modalCommentsList').innerHTML = postComments.map(c => `
                <div style="display:flex; justify-content:space-between; font-size:0.95rem; border-bottom:1px solid var(--border-light); padding-bottom:10px;">
                    <div><b style="color:var(--text-main); margin-right:8px;">${c.author}</b> <span style="color:#4A5568;">${c.content}</span><br><span style="font-size:0.75rem; color:var(--text-muted);">${c.created_at||''}</span></div>
                    ${(isEditMode || c.author === authorName) ? `<button style="background:none; border:none; color:var(--holiday); cursor:pointer; padding:5px;" onclick="customConfirm('댓글을 지울까요?', () => deleteComment(${c.id}))"><i class="fa-solid fa-xmark"></i></button>` : ''}
                </div>
            `).join('');
            document.getElementById('modal-comment-input').value = '';
        }

        async function submitComment() {
            if(!activePost) return;
            const content = document.getElementById('modal-comment-input').value.trim(); if (!content) return;
            try {
                await fetch('/api/comments', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ postId: activePost.id, author: authorName || '우리', content }) });
                loadApiData(); setTimeout(()=>openDetailById(activePost.id), 300);
            } catch(e) {
                commentsData.push({ id: Date.now(), post_id: activePost.id, author: authorName || '우리', content: content, created_at: formatDate(new Date()) });
                renderComments(); if(document.getElementById('view-board').classList.contains('active')) processFilteredPosts();
            }
        }
        
        async function deleteComment(id) {
            try { await fetch('/api/comments', { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) }); loadApiData(); setTimeout(()=>openDetailById(activePost.id), 300); }
            catch(e) { commentsData = commentsData.filter(c => c.id !== id); renderComments(); processFilteredPosts(); showToast('삭제되었습니다.'); }
        }

        function openEditFromDetail() {
            hideModal('detailModal'); if(!activePost) return;
            const prt = (activePost.author||'').split('|');
            document.getElementById('editPostId').value = activePost.id; 
            document.getElementById('editAuthorMeta').value = `${prt[0]}|${prt[1]}`;
            document.getElementById('editCategory').value = prt[3]||'일상';
            document.getElementById('editDateStr').value = prt[4]||'';
            document.getElementById('editKeepImage').value = activePost.image_url||'';
            document.getElementById('editTitle').value = prt[2]||''; 
            document.getElementById('editContent').value = activePost.content; 
            showModal('editModal');
        }

        async function submitEdit() {
            const fd = new FormData();
            fd.append('id', document.getElementById('editPostId').value);
            fd.append('authorMeta', document.getElementById('editAuthorMeta').value);
            fd.append('category', document.getElementById('editCategory').value);
            fd.append('date', document.getElementById('editDateStr').value);
            fd.append('keepImage', document.getElementById('editKeepImage').value);
            fd.append('title', document.getElementById('editTitle').value.trim());
            fd.append('content', document.getElementById('editContent').value.trim());
            const file = document.getElementById('editImage').files[0];
            if(file) fd.append('image', file);

            try {
                showToast("수정 중...");
                const res = await fetch('/api/posts', { method:'PUT', body:fd });
                if(res.ok) { hideModal('editModal'); loadApiData(); showToast("수정 완료!"); }
            } catch(e) { showToast("수정 실패 (API 없음)"); hideModal('editModal'); }
        }

        function deleteFromDetail() {
            customConfirm("추억을 완전히 삭제할까요?", async () => {
                try {
                    await fetch('/api/posts', { method:'DELETE', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:activePost.id}) });
                    hideModal('detailModal'); loadApiData(); showToast("삭제되었습니다.");
                } catch(e) {
                    postsData = postsData.filter(p => p.id !== activePost.id);
                    hideModal('detailModal'); renderCalendar(); processFilteredPosts(); showToast("삭제되었습니다.");
                }
            });
        }
    </script>
</body>
</html>
