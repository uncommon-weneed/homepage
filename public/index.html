<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Our Secret Space 💖</title>
    
    <!-- Web Fonts & Icons -->
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* 2026 Soft Romantic & Glassmorphism Theme */
            --primary: #FF8282;       
            --primary-light: #FFF0F0; 
            --primary-dark: #E56A6A;
            --secondary: #A0C4E2;     
            --bg-base: #FCF9F6;       
            --surface: rgba(255, 255, 255, 0.85); 
            --text-main: #3D3D3D;
            --text-muted: #9CA3AF;
            --border-light: rgba(255, 130, 130, 0.15);
            --shadow-soft: 0 8px 24px rgba(255, 130, 130, 0.08);
            --shadow-glass: 0 10px 30px rgba(0, 0, 0, 0.05);
            --radius-sm: 12px;
            --radius-md: 20px;
            --radius-lg: 32px;
            --nav-height: 70px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-base); color: var(--text-main); overflow-x: hidden; scroll-behavior: smooth; }

        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 130, 130, 0.3); border-radius: 10px; }

        /* 애니메이션 */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.9) translateY(20px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes pulseAlert { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @keyframes expandDown { from { opacity: 0; max-height: 0; transform: translateY(-10px); } to { opacity: 1; max-height: 500px; transform: translateY(0); } }
        
        .fade-up { opacity: 0; transform: translateY(20px); transition: 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
        .fade-up.visible { opacity: 1; transform: translateY(0); }
        .glass { background: var(--surface); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: var(--shadow-glass); }

        /* 하이브리드 앱 프레임 (PC에서 모바일 비율 고정용) */
        #app-wrapper { width: 100%; height: 100vh; position: relative; display: flex; justify-content: center; overflow: hidden; background: var(--bg-base); transition: 0.3s; }
        body.mobile-frame-mode #app-wrapper { background: #E5E7EB; }
        #app-container { width: 100%; height: 100vh; position: relative; display: flex; flex-direction: column; background: var(--bg-base); transition: 0.3s; }
        body.mobile-frame-mode #app-container { max-width: 480px; box-shadow: 0 0 40px rgba(0,0,0,0.1); }

        /* 편집 모드 뱃지 */
        .edit-mode-only { display: none !important; }
        body.edit-mode .edit-mode-only { display: flex !important; }
        body.edit-mode .edit-mode-only-inline { display: inline-block !important; }
        
        /* 뷰 컨트롤 */
        .view-section { display: none; flex-grow: 1; overflow-y: auto; padding-bottom: calc(var(--nav-height) + 30px); animation: fadeIn 0.4s ease; position: relative; }
        .view-section.active { display: block; }

        /* 1. 시크릿 인증 월 & 작성자 이름 모달 */
        #auth-wall { position: absolute; inset: 0; background: url('https://images.unsplash.com/photo-1518621736915-f3b1c41bfd00?q=80&w=1920&auto=format&fit=crop') center/cover; z-index: 9999; display: flex; align-items: center; justify-content: center; transition: opacity 0.5s ease; }
        #auth-wall::before { content: ''; position: absolute; inset: 0; background: rgba(253, 251, 247, 0.85); backdrop-filter: blur(10px); }
        .auth-box { position: relative; z-index: 1; padding: 40px 30px; border-radius: var(--radius-lg); width: 90%; max-width: 380px; text-align: center; }
        .auth-box i.fa-heart { font-size: 3rem; color: var(--primary); margin-bottom: 20px; animation: pulseAlert 2s infinite; }
        .auth-box h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 25px; letter-spacing: 1px; }
        
        /* 공통 폼 UI */
        .form-input, .form-textarea, .form-select { width: 100%; padding: 16px; background: rgba(255,255,255,0.9); border: 1px solid var(--border-light); border-radius: var(--radius-sm); margin-bottom: 15px; font-size: 1.05rem; transition: 0.3s; outline: none; }
        .form-input.auth { text-align: center; letter-spacing: 2px; }
        .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); background: white; }
        .btn-primary { width: 100%; background: var(--primary); color: white; border: none; padding: 16px; border-radius: var(--radius-sm); font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(255,130,130,0.3); }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-2px); }

        /* 토스트 및 커스텀 Confirm 모달 */
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 16px 25px; border-radius: 30px; font-size: 0.95rem; font-weight: 700; opacity: 0; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 10000; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid var(--border-light); }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); z-index: 3000; display: none; align-items: center; justify-content: center; padding: 20px; opacity: 0; transition: opacity 0.3s ease; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content { width: 100%; max-width: 550px; max-height: 90vh; border-radius: var(--radius-lg); display: flex; flex-direction: column; overflow: hidden; transform: scale(0.95) translateY(20px); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); background: #fff; box-shadow: var(--shadow-glass); }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); }
        .modal-header { padding: 25px 30px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-light); }
        .modal-body { padding: 25px 30px; overflow-y: auto; flex-grow: 1; }
        .btn-close { background: none; border: none; font-size: 1.5rem; color: var(--text-muted); cursor: pointer; transition: 0.2s; }
        .btn-close:hover { color: var(--primary); }

        /* 헤더 및 네비게이션 */
        .app-header { position: sticky; top: 0; width: 100%; height: 65px; z-index: 50; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        .header-clock { font-size: 0.9rem; font-weight: 700; color: var(--primary); font-family: monospace; letter-spacing: 0.5px; }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .icon-btn { background: none; border: none; font-size: 1.2rem; color: var(--text-muted); cursor: pointer; transition: 0.2s; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .icon-btn:hover, .icon-btn.active { color: var(--primary); background: var(--primary-light); transform: rotate(90deg); }

        .bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; height: var(--nav-height); z-index: 100; display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); border-top: 1px solid rgba(255,255,255,0.5); }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 30%; height: 100%; color: var(--text-muted); text-decoration: none; transition: 0.3s; cursor: pointer; }
        .nav-item i { font-size: 1.3rem; margin-bottom: 4px; transition: 0.3s; }
        .nav-item.active { color: var(--primary); }
        .nav-item.active i { transform: translateY(-3px); }

        /* 홈 뷰 */
        .container { padding: 20px; }
        .banner-wrap { position: relative; width: 100%; height: 350px; border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 30px; box-shadow: var(--shadow-soft); cursor: zoom-in; }
        .banner-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.5s ease; z-index: 1; }
        .banner-img.active { opacity: 1; z-index: 2; }
        .banner-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.6), transparent); z-index: 3; }
        .banner-content { position: absolute; bottom: 30px; left: 0; width: 100%; text-align: center; z-index: 4; color: white; }
        .dday-num { font-size: 4rem; font-weight: 800; font-family: 'Georgia', serif; line-height: 1; margin-bottom: 5px; }

        .edit-badge { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.95); padding: 8px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; cursor: pointer; border: none; z-index: 10; display: flex; align-items: center; gap: 5px; box-shadow: var(--shadow-sm); }
        
        .widget-card { border-radius: var(--radius-md); padding: 25px; margin-bottom: 25px; }
        .widget-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 20px; display: flex; justify-content: space-between; }
        .profile-flex { display: flex; justify-content: space-around; align-items: center; }
        .profile-pic { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary-light); margin-bottom: 10px; }

        .timeline-box { max-height: 300px; overflow-y: auto; padding-right: 10px; }
        .tl-item { display: flex; gap: 15px; margin-bottom: 20px; position: relative; }
        .tl-line { position: absolute; left: 5px; top: 25px; bottom: -20px; width: 2px; background: var(--border-light); }
        .tl-item:last-child .tl-line { display: none; }
        .tl-dot { width: 12px; height: 12px; background: var(--primary); border-radius: 50%; z-index: 2; margin-top: 5px; border: 3px solid var(--surface); }
        .tl-content { flex-grow: 1; background: #FFF; padding: 15px; border-radius: 12px; border: 1px solid var(--border-light); }

        /* 캘린더 (실물 달력 UI & 인라인 확장) */
        .cal-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 0 10px; }
        .cal-month-title { font-size: 1.6rem; font-weight: 800; font-family: 'Georgia', serif; }
        .cal-nav-btn { background: var(--surface); border: 1px solid var(--border-light); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 15px; border-radius: var(--radius-lg); touch-action: pan-y; }
        .cal-day-name { text-align: center; font-weight: 700; font-size: 0.85rem; padding-bottom: 10px; border-bottom: 1px solid var(--border-light); }
        .cal-cell { aspect-ratio: 1/1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 6px; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 1rem; transition: 0.2s; position: relative; }
        .cal-cell:hover { background: #F3F4F6; }
        .cal-cell.today { background: var(--primary-light); color: var(--primary); font-weight: 800; }
        .cal-cell.selected { border: 2px solid var(--primary); }
        .cal-cell.holiday { color: #E53E3E; } /* 빨간색 공휴일 */
        .cal-cell.saturday { color: #3182CE; } /* 파란색 토요일 */
        .cal-indicators { display: flex; gap: 4px; margin-top: 4px; }
        .dot-diary { width: 5px; height: 5px; background: var(--primary); border-radius: 50%; }
        .dot-schedule { width: 5px; height: 5px; background: var(--secondary); border-radius: 50%; }

        /* 인라인 캘린더 데이 뷰 */
        .cal-inline-view { max-height: 0; overflow: hidden; opacity: 0; transition: max-height 0.4s ease, opacity 0.4s ease; margin-top: 10px; background: var(--surface); border-radius: var(--radius-md); border: 1px solid var(--border-light); }
        .cal-inline-view.active { max-height: 500px; opacity: 1; padding: 20px; box-shadow: var(--shadow-soft); }
        .day-entry-item { background: #F9FAFB; padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 4px solid var(--primary); cursor: pointer; }
        .day-entry-item.schedule { border-left-color: var(--secondary); }

        /* 스토리 (게시판) */
        .board-tabs { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .board-tab { background: none; border: none; font-size: 1.05rem; font-weight: 700; color: var(--text-muted); cursor: pointer; padding: 8px 4px; position: relative; white-space: nowrap; }
        .board-tab.active { color: var(--primary); }
        .board-tab.active::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: var(--primary); border-radius: 3px 3px 0 0; }

        .post-list { display: flex; flex-direction: column; gap: 15px; }
        .post-card { border-radius: var(--radius-md); padding: 20px; cursor: pointer; border: 1px solid var(--border-light); display: flex; gap: 15px; align-items: flex-start; }
        .post-text-wrap { flex-grow: 1; overflow: hidden; }
        .post-cat-badge { background: var(--primary-light); color: var(--primary-dark); padding: 4px 10px; border-radius: 10px; font-weight: 700; font-size: 0.8rem; }
        .post-title { font-size: 1.2rem; font-weight: 800; margin: 8px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .post-preview { font-size: 0.95rem; color: #718096; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .post-timestamp { font-size: 0.8rem; color: #CBD5E0; margin-top: 10px; }

        .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .gallery-item { border-radius: var(--radius-md); overflow: hidden; cursor: pointer; position: relative; aspect-ratio: 1/1; }
        .gallery-item img, .gallery-item video { width: 100%; height: 100%; object-fit: cover; }
        .gallery-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.3); display: flex; align-items: flex-end; padding: 15px; color: white; font-weight: 700; opacity: 0; transition: 0.3s; }
        .gallery-item:hover .gallery-overlay { opacity: 1; }

        /* 인라인 댓글 & 페이지네이션 */
        .inline-comments { background: #F8F9FA; padding: 15px; border-radius: 12px; margin-top: 15px; border-top: 1px dashed var(--border-light); }
        .inline-comment-item { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 8px; }
        .inline-comment-author { font-weight: 700; color: var(--primary); margin-right: 8px; }
        .inline-comment-time { font-size: 0.75rem; color: var(--text-muted); }
        
        .inline-comment-input-wrap { display: flex; gap: 8px; margin-top: 10px; }
        .inline-comment-input-wrap input { flex-grow: 1; padding: 10px 12px; border: 1px solid var(--border-light); border-radius: 8px; outline: none; }
        .inline-comment-input-wrap button { padding: 10px 15px; background: var(--text-main); color: white; border: none; border-radius: 8px; font-weight: 700; }

        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 25px; }
        .page-btn { width: 32px; height: 32px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border-light); color: var(--text-muted); font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* 미디어 렌더링 (비디오/오디오) */
        .media-player-wrap { width: 100%; margin-bottom: 20px; border-radius: 12px; overflow: hidden; }

        /* 모달 세부 */
        .modal-nav-btns { display: flex; justify-content: space-between; margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--border-light); }
        .modal-nav-btns button { background: #F3F4F6; border: none; padding: 8px 15px; border-radius: 8px; font-weight: 700; cursor: pointer; color: var(--text-main); }
        .modal-nav-btns button:disabled { opacity: 0.3; }

        /* 글쓰기 FAB */
        .fab { position: absolute; bottom: calc(var(--nav-height) + 20px); right: 20px; width: 56px; height: 56px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; box-shadow: 0 10px 25px rgba(255, 130, 130, 0.4); cursor: pointer; border: none; z-index: 90; }

        #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 4000; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; }
        #lightbox img, #lightbox video { max-width: 95vw; max-height: 95vh; border-radius: 12px; object-fit: contain; }
    </style>
</head>
<body>
    <!-- 동적 랩퍼 (하이브리드 앱 모드) -->
    <div id="app-wrapper">

        <!-- 토스트 & 커스텀 Confirm -->
        <div id="toast" class="toast"><i class="fa-solid fa-heart"></i> <span id="toastMsg">메시지</span></div>
        <div class="modal-overlay" id="confirmModal" style="z-index: 5000;">
            <div class="modal-content glass" style="max-width: 320px; text-align: center; padding: 30px;">
                <i class="fa-solid fa-circle-exclamation" style="font-size: 2.5rem; color: #FC8181; margin-bottom: 15px;"></i>
                <h3 style="font-size: 1.1rem; margin-bottom: 20px;" id="confirmMsg"></h3>
                <div style="display: flex; gap: 10px; width: 100%;">
                    <button class="btn-primary" id="confirmBtnYes" style="background: #FC8181; flex: 1;">확인</button>
                    <button class="btn-primary" id="confirmBtnNo" style="background: #E2E8F0; color: var(--text-main); flex: 1;">취소</button>
                </div>
            </div>
        </div>

        <!-- 1. 시크릿 로그인 화면 -->
        <div id="auth-wall">
            <div class="auth-box glass">
                <i class="fa-solid fa-heart"></i>
                <h1>Secret Place</h1>
                <p style="color:var(--text-muted); font-size:0.95rem; margin-bottom:30px;">우리만의 암호를 입력해 주세요.</p>
                <input type="text" class="form-input auth" id="l_id" placeholder="아이디">
                <input type="password" class="form-input auth" id="l_pw" placeholder="비밀번호" onkeydown="if(event.key==='Enter') submitLogin()">
                <button class="btn-primary" onclick="submitLogin()">입장하기</button>
            </div>
        </div>

        <!-- 2. 작성자 이름 설정 팝업 -->
        <div class="modal-overlay" id="authorSelectModal" style="z-index:4000;">
            <div class="modal-content glass" style="max-width: 350px; text-align: center; padding: 40px 30px;">
                <h3 style="margin-bottom:10px; font-size:1.4rem;">누가 접속했나요?</h3>
                <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:20px;">이름을 적어주세요. (예: 영재, 수진)</p>
                <input type="text" id="authorNameInput" class="form-input auth" placeholder="이름 입력" onkeydown="if(event.key==='Enter') setAuthorName()">
                <button class="btn-primary" onclick="setAuthorName()">시작하기</button>
            </div>
        </div>

        <!-- 메인 앱 컨테이너 -->
        <div id="app-container">
            <header class="app-header glass">
                <div class="header-title"><i class="fa-solid fa-heart" style="font-size:1.1rem;"></i> Our Story</div>
                <div class="header-clock" id="top-clock">00:00:00</div>
                <div class="header-actions">
                    <button class="icon-btn" onclick="showModal('settingsModal')" title="설정"><i class="fa-solid fa-gear"></i></button>
                    <button class="icon-btn" onclick="handleLogout()" title="잠그기"><i class="fa-solid fa-lock"></i></button>
                </div>
            </header>

            <nav class="bottom-nav glass">
                <a class="nav-item active" onclick="switchView('home', this)"><i class="fa-solid fa-house"></i><span>홈</span></a>
                <a class="nav-item" onclick="switchView('calendar', this)"><i class="fa-regular fa-calendar-check"></i><span>캘린더</span></a>
                <a class="nav-item" onclick="switchView('board', this)"><i class="fa-regular fa-images"></i><span>스토리</span></a>
            </nav>

            <!-- View 1: 홈 (Home) -->
            <main class="view-section active" id="view-home">
                <div class="container">
                    <div class="banner-wrap fade-up" onclick="openLightbox(document.querySelector('.banner-img.active').src)">
                        <div id="slideTrack">
                            <img src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?q=80&w=1000&auto=format&fit=crop" class="banner-img active" id="bgImg1">
                            <img src="https://images.unsplash.com/photo-1522673607200-164d1b6ce486?q=80&w=1000&auto=format&fit=crop" class="banner-img" id="bgImg2">
                        </div>
                        <div class="banner-overlay"></div>
                        <button class="edit-badge edit-mode-only" onclick="event.stopPropagation(); triggerSiteImgUpload('banner_1')" style="left:15px; right:auto;"><i class="fa-solid fa-camera"></i> 사진1 교체</button>
                        <button class="edit-badge edit-mode-only" onclick="event.stopPropagation(); triggerSiteImgUpload('banner_2')" style="left:120px; right:auto;"><i class="fa-solid fa-camera"></i> 사진2 교체</button>
                        
                        <div class="banner-content">
                            <div class="dday-badge">우리 만난 지</div>
                            <div class="dday-num" id="ddayText">D+♥</div>
                            <div class="couple-name" id="coupleNamesText">Boy & Girl</div>
                        </div>
                    </div>

                    <div class="widget-card glass fade-up">
                        <div class="widget-title">Our Profile</div>
                        <div class="profile-flex">
                            <div class="profile-item" style="position:relative;">

    </div>

    <script>
        /* =========================================================
           1. 상태 관리 & 유틸
           ========================================================= */
        let user = null;
        let authorName = localStorage.getItem('couple_author') || '';
        let postsData = []; let commentsData = []; let timelineData = []; let customHolidays = [];
        let siteSettings = {};
        
        let currentBoardTab = '전체'; 
        let currentFilteredPosts = [];
        let currentPage = 1;
        const postsPerPage = 5; 
        let activePostIndex = -1;
        let pendingConfirmAction = null;
        let isHybridMode = localStorage.getItem('hybrid_mode') === 'true';

        // 앱 껍데기 적용
        if(isHybridMode) document.body.classList.add('mobile-frame-mode');

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function customConfirm(msg, action) {
            document.getElementById('confirmMsg').innerText = msg;
            pendingConfirmAction = action;
            showModal('confirmModal');
        }

        document.getElementById('confirmBtnYes').addEventListener('click', () => {
            if(pendingConfirmAction) pendingConfirmAction();
            hideModal('confirmModal');
        });
        document.getElementById('confirmBtnNo').addEventListener('click', () => hideModal('confirmModal'));

        function showModal(id) { 
            const el = document.getElementById(id);
            el.style.display = 'flex'; void el.offsetWidth; el.classList.add('active');
        }
        function hideModal(id) { 
            const el = document.getElementById(id);
            el.classList.remove('active');
            setTimeout(() => { if(!el.classList.contains('active')) el.style.display = 'none'; }, 300);
        }
        
        function openLightbox(url) {
            const ext = url.split('.').pop().toLowerCase();
            let html = '';
            if(['mp4','webm','ogg'].includes(ext)) {
                html = `<video src="${url}" controls autoplay style="max-width:95vw; max-height:95vh; border-radius:12px;"></video>`;
            } else {
                html = `<img src="${url}" style="max-width:95vw; max-height:95vh; border-radius:12px; object-fit:contain;">`;
            }
            document.getElementById('lightboxContent').innerHTML = html;
            const lb = document.getElementById('lightbox');
            lb.style.display = 'flex';
            setTimeout(() => lb.style.opacity = '1', 10);
        }
        function closeLightbox() {
            const lb = document.getElementById('lightbox');
            lb.style.opacity = '0';
            document.getElementById('lightboxContent').innerHTML = ''; // 미디어 정지
            setTimeout(() => lb.style.display = 'none', 300);
        }

        function formatDate(date) {
            const d = new Date(date);
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
        }

        function getMediaHTML(url) {
            if(!url) return '';
            const ext = url.split('.').pop().toLowerCase();
            if(['mp4', 'webm', 'ogg'].includes(ext)) {
                return `<video controls src="${url}" class="detail-image"></video>`;
            } else if(['mp3', 'wav', 'm4a'].includes(ext)) {
                return `<audio controls src="${url}" style="width:100%; margin-bottom:20px;"></audio>`;
            } else {
                return `<img src="${url}" class="detail-image" style="cursor:zoom-in;" onclick="openLightbox('${url}')">`;
            }
        }

        /* =========================================================
           2. 인증 & 진입
           ========================================================= */
        document.addEventListener('DOMContentLoaded', () => {
            try { user = JSON.parse(localStorage.getItem('couple_user') || 'null'); } catch(e){}
            
            if(user) {
                document.getElementById('auth-wall').style.display = 'none';
                document.getElementById('app-container').style.display = 'flex';
                if(!authorName) showModal('authorSelectModal'); 
                else initApp();
            } else {
                document.getElementById('auth-wall').style.opacity = '1';
            }
            bindEvents();
        });

        // Mock Fetch for frontend testing (Replace with real logic if worker available)
        async function mockFetch(endpoint, options = {}) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    let res = { success: true };
                    if(endpoint === '/api/login') {
                        const b = JSON.parse(options.body);
                        if(b.username === 'ourlove' && b.password === '1004') res = { username: 'ourlove', isAdmin: true };
                        else return resolve({ ok: false, json: () => Promise.resolve({error: '암호가 틀렸습니다.'}) });
                    }
                    resolve({ ok: true, json: () => Promise.resolve(res) });
                }, 200);
            });
        }

        async function submitLogin() {
            const id = document.getElementById('l_id').value.trim(); const pw = document.getElementById('l_pw').value.trim();
            // In real env, use fetch('/api/login', ...)
            const res = await mockFetch('/api/login', { body: JSON.stringify({username:id, password:pw}) });
            if(res.ok) {
                user = await res.json(); localStorage.setItem('couple_user', JSON.stringify(user));
                document.getElementById('auth-wall').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('auth-wall').style.display = 'none';
                    document.getElementById('app-container').style.display = 'flex';
                    if(!authorName) showModal('authorSelectModal'); else initApp();
                }, 500);
            } else { const d = await res.json(); showToast(d.error); }
        }

        function setAuthorName() {
            const name = document.getElementById('authorNameInput').value.trim();
            if(!name) return showToast('이름을 입력해주세요!');
            authorName = name; localStorage.setItem('couple_author', name);
            hideModal('authorSelectModal'); initApp(); showToast(`${name}님 환영합니다! 💖`);
        }

        function handleLogout() { localStorage.removeItem('couple_user'); location.reload(); }

        function initApp() {
            startClock(); loadLocalData(); setupScrollAnimations(); startBannerSlider();
            document.querySelector('.nav-item').click(); // 홈 탭
            
            // 하이브리드 버튼 상태 렌더링
            document.getElementById('hybridToggleBtn').innerText = `현재: ${isHybridMode ? 'ON' : 'OFF'}`;
        }

        /* =========================================================
           3. 레이아웃 & 뷰 (SPA)
           ========================================================= */
        function switchView(viewId, btnElement) {
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            
            document.querySelectorAll('.view-section').forEach(sec => {
                sec.classList.remove('active'); sec.style.animation = 'none'; void sec.offsetWidth;
            });
            const target = document.getElementById(`view-${viewId}`);
            if(target) { target.classList.add('active'); target.style.animation = 'fadeIn 0.4s ease'; }
            
            if(viewId === 'calendar') { renderCalendar(); closeInlineView(); }
            if(viewId === 'board') processFilteredPosts();
            
            // 스크롤 상단 복구
            const container = document.body.classList.contains('mobile-frame-mode') ? document.getElementById('app-container') : window;
            container.scrollTo(0,0);
        }

        function startClock() {
            setInterval(() => {
                const now = new Date(); const days = ['일','월','화','수','목','금','토'];
                document.getElementById('top-clock').innerText = `${now.getFullYear()}. ${String(now.getMonth()+1).padStart(2,'0')}. ${String(now.getDate()).padStart(2,'0')} (${days[now.getDay()]}) ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
            }, 1000);
        }

        function toggleEditMode() {
            const body = document.body;
            body.classList.toggle('edit-mode');
            if(body.classList.contains('edit-mode')) showToast("편집 모드 ON ⚙️");
            else showToast("편집 모드 OFF");
        }

        function toggleHybridMode() {
            isHybridMode = !isHybridMode;
            localStorage.setItem('hybrid_mode', isHybridMode);
            if(isHybridMode) document.body.classList.add('mobile-frame-mode');
            else document.body.classList.remove('mobile-frame-mode');
            document.getElementById('hybridToggleBtn').innerText = `현재: ${isHybridMode ? 'ON' : 'OFF'}`;
            showToast("화면 모드가 변경되었습니다.");
        }

        let currentSlide = 0; const banners = document.querySelectorAll('.banner-img');
        function nextSlide() { currentSlide = (currentSlide + 1) % banners.length; updateSlide(); }
        function updateSlide() { banners.forEach(b => b.classList.remove('active')); if(banners[currentSlide]) banners[currentSlide].classList.add('active'); }
        function startBannerSlider() { setInterval(nextSlide, 6000); }

        function setupScrollAnimations() {
            const observer = new IntersectionObserver((entries) => { entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('visible'); }); }, { threshold: 0.1 });
            document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
            setTimeout(() => document.querySelectorAll('.fade-up').forEach(el => el.classList.add('visible')), 200);
        }

        /* =========================================================
           4. 데이터 로컬 시뮬레이션 (원래 백엔드 로직 대체)
           ========================================================= */
        function loadLocalData() {
            siteSettings = JSON.parse(localStorage.getItem('couple_settings') || '{}');
            timelineData = JSON.parse(localStorage.getItem('couple_timeline') || '[{"date":"2026-01-01", "desc":"우리의 첫 만남"}]');
            postsData = JSON.parse(localStorage.getItem('couple_posts') || '[]');
            commentsData = JSON.parse(localStorage.getItem('couple_comments') || '[]');
            
            applySettings(); renderTimeline();
            if(document.getElementById('view-calendar').classList.contains('active')) renderCalendar();
            if(document.getElementById('view-board').classList.contains('active')) processFilteredPosts();
        }

        function saveData() {
            localStorage.setItem('couple_settings', JSON.stringify(siteSettings));
            localStorage.setItem('couple_timeline', JSON.stringify(timelineData));
            localStorage.setItem('couple_posts', JSON.stringify(postsData));
            localStorage.setItem('couple_comments', JSON.stringify(commentsData));
        }

        /* =========================================================
           5. 설정 & 프로필
           ========================================================= */
        function applySettings() {
            const names = siteSettings.couple_names || "Boy & Girl";
            document.getElementById('coupleNamesText').innerText = names;
            document.getElementById('settingNames').value = names;

            if(siteSettings.dday_date) {
                document.getElementById('settingDday').value = siteSettings.dday_date;
                const start = new Date(siteSettings.dday_date); const now = new Date();
                const diffDays = Math.ceil(Math.abs(now - start) / (1000 * 60 * 60 * 24)); 
                document.getElementById('ddayText').innerText = `D+${diffDays}`;
            }

            if(siteSettings.custom_holidays) {
                document.getElementById('settingHolidays').value = siteSettings.custom_holidays;
                customHolidays = siteSettings.custom_holidays.split(',').map(s=>s.trim()).filter(s=>s);
            }
        }

        function saveSettings() {
            siteSettings.dday_date = document.getElementById('settingDday').value;
            siteSettings.couple_names = document.getElementById('settingNames').value;
            siteSettings.custom_holidays = document.getElementById('settingHolidays').value;
            saveData(); hideModal('settingsModal'); applySettings(); showToast("설정이 저장되었습니다.");
            if(document.getElementById('view-calendar').classList.contains('active')) renderCalendar();
        }

        function renderTimeline() {
            timelineData.sort((a,b) => new Date(b.date) - new Date(a.date));
            document.getElementById('timelineList').innerHTML = timelineData.map((t, idx) => `
                <div class="tl-item">
                    <div class="tl-line"></div><div class="tl-dot"></div>
                    <div class="tl-content">
                        <div class="tl-date">${t.date}</div>
                        <div class="tl-desc">${t.desc} <button class="edit-mode-only-inline btn-close" style="font-size:1rem; padding-left:5px; color:#FC8181;" onclick="customConfirm('기록을 삭제할까요?', () => deleteTimelineItem(${idx}))"><i class="fa-solid fa-xmark"></i></button></div>
                    </div>
                </div>
            `).join('');
        }

        function addTimelineItem() {
            const date = document.getElementById('tlDate').value; const desc = document.getElementById('tlDesc').value;
            if(!date || !desc) return showToast('모두 입력해주세요.');
            timelineData.push({date, desc}); saveData();
            hideModal('addTimelineModal'); document.getElementById('tlDate').value=''; document.getElementById('tlDesc').value=''; renderTimeline(); showToast("역사가 기록되었습니다.");
        }
        function deleteTimelineItem(idx) { timelineData.splice(idx, 1); saveData(); renderTimeline(); showToast("삭제되었습니다."); }

        function triggerSiteImgUpload(key) { showToast(`${key} 교체 (테스트 모드: 로컬 파일 사용 안함)`); }

        /* =========================================================
           6. 캘린더 & 이벤트 (스와이프/인라인)
           ========================================================= */
        let currentCalDate = new Date();
        
        function renderCalendar() {
            const year = currentCalDate.getFullYear(); const month = currentCalDate.getMonth();
            document.getElementById('cal-month-year').innerText = `${year}. ${String(month+1).padStart(2,'0')}`;
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const grid = document.getElementById('calendar-days');
            
            const daysArr = ['일','월','화','수','목','금','토'];
            let html = daysArr.map((d,i) => `<div class="cal-day-name" style="${i===0?'color:#E53E3E':(i===6?'color:#3182CE':'')}">${d}</div>`).join('');
            const todayStr = new Date().toISOString().split('T')[0];

            for(let i=0; i<firstDay; i++) html += `<div class="cal-cell empty"></div>`;
            
            for(let d=1; d<=daysInMonth; d++) {
                const mmdd = `${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const dateStr = `${year}-${mmdd}`;
                
                const hasDiary = postsData.some(p => p.category === '다이어리' && p.date === dateStr);
                const hasSchedule = postsData.some(p => p.category === '일정' && p.date === dateStr);
                
                let classes = ['cal-cell'];
                if(dateStr === todayStr) classes.push('today');
                
                // 일/토/커스텀 휴일 색상
                const dayOfWeek = new Date(year, month, d).getDay();
                if(dayOfWeek === 0 || customHolidays.includes(mmdd)) classes.push('holiday');
                else if(dayOfWeek === 6) classes.push('saturday');

                let indicators = '';
                if(hasDiary) indicators += `<div class="dot-diary"></div>`;
                if(hasSchedule) indicators += `<div class="dot-schedule"></div>`;
                
                html += `<div class="${classes.join(' ')}" data-date="${dateStr}" onclick="openInlineView(this, '${dateStr}')">${d}<div class="cal-indicators">${indicators}</div></div>`;
            }
            grid.innerHTML = html;
        }

        function changeMonth(offset) { 
            currentCalDate.setMonth(currentCalDate.getMonth() + offset); 
            renderCalendar(); closeInlineView(); 
        }

        // 인라인 확장 뷰
        function openInlineView(cellEl, dateStr) {
            document.querySelectorAll('.cal-cell').forEach(c => c.classList.remove('selected'));
            cellEl.classList.add('selected');

            const view = document.getElementById('calInlineView');
            document.getElementById('inlineViewDateHdn').value = dateStr;
            const parts = dateStr.split('-');
            document.getElementById('inlineViewTitle').innerText = `${parts[0]}년 ${parts[1]}월 ${parts[2]}일`;
            
            const dayPosts = postsData.filter(p => (p.category === '다이어리' || p.category === '일정') && p.date === dateStr);
            const listEl = document.getElementById('inlineEntryList');
            
            if(dayPosts.length === 0) {
                listEl.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:20px 0;">등록된 기록이 없습니다.</p>`;
            } else {
                listEl.innerHTML = dayPosts.map(p => `
                    <div class="day-entry-item ${p.category==='일정'?'schedule':''}" onclick="openDetailById(${p.id})">
                        <span class="entry-cat">${p.category}</span>
                        <div class="entry-title">${p.title}</div>
                    </div>
                `).join('');
            }
            view.classList.add('active');
        }

        function closeInlineView() {
            document.getElementById('calInlineView').classList.remove('active');
            document.querySelectorAll('.cal-cell').forEach(c => c.classList.remove('selected'));
        }

        // --- 이벤트 바인딩 (키보드, 스와이프, 외부 클릭) ---
        function bindEvents() {
            // 외부 클릭 시 인라인 뷰 닫기
            document.addEventListener('click', (e) => {
                const calView = document.getElementById('view-calendar');
                if(!calView.classList.contains('active')) return;
                const isClickInsideGrid = document.getElementById('calendar-days').contains(e.target);
                const isClickInsideInline = document.getElementById('calInlineView').contains(e.target);
                const isClickPrevNext = e.target.closest('.cal-nav-btn');
                
                if(!isClickInsideGrid && !isClickInsideInline && !isClickPrevNext) {
                    closeInlineView();
                }
            });

            // 키보드 방향키
            document.addEventListener('keydown', (e) => {
                if(document.getElementById('view-calendar').classList.contains('active')) {
                    if(e.key === 'ArrowLeft') changeMonth(-1);
                    if(e.key === 'ArrowRight') changeMonth(1);
                }
            });

            // 스와이프 (달력)
            let touchStartX = 0;
            const calView = document.getElementById('view-calendar');
            calView.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX, {passive: true});
            calView.addEventListener('touchend', e => {
                let touchEndX = e.changedTouches[0].screenX;
                if(touchEndX < touchStartX - 50) changeMonth(1); // 왼쪽으로 스와이프 -> 다음달
                if(touchEndX > touchStartX + 50) changeMonth(-1); // 오른쪽으로 스와이프 -> 이전달
            }, {passive: true});
        }

        /* =========================================================
           7. 글쓰기 폼 UI (다이어리/일정 날짜 분리)
           ========================================================= */
        function toggleDateInput() {
            const cat = document.getElementById('postCategory').value;
            const dateWrap = document.getElementById('dateInputWrap');
            if(cat === '다이어리' || cat === '일정') dateWrap.style.display = 'block';
            else dateWrap.style.display = 'none';
        }

        function openWriteModal(catDefault, dateDefault) { 
            closeInlineView();
            document.getElementById('postCategory').value = catDefault || '일상';
            document.getElementById('postDate').value = dateDefault || new Date().toISOString().split('T')[0];
            document.getElementById('postTitle').value = '';
            document.getElementById('postContent').value = '';
            toggleDateInput(); // 초기 상태 셋팅
            showModal('writeModal'); 
        }

        /* =========================================================
           8. 통합 게시판 (스토리 & 갤러리)
           ========================================================= */
        function setBoardCategory(cat, btnEl) { 
            currentBoardTab = cat; currentPage = 1;
            document.querySelectorAll('.board-tab').forEach(b => b.classList.remove('active')); btnEl.classList.add('active'); 
            processFilteredPosts(); 
        }

        function submitPost() {
            const cat = document.getElementById('postCategory').value; 
            const title = document.getElementById('postTitle').value.trim(); 
            const content = document.getElementById('postContent').value.trim(); 
            const dateStr = document.getElementById('postDate').value || new Date().toISOString().split('T')[0];
            // 테스트 모드 파일명(url) 임의 지정
            const fakeUrl = document.getElementById('postImage').files.length > 0 ? 'https://via.placeholder.com/600x400?text=Uploaded+Media' : '';

            if(!title) return showToast('제목을 입력하세요.');
            
            const newPost = {
                id: Date.now(),
                author: authorName || '우리',
                title: title,
                category: cat,
                date: (cat==='다이어리'||cat==='일정') ? dateStr : '',
                content: content,
                image_url: fakeUrl,
                created_at: formatDate(new Date())
            };
            
            postsData.unshift(newPost); saveData();
            hideModal('writeModal'); loadLocalData(); showToast("저장되었습니다! 💖");
        }

        function processFilteredPosts() {
            const list = document.getElementById('boardList'); const pageArea = document.getElementById('paginationArea');
            list.innerHTML = ''; pageArea.innerHTML = '';
            
            currentFilteredPosts = postsData.filter(p => {
                if(currentBoardTab === '전체') return p.category !== '다이어리' && p.category !== '일정';
                return p.category === currentBoardTab;
            });
            
            if(currentFilteredPosts.length === 0) { list.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:50px 0;">등록된 기록이 없습니다.</p>`; list.className=''; return; }

            const totalPages = Math.ceil(currentFilteredPosts.length / postsPerPage);
            const startIndex = (currentPage - 1) * postsPerPage;
            const paginatedPosts = currentFilteredPosts.slice(startIndex, startIndex + postsPerPage);

            if(currentBoardTab === '갤러리') {
                list.className = 'gallery-grid';
                paginatedPosts.forEach((p, index) => {
                    const actualIndex = startIndex + index;
                    list.innerHTML += `
                        <div class="gallery-item glass" onclick="openDetailByIndex(${actualIndex})">
                            ${getMediaHTML(p.image_url)}
                            <div class="gallery-overlay"><span>${p.title}</span></div>
                        </div>`;
                });
            } else {
                list.className = 'post-list';
                paginatedPosts.forEach((p, index) => {
                    const actualIndex = startIndex + index;
                    const postComments = commentsData.filter(c => c.post_id === p.id);
                    const previewComments = postComments.slice(-3);
                    let inlineHtml = previewComments.map(c => `
                        <div class="inline-comment-item">
                            <div><span class="inline-comment-author">${c.author}</span><span style="color:var(--text-main);">${c.content}</span></div>
                            <span class="inline-comment-time">${(c.created_at||'').slice(5,16)}</span>
                        </div>
                    `).join('');
                    if(!inlineHtml) inlineHtml = `<div style="font-size:0.85rem; color:var(--text-muted);">첫 댓글을 남겨보세요.</div>`;

                    list.innerHTML += `
                        <div class="post-card glass">
                            <div class="post-content-flex">
                                <div onclick="openDetailByIndex(${actualIndex})">
                                    <div class="post-top-meta"><span class="post-cat-badge">${p.category}</span></div>
                                    <div class="post-title">${p.title}</div>
                                    <div class="post-preview">${p.content}</div>
                                    <div class="post-timestamp">${p.created_at || ''} · ${p.author}</div>
                                </div>
                                <div class="inline-comments">
                                    <div style="font-size:0.85rem; font-weight:700; color:var(--primary); margin-bottom:8px;"><i class="fa-regular fa-comment-dots"></i> 댓글 (${postComments.length})</div>
                                    ${inlineHtml}
                                    <div class="inline-comment-input-wrap">
                                        <input type="text" id="inline-comment-${p.id}" placeholder="따뜻한 한마디..." onkeydown="if(event.key==='Enter') submitInlineComment(${p.id})">
                                        <button onclick="submitInlineComment(${p.id})">등록</button>
                                    </div>
                                </div>
                            </div>
                            ${p.image_url ? `<div style="width:120px; height:120px; flex-shrink:0;">${getMediaHTML(p.image_url)}</div>` : ''}
                        </div>`;
                });
            }

            if (totalPages > 1) {
                let pageHtml = '';
                for(let i=1; i<=totalPages; i++) {
                    pageHtml += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
                }
                pageArea.innerHTML = pageHtml;
            }
        }

        function goToPage(num) {
            currentPage = num; processFilteredPosts();
            const container = document.body.classList.contains('mobile-frame-mode') ? document.getElementById('app-container') : window;
            container.scrollTo({top:0, behavior:'smooth'});
        }

        function submitInlineComment(postId) {
            const input = document.getElementById(`inline-comment-${postId}`); const content = input.value.trim();
            if (!content) return;
            commentsData.push({ id: Date.now(), post_id: postId, author: authorName || '우리', content: content, created_at: formatDate(new Date()) });
            saveData(); processFilteredPosts(); showToast('댓글이 등록되었습니다.');
        }

        /* =========================================================
           9. 상세 모달 & 이전/다음 네비게이션
           ========================================================= */
        function openDetailByIndex(index) {
            if(index < 0 || index >= currentFilteredPosts.length) return;
            activePostIndex = index; const p = currentFilteredPosts[index];
            renderDetailModal(p);
            
            const navArea = document.getElementById('modalNavArea'); navArea.style.display = 'flex';
            document.getElementById('btnPrevPost').disabled = (index === 0); document.getElementById('btnNextPost').disabled = (index === currentFilteredPosts.length - 1);
        }

        function openDetailById(id) {
            const p = postsData.find(item => item.id === id); if(!p) return;
            activePostIndex = -1; renderDetailModal(p);
            document.getElementById('modalNavArea').style.display = 'none';
        }

        function goPrevPost() { if (activePostIndex > 0) openDetailByIndex(activePostIndex - 1); }
        function goNextPost() { if (activePostIndex < currentFilteredPosts.length - 1) openDetailByIndex(activePostIndex + 1); }

        function renderDetailModal(p) {
            activePost = p;
            document.getElementById('modalCategory').innerText = p.category;
            document.getElementById('modalDateMeta').innerText = p.date ? `${p.date} / ${p.created_at||''}` : p.created_at||'';
            document.getElementById('modalAuthor').innerText = p.author;
            document.getElementById('modalTitle').innerText = p.title;
            document.getElementById('modalContent').innerText = p.content;
            document.getElementById('modalImageWrap').innerHTML = getMediaHTML(p.image_url);
            
            // 본인 또는 편집모드면 버튼 노출
            if(isEditMode || p.author === authorName) {
                document.getElementById('btnEditPost').style.display = 'inline-block';
                document.getElementById('btnDelPost').style.display = 'inline-block';
            } else {
                document.getElementById('btnEditPost').style.display = 'none';
                document.getElementById('btnDelPost').style.display = 'none';
            }

            renderComments(); showModal('detailModal');
        }

        function renderComments() {
            if(!activePost) return;
            const postComments = commentsData.filter(c => c.post_id === activePost.id);
            document.getElementById('modalCommentsHeader').innerHTML = `댓글 <span style="color:var(--primary);">${postComments.length}</span>`;
            document.getElementById('modalCommentsList').innerHTML = postComments.map(c => `
                <div style="display:flex; justify-content:space-between; font-size:0.95rem; border-bottom:1px solid #eee; padding-bottom:10px;">
                    <div><b style="color:var(--text-main); margin-right:8px;">${c.author}</b> <span style="color:#4A5568;">${c.content}</span><br><span style="font-size:0.75rem; color:#A0AEC0;">${c.created_at||''}</span></div>
                    ${(isEditMode || c.author === authorName) ? `<button style="background:none; border:none; color:#FC8181; cursor:pointer; padding:5px;" onclick="customConfirm('댓글을 삭제할까요?', () => deleteComment(${c.id}))"><i class="fa-solid fa-xmark"></i></button>` : ''}
                </div>
            `).join('');
            document.getElementById('modal-comment-input').value = '';
        }

        function submitComment() {
            if(!activePost) return;
            const content = document.getElementById('modal-comment-input').value.trim(); if (!content) return;
            commentsData.push({ id: Date.now(), post_id: activePost.id, author: authorName || '우리', content: content, created_at: formatDate(new Date()) });
            saveData(); renderComments();
            if(document.getElementById('view-board').classList.contains('active')) processFilteredPosts();
        }
        
        function deleteComment(id) {
            commentsData = commentsData.filter(c => c.id !== id); saveData(); renderComments();
            if(document.getElementById('view-board').classList.contains('active')) processFilteredPosts(); showToast('삭제되었습니다.');
        }

        function openEditFromDetail() {
            hideModal('detailModal'); if(!activePost) return;
            document.getElementById('editPostId').value = activePost.id; 
            document.getElementById('editTitle').value = activePost.title; 
            document.getElementById('editContent').value = activePost.content; 
            document.getElementById('editCategory').value = activePost.category; 
            document.getElementById('editDateStr').value = activePost.date || ''; 
            showModal('editModal');
        }

        function submitEdit() {
            const id = parseInt(document.getElementById('editPostId').value); const p = postsData.find(x => x.id === id);
            if(p) {
                p.title = document.getElementById('editTitle').value.trim();
                p.content = document.getElementById('editContent').value.trim();
                saveData(); hideModal('editModal'); loadLocalData(); showToast("수정 완료!");
            }
        }

        function deleteFromDetail() {
            customConfirm("기록을 완전히 삭제하시겠습니까?", () => {
                postsData = postsData.filter(p => p.id !== activePost.id);
                commentsData = commentsData.filter(c => c.post_id !== activePost.id);
                saveData(); hideModal('detailModal'); loadLocalData(); showToast("삭제되었습니다.");
            });
        }

    </script>
</body>
</html>
