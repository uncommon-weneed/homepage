<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Our Secret Space 💖</title>
    <!-- 브라우저 탭 아이콘 (파비콘) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FF6B6B'%3E%3Cpath d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/%3E%3C/svg%3E">
    <!-- Web Fonts & Icons -->
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* 2026 Trendy Soft App Palette */
            --primary: #FF6B6B;       
            --primary-light: #FFF0F0; 
            --primary-dark: #E05252;
            --secondary: #4DABF7;     
            --secondary-light: #E7F5FF;
            --bg-base: #F8F9FA;       
            --surface: #FFFFFF; 
            --text-main: #212529;
            --text-muted: #868E96;
            --border-light: #F1F3F5;
            --shadow-app: 0 20px 60px rgba(0, 0, 0, 0.08);
            --shadow-card: 0 8px 24px rgba(255, 107, 107, 0.06);
            --shadow-float: 0 10px 25px rgba(255, 107, 107, 0.3);
            --radius-sm: 14px;
            --radius-md: 24px;
            --radius-lg: 36px;
            --nav-height: 80px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* 모바일 앱 완벽 고정 프레임 (100dvh 사용) */
        body { background: #E9ECEF; color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100dvh; overflow: hidden; }
        
        #app-wrapper { width: 100%; height: 100dvh; max-width: 480px; background: var(--bg-base); position: relative; display: flex; flex-direction: column; box-shadow: var(--shadow-app); overflow: hidden; }
        
        /* 애니메이션 */
        @keyframes fadeScale { 0% { opacity: 0; transform: scale(0.97); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes pulseHeart { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
        
        .fade-up { animation: slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
        
        /* 스크롤바 숨기기 (네이티브 앱 느낌) */
        ::-webkit-scrollbar { display: none; }
        .view-section { display: none; flex-grow: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: calc(var(--nav-height) + 20px); scroll-behavior: smooth; }
        .view-section.active { display: block; animation: fadeScale 0.4s ease-out; }

        /* 편집 모드 전용 */
        .edit-mode-only { display: none !important; }
        body.edit-mode .edit-mode-only { display: flex !important; }

        /* 1. 로그인 화면 */
        #auth-wall { position: absolute; inset: 0; background: url('https://images.unsplash.com/photo-1518621736915-f3b1c41bfd00?q=80&w=800&auto=format&fit=crop') center/cover; z-index: 9999; display: flex; align-items: center; justify-content: center; transition: opacity 0.5s ease; }
        #auth-wall::before { content: ''; position: absolute; inset: 0; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); }
        .auth-box { position: relative; z-index: 1; width: 85%; background: rgba(255,255,255,0.85); padding: 40px 30px; border-radius: var(--radius-lg); box-shadow: var(--shadow-card); text-align: center; border: 1px solid rgba(255,255,255,0.5); }
        .auth-box i.fa-heart { font-size: 3.5rem; color: var(--primary); margin-bottom: 20px; animation: pulseHeart 2s infinite; drop-shadow: 0 4px 10px rgba(255,107,107,0.3); }
        .auth-box h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 25px; color: var(--text-main); }
        
        .form-input { width: 100%; padding: 18px; background: #F8F9FA; border: 1px solid var(--border-light); border-radius: 16px; margin-bottom: 15px; font-size: 1.05rem; transition: 0.3s; outline: none; }
        .form-input:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 4px var(--primary-light); }
        .btn-primary { width: 100%; background: var(--primary); color: white; border: none; padding: 18px; border-radius: 16px; font-size: 1.1rem; font-weight: 800; cursor: pointer; transition: 0.2s; box-shadow: var(--shadow-float); }
        .btn-primary:active { transform: scale(0.96); }

        /* 2. 역할(남/녀) 선택 팝업 */
        .role-btn-wrap { display: flex; gap: 15px; margin-top: 20px; }
        .role-btn { flex: 1; background: #F8F9FA; border: 2px solid var(--border-light); padding: 25px 10px; border-radius: 20px; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .role-btn i { font-size: 2.5rem; color: var(--text-muted); }
        .role-btn span { font-weight: 800; font-size: 1.1rem; color: var(--text-main); }
        .role-btn:hover, .role-btn:active { border-color: var(--primary); background: var(--primary-light); }
        .role-btn:hover i { color: var(--primary); }

        /* 3. 헤더 & 하단 탭 */
        .app-header { position: sticky; top: 0; width: 100%; height: 65px; background: rgba(248, 249, 250, 0.9); backdrop-filter: blur(10px); z-index: 50; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        .header-title { font-size: 1.1rem; font-weight: 800; color: var(--primary); letter-spacing: 0.5px; }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .icon-btn { background: white; border: none; font-size: 1.2rem; color: var(--text-muted); cursor: pointer; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.03); transition: 0.2s; }
        .icon-btn:active { transform: scale(0.9); }
        .icon-btn.active { color: white; background: var(--primary); }

        .bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; height: var(--nav-height); background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); z-index: 100; display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); border-top: 1px solid var(--border-light); box-shadow: 0 -10px 30px rgba(0,0,0,0.02); }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 33%; height: 100%; color: var(--text-muted); transition: 0.3s; cursor: pointer; gap: 4px; }
        .nav-item i { font-size: 1.4rem; transition: 0.3s; }
        .nav-item span { font-size: 0.75rem; font-weight: 700; }
        .nav-item.active { color: var(--primary); }
        .nav-item.active i { transform: translateY(-3px); }

        /* 4. 홈 화면 */
        .container { padding: 20px; }
        .banner-wrap { position: relative; width: 100%; height: 380px; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-card); margin-bottom: 25px; }
        .banner-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.5s ease; z-index: 1; }
        .banner-img.active { opacity: 1; z-index: 2; }
        .banner-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.6), transparent); z-index: 3; }
        .banner-content { position: absolute; bottom: 30px; left: 0; width: 100%; text-align: center; z-index: 4; color: white; }
        .dday-badge { display: inline-block; background: rgba(255,255,255,0.25); backdrop-filter: blur(5px); padding: 5px 15px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.4); }
        .dday-num { font-size: 4.5rem; font-weight: 800; line-height: 1; margin-bottom: 5px; }
        .couple-name { font-size: 1.1rem; font-weight: 600; letter-spacing: 2px; }

        .widget-card { background: var(--surface); border-radius: var(--radius-md); padding: 25px; margin-bottom: 20px; box-shadow: var(--shadow-card); }
        .widget-title { font-size: 1.25rem; font-weight: 800; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        
        .profile-flex { display: flex; justify-content: space-evenly; align-items: center; }
        .profile-item { text-align: center; position: relative; }
        .profile-pic { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 4px solid var(--primary-light); margin-bottom: 10px; }
        .profile-item span { font-weight: 800; font-size: 1.1rem; }

        .timeline-box { max-height: 280px; overflow-y: auto; padding-right: 5px; }
        .tl-item { display: flex; gap: 15px; margin-bottom: 20px; position: relative; }
        .tl-line { position: absolute; left: 6px; top: 25px; bottom: -20px; width: 2px; background: var(--border-light); }
        .tl-item:last-child .tl-line { display: none; }
        .tl-dot { width: 14px; height: 14px; background: var(--primary); border-radius: 50%; z-index: 2; margin-top: 5px; box-shadow: 0 0 0 4px var(--primary-light); }
        .tl-content { flex-grow: 1; background: #FFF; padding: 15px 20px; border-radius: 16px; border: 1px solid var(--border-light); }
        .tl-date { font-size: 0.85rem; font-weight: 800; color: var(--primary); margin-bottom: 5px; }

        /* 5. 캘린더 (실물 달력형) */
        .cal-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 0 10px; }
        .cal-month-title { font-size: 1.8rem; font-weight: 800; }
        
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; background: white; padding: 20px; border-radius: var(--radius-md); box-shadow: var(--shadow-card); }
        .cal-day-name { text-align: center; font-weight: 800; font-size: 0.85rem; padding-bottom: 10px; color: var(--text-muted); }
        .cal-day-name.sun { color: #FF6B6B; } .cal-day-name.sat { color: #4DABF7; }
        
        .cal-cell { aspect-ratio: 1/0.9; display: flex; flex-direction: column; align-items: center; padding-top: 8px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 1.05rem; transition: 0.2s; position: relative; }
        .cal-cell:active { background: #F1F3F5; transform: scale(0.95); }
        .cal-cell.today { background: var(--primary-light); color: var(--primary); }
        .cal-cell.selected { border: 2px solid var(--primary); background: #FFF; }
        .cal-cell.sun, .cal-cell.holiday { color: #FF6B6B; }
        .cal-cell.sat { color: #4DABF7; }
        
        .cal-holiday-name { font-size: 0.6rem; color: #FF6B6B; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; padding: 0 2px; }
        .cal-indicators { display: flex; gap: 4px; margin-top: auto; padding-bottom: 6px; }
        .dot-diary { width: 6px; height: 6px; background: var(--primary); border-radius: 50%; }
        .dot-schedule { width: 6px; height: 6px; background: var(--secondary); border-radius: 50%; }

        /* 다이렉트 데이 뷰 (달력 하단) */
        .cal-day-view { max-height: 0; overflow: hidden; opacity: 0; transition: 0.4s ease; margin-top: 15px; }
        .cal-day-view.active { max-height: 600px; opacity: 1; }
        .day-view-card { background: white; border-radius: var(--radius-md); padding: 25px; box-shadow: var(--shadow-card); }
        .day-entry { background: #F8F9FA; padding: 16px; border-radius: 14px; margin-bottom: 12px; border-left: 4px solid var(--primary); cursor: pointer; }
        .day-entry.schedule { border-left-color: var(--secondary); }
        .day-entry-title { font-weight: 800; font-size: 1.1rem; color: var(--text-main); }
        .day-entry-cat { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; }

        /* 6. 스토리 게시판 */
        .board-tabs { display: flex; gap: 15px; margin-bottom: 25px; overflow-x: auto; padding-bottom: 5px; }
        .board-tab { background: none; border: none; font-size: 1.15rem; font-weight: 800; color: var(--text-muted); cursor: pointer; position: relative; white-space: nowrap; transition: 0.2s; }
        .board-tab.active { color: var(--text-main); }
        .board-tab.active::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 100%; height: 4px; background: var(--primary); border-radius: 4px; }

        .post-card { background: white; border-radius: var(--radius-md); padding: 20px; cursor: pointer; box-shadow: var(--shadow-card); display: flex; gap: 15px; margin-bottom: 15px; }
        .post-card:active { transform: scale(0.98); }
        .post-info { flex-grow: 1; overflow: hidden; }
        .post-title { font-size: 1.25rem; font-weight: 800; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .post-desc { font-size: 0.95rem; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .gallery-item { border-radius: var(--radius-sm); overflow: hidden; aspect-ratio: 1/1; position: relative; box-shadow: var(--shadow-card); }
        .gallery-item img, .gallery-item video { width: 100%; height: 100%; object-fit: cover; }

        .fab { position: absolute; bottom: calc(var(--nav-height) + 20px); right: 20px; width: 60px; height: 60px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; box-shadow: var(--shadow-float); border: none; z-index: 90; cursor: pointer; transition: 0.2s; }
        .fab:active { transform: scale(0.9) rotate(45deg); }

        /* 모달 팝업 */
        .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); z-index: 3000; display: none; align-items: flex-end; justify-content: center; opacity: 0; transition: opacity 0.3s ease; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content { width: 100%; background: white; border-radius: 30px 30px 0 0; max-height: 90%; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        
        /* 중앙 팝업형 모달 (알림/Confirm용) */
        .modal-content.center-popup { border-radius: var(--radius-lg); max-height: 80%; transform: scale(0.9) translateY(20px); width: 85%; margin-bottom: auto; margin-top: auto; }
        .modal-overlay.active .modal-content.center-popup { transform: scale(1) translateY(0); }

        .modal-header { padding: 25px 25px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-light); }
        .modal-body { padding: 25px; overflow-y: auto; flex-grow: 1; }
        .btn-close { background: #F1F3F5; border: none; font-size: 1.2rem; color: var(--text-main); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* 토스트 */
        .toast { position: absolute; bottom: calc(var(--nav-height) + 20px); left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(33, 37, 41, 0.95); color: white; padding: 14px 24px; border-radius: 30px; font-size: 0.95rem; font-weight: 700; opacity: 0; transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 5000; box-shadow: 0 10px 30px rgba(0,0,0,0.2); pointer-events: none; white-space: nowrap; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        #lightbox { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 6000; align-items: center; justify-content: center; opacity: 0; transition: 0.3s ease; }
        #lightbox img, #lightbox video { max-width: 100%; max-height: 100%; object-fit: contain; }
    </style>
</head>
<body>
    
    <div id="app-wrapper">
        
        <!-- 커스텀 토스트 알림 -->
        <div id="toast"><span id="toastMsg">메시지</span></div>

        <!-- 커스텀 Confirm 모달 -->
        <div class="modal-overlay" id="confirmModal" style="z-index: 5000;">
            <div class="modal-content center-popup" style="padding: 30px; text-align: center;">
                <div style="font-size: 3rem; color: var(--primary); margin-bottom: 15px;"><i class="fa-solid fa-circle-exclamation"></i></div>
                <h3 style="font-size: 1.2rem; font-weight: 800; margin-bottom: 25px;" id="confirmMsg">정말 삭제할까요?</h3>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-primary" style="background: #F1F3F5; color: var(--text-main); flex: 1;" id="confirmBtnNo">취소</button>
                    <button class="btn-primary" style="flex: 1;" id="confirmBtnYes">확인</button>
                </div>
            </div>
        </div>

        <!-- 1. 시크릿 로그인 화면 -->
        <div id="auth-wall">
            <div class="auth-box fade-up">
                <i class="fa-solid fa-heart"></i>
                <h1>Secret Place</h1>
                <input type="text" class="form-input" id="l_id" placeholder="아이디" style="text-align:center;">
                <input type="password" class="form-input" id="l_pw" placeholder="비밀번호" style="text-align:center;" onkeydown="if(event.key==='Enter') submitLogin()">
                <button class="btn-primary" onclick="submitLogin()">입장하기</button>
            </div>
        </div>

        <!-- 2. 역할(작성자 이름) 선택 모달 -->
        <div class="modal-overlay" id="roleSelectModal" style="z-index:4000;">
            <div class="modal-content center-popup" style="padding: 40px 25px; text-align: center;">
                <h3 style="font-size:1.5rem; font-weight:800; margin-bottom:10px;">누가 접속했나요?</h3>
                <p style="color:var(--text-muted); font-size:0.95rem;">작성자를 선택해주세요.</p>
                <div class="role-btn-wrap">
                    <div class="role-btn" onclick="setAuthorName('남자친구')">
                        <i class="fa-solid fa-mars" style="color:var(--secondary);"></i><span>남자친구</span>
                    </div>
                    <div class="role-btn" onclick="setAuthorName('여자친구')">
                        <i class="fa-solid fa-venus" style="color:var(--primary);"></i><span>여자친구</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 메인 헤더 -->
        <header class="app-header">
            <div class="header-title"><i class="fa-solid fa-heart"></i> Our Story</div>
            <div class="header-actions">
                <span id="top-clock" style="font-size:0.85rem; font-weight:700; color:var(--text-muted); font-family:monospace;">00:00:00</span>
                <button class="icon-btn" onclick="showModal('settingsModal')"><i class="fa-solid fa-gear"></i></button>
            </div>
        </header>

        <!-- 하단 네비게이션 -->
        <nav class="bottom-nav">
            <a class="nav-item active" onclick="switchView('home', this)"><i class="fa-solid fa-house"></i><span>홈</span></a>
            <a class="nav-item" onclick="switchView('calendar', this)"><i class="fa-regular fa-calendar-check"></i><span>캘린더</span></a>
            <a class="nav-item" onclick="switchView('board', this)"><i class="fa-regular fa-images"></i><span>스토리</span></a>
        </nav>

        <!-- View 1: 홈 (Home) -->
        <main class="view-section active" id="view-home">
            <div class="container">
                <div class="banner-wrap fade-up" onclick="openLightbox(document.querySelector('.banner-img.active').src)">
                    <div id="slideTrack">
                        <img src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?q=80&w=1000&auto=format&fit=crop" class="banner-img active" id="bgImg1">
                        <img src="https://images.unsplash.com/photo-1522673607200-164d1b6ce486?q=80&w=1000&auto=format&fit=crop" class="banner-img" id="bgImg2">
                    </div>
                    <div class="banner-overlay"></div>
                    <button class="edit-mode-only icon-btn" style="position:absolute; top:15px; right:15px; z-index:10;" onclick="event.stopPropagation(); triggerSiteImgUpload('banner_1')"><i class="fa-solid fa-camera"></i></button>
                    
                    <div class="banner-content">
                        <div class="dday-badge">우리 만난 지</div>
                        <div class="dday-num" id="ddayText">D+♥</div>
                        <div class="couple-name" id="coupleNamesText">Boy & Girl</div>
                    </div>
                </div>

                <div class="widget-card fade-up">
                    <div class="widget-title">Our Profile</div>
                    <div class="profile-flex">
                        <div class="profile-item">
                            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=400&auto=format&fit=crop" class="profile-pic" id="profile1">
                            <button class="edit-mode-only icon-btn" style="position:absolute; bottom:20px; right:-10px; width:30px; height:30px; box-shadow:0 2px 5px rgba(0,0,0,0.2);" onclick="triggerSiteImgUpload('profile_1')"><i class="fa-solid fa-camera" style="font-size:0.9rem;"></i></button>
                            <br><span>여자친구</span>
                        </div>
                        <i class="fa-solid fa-heart" style="color:var(--primary); font-size:2rem; animation: pulseHeart 2s infinite;"></i>
                        <div class="profile-item">
                            <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?q=80&w=400&auto=format&fit=crop" class="profile-pic" id="profile2">
                            <button class="edit-mode-only icon-btn" style="position:absolute; bottom:20px; right:-10px; width:30px; height:30px; box-shadow:0 2px 5px rgba(0,0,0,0.2);" onclick="triggerSiteImgUpload('profile_2')"><i class="fa-solid fa-camera" style="font-size:0.9rem;"></i></button>
                            <br><span>남자친구</span>
                        </div>
                    </div>
                </div>

                    <div class="form-group"><label class="form-label">내용</label><input type="text" id="tlDesc" class="form-input" placeholder="어떤 일이 있었나요?"></div>

        <!-- 글 수정 모달 -->
        <div class="modal-overlay" id="editModal">
            <div class="modal-content">

                    <input type="hidden" id="editPostId"><input type="hidden" id="editAuthorMeta"><input type="hidden" id="editCategory"><input type="hidden" id="editKeepImage"><input type="hidden" id="editDateStr">

    <script>
        /* =========================================================
           1. 상태 관리 & 유틸리티
           ========================================================= */
        let user = null;
        let authorName = localStorage.getItem('couple_author') || '';
        let postsData = []; let commentsData = []; let timelineData = []; 
        let siteSettings = {}; let customHolidays = {};
        const defaultHolidays = {"01-01":"신정","03-01":"삼일절","05-05":"어린이날","06-06":"현충일","08-15":"광복절","10-03":"개천절","10-09":"한글날","12-25":"크리스마스"};
        
        let currentBoardTab = '전체'; 
        let pendingConfirmAction = null;
        let isHybridMode = localStorage.getItem('hybrid_mode') === 'true';

        if(isHybridMode) document.body.classList.add('mobile-frame-mode');

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function customConfirm(msg, action) {
            document.getElementById('confirmMsg').innerText = msg;
            pendingConfirmAction = action;
            showModal('confirmModal');
        }
        document.getElementById('confirmBtnYes').addEventListener('click', () => {
            if(pendingConfirmAction) pendingConfirmAction();
            hideModal('confirmModal');
        });
        document.getElementById('confirmBtnNo').addEventListener('click', () => hideModal('confirmModal'));

        function showModal(id) { 
            const el = document.getElementById(id);
            el.style.display = 'flex'; void el.offsetWidth; el.classList.add('active');
        }
        function hideModal(id) { 
            const el = document.getElementById(id);
            el.classList.remove('active');
            setTimeout(() => { if(!el.classList.contains('active')) el.style.display = 'none'; }, 300);
        }
        
        function openLightbox(url) {
            document.getElementById('lightboxImg').src = url;
            const lb = document.getElementById('lightbox');
            lb.style.display = 'flex'; void lb.offsetWidth; lb.style.opacity = '1';
        }
        function closeLightbox() {
            const lb = document.getElementById('lightbox');
            lb.style.opacity = '0';
            setTimeout(() => { lb.style.display = 'none'; document.getElementById('lightboxImg').src=''; }, 300);
        }

        function formatDate(date) {
            const d = new Date(date);
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
        }

        function getMediaHTML(url) {
            if(!url) return '';
            const ext = url.split('.').pop().toLowerCase();
            if(['mp4', 'webm', 'ogg'].includes(ext)) {
                return `<video controls src="${url}" style="width:100%; border-radius:16px; margin-bottom:20px;"></video>`;
            } else if(['mp3', 'wav', 'm4a'].includes(ext)) {
                return `<audio controls src="${url}" style="width:100%; margin-bottom:20px; outline:none;"></audio>`;
            } else {
                return `<img src="${url}" style="width:100%; border-radius:16px; margin-bottom:20px; cursor:zoom-in;" onclick="openLightbox('${url}')">`;
            }
        }

        /* =========================================================
           2. 인증 및 진입 제어
           ========================================================= */
        document.addEventListener('DOMContentLoaded', () => {
            try { user = JSON.parse(localStorage.getItem('couple_user') || 'null'); } catch(e){}
            
            if(user) {
                document.getElementById('auth-wall').style.display = 'none';
                if(!authorName) showModal('roleSelectModal'); else initApp();
            } else {
                document.getElementById('auth-wall').style.opacity = '1';
            }
        });

        // Backend Mock (If _worker.js is not running, this simulates the logic)
        async function mockFetch(endpoint, options = {}) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    let res = { success: true };
                    if(endpoint === '/api/login') {
                        const b = JSON.parse(options.body);
                        if(b.username === 'ourlove' && b.password === '1004') res = { username: 'ourlove', isAdmin: true };
                        else return resolve({ ok: false, json: () => Promise.resolve({error: '암호가 틀렸습니다.'}) });
                    }
                    resolve({ ok: true, json: () => Promise.resolve(res) });
                }, 300);
            });
        }

        async function submitLogin() {
            const id = document.getElementById('l_id').value.trim(); const pw = document.getElementById('l_pw').value.trim();
            const res = await mockFetch('/api/login', { body: JSON.stringify({username:id, password:pw}) });
            if(res.ok) {
                user = await res.json(); localStorage.setItem('couple_user', JSON.stringify(user));
                document.getElementById('auth-wall').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('auth-wall').style.display = 'none';
                    if(!authorName) showModal('roleSelectModal'); else initApp();
                }, 500);
            } else { const d = await res.json(); showToast(d.error); }
        }

        function setAuthorName(name) {
            authorName = name; localStorage.setItem('couple_author', name);
            hideModal('roleSelectModal'); initApp(); showToast(`${name} 환영해! 💖`);
        }
        function handleLogout() { localStorage.removeItem('couple_user'); location.reload(); }

        function initApp() {
            startClock(); loadLocalData(); startBannerSlider(); bindEvents();
            document.querySelector('.nav-item').click();
            document.getElementById('hybridToggleBtn').innerText = `현재: ${isHybridMode ? 'ON' : 'OFF'}`;
        }

        /* =========================================================
           3. 레이아웃 & 뷰 (SPA)
           ========================================================= */
        function switchView(viewId, btnElement) {
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            
            document.querySelectorAll('.view-section').forEach(sec => {
                sec.classList.remove('active'); sec.style.animation = 'none'; void sec.offsetWidth;
            });
            const target = document.getElementById(`view-${viewId}`);
            if(target) { target.classList.add('active'); target.style.animation = 'fadeScale 0.4s ease-out'; }
            
            if(viewId === 'calendar') { renderCalendar(); document.getElementById('calDayView').classList.remove('active'); }
            if(viewId === 'board') processFilteredPosts();
            
            const container = document.getElementById('app-wrapper');
            const view = document.getElementById(`view-${viewId}`);
            if(view) view.scrollTo(0,0);
        }

        function startClock() {
            setInterval(() => {
                const now = new Date(); const days = ['일','월','화','수','목','금','토'];
                document.getElementById('top-clock').innerText = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
            }, 1000);
        }

        function toggleEditMode() {
            const body = document.body;
            body.classList.toggle('edit-mode');
            if(body.classList.contains('edit-mode')) showToast("편집 모드 ON ⚙️");
            else showToast("편집 모드 OFF");
        }

        function toggleHybridMode() {
            isHybridMode = !isHybridMode; localStorage.setItem('hybrid_mode', isHybridMode);
            if(isHybridMode) document.body.classList.add('mobile-frame-mode');
            else document.body.classList.remove('mobile-frame-mode');
            document.getElementById('hybridToggleBtn').innerText = `현재: ${isHybridMode ? 'ON' : 'OFF'}`;
            showToast("화면 모드가 변경되었습니다.");
        }

        let currentSlide = 0; const banners = document.querySelectorAll('.banner-img');
        function nextSlide() { currentSlide = (currentSlide + 1) % banners.length; updateSlide(); }
        function updateSlide() { banners.forEach(b => b.classList.remove('active')); if(banners[currentSlide]) banners[currentSlide].classList.add('active'); }
        function startBannerSlider() { setInterval(nextSlide, 6000); }

        /* =========================================================
           4. 데이터 로컬 시뮬레이션
           ========================================================= */
        function loadLocalData() {
            siteSettings = JSON.parse(localStorage.getItem('couple_settings') || '{}');
            timelineData = JSON.parse(localStorage.getItem('couple_timeline') || '[{"date":"2026-01-01", "desc":"우리의 첫 만남"}]');
            postsData = JSON.parse(localStorage.getItem('couple_posts') || '[]');
            commentsData = JSON.parse(localStorage.getItem('couple_comments') || '[]');
            
            try { customHolidays = JSON.parse(localStorage.getItem('couple_holidays') || '{}'); } catch(e){}

            applySettings(); renderTimeline();
            if(document.getElementById('view-calendar').classList.contains('active')) renderCalendar();
            if(document.getElementById('view-board').classList.contains('active')) processFilteredPosts();
        }

        function saveData() {
            localStorage.setItem('couple_settings', JSON.stringify(siteSettings));
            localStorage.setItem('couple_timeline', JSON.stringify(timelineData));
            localStorage.setItem('couple_posts', JSON.stringify(postsData));
            localStorage.setItem('couple_comments', JSON.stringify(commentsData));
            localStorage.setItem('couple_holidays', JSON.stringify(customHolidays));
        }

        function applySettings() {
            const names = siteSettings.couple_names || "Boy & Girl";
            document.getElementById('coupleNamesText').innerText = names;
            document.getElementById('settingNames').value = names;

            if(siteSettings.dday_date) {
                document.getElementById('settingDday').value = siteSettings.dday_date;
                const start = new Date(siteSettings.dday_date); const now = new Date();
                const diffDays = Math.ceil(Math.abs(now - start) / (1000 * 60 * 60 * 24)); 
                document.getElementById('ddayText').innerText = `D+${diffDays}`;
            }
        }

        function saveSettings() {
            siteSettings.dday_date = document.getElementById('settingDday').value;
            siteSettings.couple_names = document.getElementById('settingNames').value;
            saveData(); hideModal('settingsModal'); applySettings(); showToast("설정이 저장되었습니다.");
        }

        function renderTimeline() {
            timelineData.sort((a,b) => new Date(b.date) - new Date(a.date));
            document.getElementById('timelineList').innerHTML = timelineData.map((t, idx) => `
                <div class="tl-item">
                    <div class="tl-line"></div><div class="tl-dot"></div>
                    <div class="tl-content">
                        <div class="tl-date">${t.date}</div>
                        <div style="font-weight:700;">${t.desc} <button class="edit-mode-only-inline" style="border:none;background:none;color:#FF6B6B;margin-left:5px;cursor:pointer;" onclick="customConfirm('기록을 삭제할까요?', () => deleteTimelineItem(${idx}))"><i class="fa-solid fa-xmark"></i></button></div>
                    </div>
                </div>
            `).join('');
        }

        function addTimelineItem() {
            const date = document.getElementById('tlDate').value; const desc = document.getElementById('tlDesc').value;
            if(!date || !desc) return showToast('모두 입력해주세요.');
            timelineData.push({date, desc}); saveData();
            hideModal('addTimelineModal'); document.getElementById('tlDate').value=''; document.getElementById('tlDesc').value=''; renderTimeline(); showToast("역사가 기록되었습니다.");
        }
        function deleteTimelineItem(idx) { timelineData.splice(idx, 1); saveData(); renderTimeline(); showToast("삭제되었습니다."); }
        function triggerSiteImgUpload(key) { showToast(`${key} 교체 (로컬 테스트 모드)`); }

        /* =========================================================
           5. 캘린더 (실물형 & 스와이프 & 다이렉트 뷰)
           ========================================================= */
        let currentCalDate = new Date();
        
        function renderCalendar() {
            const year = currentCalDate.getFullYear(); const month = currentCalDate.getMonth();
            document.getElementById('cal-month-year').innerText = `${year}. ${String(month+1).padStart(2,'0')}`;
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const grid = document.getElementById('calendar-days');
            
            const daysArr = ['일','월','화','수','목','금','토'];
            let html = daysArr.map((d,i) => `<div class="cal-day-name ${i===0?'sun':(i===6?'sat':'')}">${d}</div>`).join('');
            const todayStr = new Date().toISOString().split('T')[0];

            for(let i=0; i<firstDay; i++) html += `<div class="cal-cell empty"></div>`;
            
            for(let d=1; d<=daysInMonth; d++) {
                const mmdd = `${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const dateStr = `${year}-${mmdd}`;
                
                const hasDiary = postsData.some(p => p.category === '다이어리' && p.date === dateStr);
                const hasSchedule = postsData.some(p => p.category === '일정' && p.date === dateStr);
                
                let classes = ['cal-cell'];
                if(dateStr === todayStr) classes.push('today');
                
                const dayOfWeek = new Date(year, month, d).getDay();
                if(dayOfWeek === 0) classes.push('sun');
                if(dayOfWeek === 6) classes.push('sat');

                // 휴일 체크
                let holName = '';
                if(defaultHolidays[mmdd]) holName = defaultHolidays[mmdd];
                if(customHolidays[mmdd]) holName = customHolidays[mmdd];
                if(customHolidays[dateStr]) holName = customHolidays[dateStr];
                
                if(holName) classes.push('holiday');

                let indicators = '';
                if(hasDiary) indicators += `<div class="dot-diary"></div>`;
                if(hasSchedule) indicators += `<div class="dot-schedule"></div>`;
                
                html += `<div class="${classes.join(' ')}" data-date="${dateStr}" onclick="openDayView(this, '${dateStr}')">
                    ${d}
                    <div class="cal-holiday-name">${holName}</div>
                    <div class="cal-indicators">${indicators}</div>
                </div>`;
            }
            grid.innerHTML = html;
        }

        function changeMonth(offset) { 
            currentCalDate.setMonth(currentCalDate.getMonth() + offset); 
            renderCalendar(); document.getElementById('calDayView').classList.remove('active');
        }

        function openDayView(cellEl, dateStr) {
            document.querySelectorAll('.cal-cell').forEach(c => c.classList.remove('selected'));
            cellEl.classList.add('selected');

            const view = document.getElementById('calDayView');
            document.getElementById('dayViewDateHdn').value = dateStr;
            const parts = dateStr.split('-');
            document.getElementById('dayViewTitle').innerText = `${parts[0]}. ${parts[1]}. ${parts[2]}`;
            
            // 휴일 인풋
            const mmdd = `${parts[1]}-${parts[2]}`;
            let exHol = customHolidays[dateStr] || customHolidays[mmdd] || defaultHolidays[mmdd] || '';
            document.getElementById('holidayInput').value = exHol;
            
            const dayPosts = postsData.filter(p => (p.category === '다이어리' || p.category === '일정') && p.date === dateStr);
            const listEl = document.getElementById('dayEntryList');
            
            if(dayPosts.length === 0) {
                listEl.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:20px 0;">등록된 기록이 없습니다.</p>`;
            } else {
                listEl.innerHTML = dayPosts.map(p => `
                    <div class="day-entry ${p.category==='일정'?'schedule':''}" onclick="openDetailById(${p.id})">
                        <span class="day-entry-cat">${p.category}</span>
                        <div class="day-entry-title">${p.title}</div>
                    </div>
                `).join('');
            }
            
            view.classList.add('active');
            
            // 모바일 스크롤 내리기
            setTimeout(() => {
                const calViewSec = document.getElementById('view-calendar');
                calViewSec.scrollTo({ top: calViewSec.scrollHeight, behavior: 'smooth' });
            }, 50);
        }

        function saveHoliday() {
            const dateStr = document.getElementById('dayViewDateHdn').value;
            const val = document.getElementById('holidayInput').value.trim();
            if(val) customHolidays[dateStr] = val; else delete customHolidays[dateStr];
            saveData(); renderCalendar(); showToast('기념일/휴일이 설정되었습니다.');
        }

        function bindEvents() {
            // 외부 클릭 닫기 (이벤트 전파 방지 구조)
            document.addEventListener('click', (e) => {
                const viewCal = document.getElementById('view-calendar');
                if(!viewCal.classList.contains('active')) return;
                const isGrid = document.getElementById('calendar-days').contains(e.target);
                const isView = document.getElementById('calDayView').contains(e.target);
                const isBtn = e.target.closest('.icon-btn') || e.target.closest('.modal-overlay');
                if(!isGrid && !isView && !isBtn) {
                    document.getElementById('calDayView').classList.remove('active');
                    document.querySelectorAll('.cal-cell').forEach(c => c.classList.remove('selected'));
                }
            });

            // 스와이프
            let touchStartX = 0;
            const calArea = document.getElementById('calendar-area');
            calArea.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX, {passive: true});
            calArea.addEventListener('touchend', e => {
                let touchEndX = e.changedTouches[0].screenX;
                if(touchEndX < touchStartX - 50) changeMonth(1); 
                if(touchEndX > touchStartX + 50) changeMonth(-1); 
            }, {passive: true});

            // 키보드 화살표
            document.addEventListener('keydown', (e) => {
                if(document.getElementById('view-calendar').classList.contains('active')) {
                    if(e.key === 'ArrowLeft') changeMonth(-1);
                    if(e.key === 'ArrowRight') changeMonth(1);
                }
            });
        }

        /* =========================================================
           6. 통합 글쓰기 폼
           ========================================================= */
        function toggleDateInput() {
            const cat = document.getElementById('postCategory').value;
            const dateWrap = document.getElementById('dateInputWrap');
            if(cat === '다이어리' || cat === '일정') dateWrap.style.display = 'block';
            else dateWrap.style.display = 'none';
        }

        function openWriteModal(catDefault, dateDefault) { 
            document.getElementById('postCategory').value = catDefault || '일상';
            document.getElementById('postDate').value = dateDefault || new Date().toISOString().split('T')[0];
            document.getElementById('postTitle').value = '';
            document.getElementById('postContent').value = '';
            toggleDateInput(); 
            showModal('writeModal'); 
        }

        /* =========================================================
           7. 스토리 게시판
           ========================================================= */
        function setBoardCategory(cat, btnEl) { 
            currentBoardTab = cat; 
            document.querySelectorAll('.board-tab').forEach(b => b.classList.remove('active')); btnEl.classList.add('active'); 
            processFilteredPosts(); 
        }

        function submitPost() {
            const cat = document.getElementById('postCategory').value; 
            const title = document.getElementById('postTitle').value.trim(); 
            const content = document.getElementById('postContent').value.trim(); 
            const dateStr = document.getElementById('postDate').value || new Date().toISOString().split('T')[0];
            const fakeUrl = document.getElementById('postImage').files.length > 0 ? 'https://via.placeholder.com/600x400?text=Uploaded+Media' : '';

            if(!title) return showToast('제목을 입력하세요.');
            
            const newPost = {
                id: Date.now(),
                author: authorName || '우리',
                title: title,
                category: cat,
                date: (cat==='다이어리'||cat==='일정') ? dateStr : '',
                content: content,
                image_url: fakeUrl,
                created_at: formatDate(new Date())
            };
            
            postsData.unshift(newPost); saveData();
            hideModal('writeModal'); loadLocalData(); showToast("기록되었습니다! 💖");
        }

        function processFilteredPosts() {
            const list = document.getElementById('boardList'); 
            list.innerHTML = ''; 
            
            let filtered = postsData.filter(p => {
                if(currentBoardTab === '전체') return p.category !== '다이어리' && p.category !== '일정';
                return p.category === currentBoardTab;
            });
            
            if(filtered.length === 0) { list.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:50px 0;">기록이 없습니다.</p>`; list.className=''; return; }

            if(currentBoardTab === '갤러리') {
                list.className = 'gallery-grid';
                filtered.forEach((p) => {
                    list.innerHTML += `
                        <div class="gallery-item" onclick="openDetailById(${p.id})">
                            <img src="${p.image_url || 'https://via.placeholder.com/300?text=NoImage'}">
                        </div>`;
                });
            } else {
                list.className = 'post-list';
                filtered.forEach((p) => {
                    const postComments = commentsData.filter(c => c.post_id === p.id);
                    list.innerHTML += `
                        <div class="post-card" onclick="openDetailById(${p.id})">
                            <div class="post-content-flex">
                                <div>
                                    <div class="post-top-meta">
                                        <span class="post-cat-badge">${p.category}</span>
                                        <span class="post-date">${p.created_at || ''}</span>
                                    </div>
                                    <div class="post-title">${p.title}</div>
                                    <div class="post-preview">${p.content}</div>
                                </div>
                                <div style="font-size:0.85rem; color:var(--text-muted; font-weight:700; margin-top:10px;"><i class="fa-regular fa-comment-dots"></i> 댓글 ${postComments.length}</div>
                            </div>
                            ${p.image_url ? `<img src="${p.image_url}" class="post-thumb">` : ''}
                        </div>`;
                });
            }
        }

        /* =========================================================
           8. 상세 모달 및 댓글
           ========================================================= */
        function openDetailById(id) {
            const p = postsData.find(item => item.id === id); if(!p) return;
            activePost = p;
            document.getElementById('modalCategory').innerText = p.category;
            document.getElementById('modalDateMeta').innerText = p.date ? `등록일: ${p.created_at||''}` : (p.created_at||'');
            document.getElementById('modalAuthor').innerText = p.author;
            document.getElementById('modalTitle').innerText = p.title;
            document.getElementById('modalContent').innerText = p.content;
            document.getElementById('modalImageWrap').innerHTML = getMediaHTML(p.image_url);
            
            renderComments(); showModal('detailModal');
        }

        function renderComments() {
            if(!activePost) return;
            const postComments = commentsData.filter(c => c.post_id === activePost.id);
            document.getElementById('modalCommentsHeader').innerText = `댓글 ${postComments.length}`;
            document.getElementById('modalCommentsList').innerHTML = postComments.map(c => `
                <div style="display:flex; justify-content:space-between; font-size:0.95rem; border-bottom:1px solid var(--border-light); padding-bottom:10px;">
                    <div><b style="color:var(--text-main); margin-right:8px;">${c.author}</b> <span style="color:#4A5568;">${c.content}</span><br><span style="font-size:0.75rem; color:var(--text-muted);">${c.created_at||''}</span></div>
                    ${(isEditMode || c.author === authorName) ? `<button style="background:none; border:none; color:#FC8181; cursor:pointer; padding:5px;" onclick="customConfirm('댓글을 지울까요?', () => deleteComment(${c.id}))"><i class="fa-solid fa-xmark"></i></button>` : ''}
                </div>
            `).join('');
            document.getElementById('modal-comment-input').value = '';
        }

        function submitComment() {
            if(!activePost) return;
            const content = document.getElementById('modal-comment-input').value.trim(); if (!content) return;
            commentsData.push({ id: Date.now(), post_id: activePost.id, author: authorName || '우리', content: content, created_at: formatDate(new Date()) });
            saveData(); renderComments();
            if(document.getElementById('view-board').classList.contains('active')) processFilteredPosts();
        }
        
        function deleteComment(id) {
            commentsData = commentsData.filter(c => c.id !== id); saveData(); renderComments();
            if(document.getElementById('view-board').classList.contains('active')) processFilteredPosts(); showToast('삭제되었습니다.');
        }

        function openEditFromDetail() {
            hideModal('detailModal'); if(!activePost) return;
            document.getElementById('editPostId').value = activePost.id; 
            document.getElementById('editTitle').value = activePost.title; 
            document.getElementById('editContent').value = activePost.content; 
            showModal('editModal');
        }

        function submitEdit() {
            const id = parseInt(document.getElementById('editPostId').value); const p = postsData.find(x => x.id === id);
            if(p) {
                p.title = document.getElementById('editTitle').value.trim();
                p.content = document.getElementById('editContent').value.trim();
                saveData(); hideModal('editModal'); loadLocalData(); showToast("수정 완료!");
            }
        }

        function deleteFromDetail() {
            customConfirm("추억을 완전히 삭제할까요?", () => {
                postsData = postsData.filter(p => p.id !== activePost.id);
                commentsData = commentsData.filter(c => c.post_id !== activePost.id);
                saveData(); hideModal('detailModal'); loadLocalData(); showToast("삭제되었습니다.");
            });
        }
    </script>
</body>
</html>
