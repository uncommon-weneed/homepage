<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Our Secret Space 💖</title>
    
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* Soft Romantic Theme */
            --primary: #FF8282;       
            --primary-light: #FFF0F0; 
            --primary-dark: #E56A6A;
            --secondary: #A0C4E2;     
            --bg-base: #FCF9F6;       
            --surface: rgba(255, 255, 255, 0.9); 
            --text-main: #3D3D3D;
            --text-muted: #9CA3AF;
            --border-light: rgba(255, 130, 130, 0.15);
            --shadow-soft: 0 8px 24px rgba(255, 130, 130, 0.08);
            --shadow-glass: 0 10px 30px rgba(0, 0, 0, 0.05);
            --radius-sm: 12px;
            --radius-md: 20px;
            --radius-lg: 32px;
            --nav-height: 70px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* 모바일 브라우저 하단바 가림 방지를 위한 100dvh 적용 */
        body { background: #E5E7EB; color: var(--text-main); overflow: hidden; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 130, 130, 0.3); border-radius: 10px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes pulseAlert { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        .fade-up { opacity: 0; transform: translateY(20px); transition: 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
        .fade-up.visible { opacity: 1; transform: translateY(0); }
        .glass { background: var(--surface); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.7); box-shadow: var(--shadow-glass); }

        #app-wrapper { width: 100%; height: 100dvh; display: flex; justify-content: center; position: relative; }
        #app-container { width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column; background: var(--bg-base); box-shadow: 0 0 30px rgba(0,0,0,0.1); position: relative; z-index: 1; }
        
        /* PC에서 강제 모바일 뷰 비활성화 시 전체화면 */
        body:not(.mobile-frame-mode) #app-container { max-width: 100%; box-shadow: none; }

        .edit-mode-only { display: none !important; }
        body.edit-mode .edit-mode-only { display: flex !important; }
        body.edit-mode .edit-mode-only-inline { display: inline-block !important; }

        .app-header { flex-shrink: 0; width: 100%; height: 65px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 50; }
        .header-title { font-weight: 800; font-size: 1.1rem; color: var(--primary-dark); display: flex; align-items: center; gap: 8px; }
        
        .view-section { flex: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: 30px; display: none; position: relative; scroll-behavior: smooth; }
        .view-section.active { display: block; animation: fadeIn 0.4s ease; }

        .bottom-nav { flex-shrink: 0; width: 100%; height: var(--nav-height); display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); border-top: 1px solid rgba(255,130,130,0.1); background: rgba(255,255,255,0.95); z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 33%; height: 100%; color: var(--text-muted); font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .nav-item i { font-size: 1.3rem; margin-bottom: 5px; transition: 0.3s; }
        .nav-item.active { color: var(--primary); }
        .nav-item.active i { transform: translateY(-3px); }

        .btn-primary { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: var(--radius-sm); font-size: 1.05rem; font-weight: 700; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(255,130,130,0.3); display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-2px); }
        .btn-outline { background: white; color: var(--text-main); border: 1px solid var(--border-light); }
        
        .form-group { margin-bottom: 15px; }
        .input-wrap { display: flex; align-items: center; background: white; border: 1px solid var(--border-light); border-radius: var(--radius-sm); padding: 5px 15px; transition: 0.3s; }
        .input-wrap:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
        .input-wrap i { color: var(--text-muted); margin-right: 10px; font-size: 1.1rem; }
        .form-input, .form-textarea, .form-select { flex: 1; width: 100%; padding: 12px 0; border: none; background: transparent; font-size: 1rem; outline: none; }
        .form-textarea { resize: vertical; min-height: 100px; padding: 12px 0; }

        /* 모달 시스템 */
        .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); z-index: 3000; display: none; align-items: center; justify-content: center; padding: 20px; opacity: 0; transition: opacity 0.3s ease; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content { width: 100%; max-width: 500px; max-height: 90vh; border-radius: var(--radius-lg); background: white; box-shadow: var(--shadow-glass); display: flex; flex-direction: column; transform: scale(0.95); transition: 0.3s; overflow: hidden; }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .modal-header { padding: 20px 25px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-light); }
        .modal-body { padding: 25px; overflow-y: auto; }
        .btn-close { background: none; border: none; font-size: 1.5rem; color: var(--text-muted); cursor: pointer; transition: 0.2s; }

        /* 토스트 메시지 */
        .toast { position: absolute; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: rgba(0,0,0,0.8); color: white; padding: 12px 25px; border-radius: 30px; font-size: 0.95rem; font-weight: 600; opacity: 0; transition: 0.4s; z-index: 10000; display: flex; gap: 10px; align-items: center; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        #auth-wall { position: absolute; inset: 0; background: url('https://images.unsplash.com/photo-1518621736915-f3b1c41bfd00?q=80&w=1920&auto=format&fit=crop') center/cover; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        #auth-wall::before { content: ''; position: absolute; inset: 0; background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); }
        .auth-box { position: relative; z-index: 1; padding: 40px 30px; border-radius: var(--radius-lg); width: 85%; max-width: 360px; text-align: center; }
        .role-btn-wrap { display: flex; gap: 15px; margin-top: 20px; }
        .role-btn { flex: 1; padding: 20px 10px; border-radius: 16px; border: 2px solid var(--border-light); background: white; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .role-btn:hover { border-color: var(--primary); background: var(--primary-light); transform: translateY(-5px); }
        .role-btn img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; }
        .role-btn span { font-weight: 800; font-size: 1.1rem; color: var(--text-main); }

        .container { padding: 20px; }
        .banner-wrap { position: relative; width: 100%; height: 300px; border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 25px; box-shadow: var(--shadow-soft); }
        .banner-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: 1s; }
        .banner-img.active { opacity: 1; }
        .banner-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.7), transparent); }
        .banner-content { position: absolute; bottom: 25px; left: 0; width: 100%; text-align: center; color: white; z-index: 2; }
        .dday-num { font-size: 3.5rem; font-weight: 800; font-family: 'Georgia', serif; line-height: 1; margin-bottom: 5px; }

        .widget-card { border-radius: var(--radius-md); padding: 20px; margin-bottom: 20px; background: white; border: 1px solid rgba(0,0,0,0.03); }
        .widget-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        
        /* Mood Widget */
        .mood-wrap { display: flex; justify-content: space-around; align-items: center; padding: 10px 0; }
        .mood-item { text-align: center; cursor: pointer; }
        .mood-emoji { font-size: 2.5rem; display: block; margin-bottom: 5px; transition: 0.2s; }
        .mood-item:hover .mood-emoji { transform: scale(1.1); }
        .mood-name { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); }

        .timeline-box { max-height: 250px; overflow-y: auto; padding-right: 5px; }
        .tl-item { display: flex; gap: 15px; margin-bottom: 15px; position: relative; }
        .tl-line { position: absolute; left: 5px; top: 25px; bottom: -15px; width: 2px; background: var(--primary-light); }
        .tl-item:last-child .tl-line { display: none; }
        .tl-dot { width: 12px; height: 12px; background: var(--primary); border-radius: 50%; z-index: 2; margin-top: 5px; }
        .tl-content { flex: 1; background: #F9FAFB; padding: 12px; border-radius: 12px; font-size: 0.95rem; }

        /* 다가오는 일정 알림 (인앱 토스트) */
        .upcoming-toast { position: absolute; bottom: 20px; left: 20px; right: 20px; background: var(--primary); color: white; padding: 15px 20px; border-radius: 16px; display: none; align-items: center; gap: 15px; box-shadow: 0 10px 25px rgba(255,130,130,0.4); z-index: 40; animation: slideUp 0.5s ease; }
        .upcoming-toast.show { display: flex; }
        
        .cal-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 0 10px; }
        .cal-month-title { font-size: 1.4rem; font-weight: 800; }
        .cal-nav-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border-light); background: white; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 15px; background: white; border-radius: var(--radius-lg); border: 1px solid rgba(0,0,0,0.03); }
        .cal-day-name { text-align: center; font-weight: 700; font-size: 0.8rem; padding-bottom: 8px; border-bottom: 1px solid #eee; margin-bottom: 5px; }
        
        .cal-cell { min-height: 50px; display: flex; flex-direction: column; align-items: center; padding: 5px 2px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.95rem; position: relative; border: 1px solid transparent; }
        .cal-cell.today { background: var(--primary-light); color: var(--primary-dark); }
        .cal-cell.selected { border-color: var(--primary); background: #FAFAFA; }
        .cal-cell.holiday { color: #E53E3E !important; }
        .cal-cell.saturday { color: #3182CE; }
        
        .event-mini-label { font-size: 0.6rem; font-weight: 700; color: white; border-radius: 4px; padding: 1px 4px; margin-top: 2px; width: 90%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
        
        .cal-inline-view { max-height: 0; overflow: hidden; opacity: 0; transition: 0.4s ease; margin-top: 10px; background: white; border-radius: var(--radius-md); border: 1px solid var(--border-light); }
        .cal-inline-view.active { max-height: 600px; opacity: 1; padding: 20px; box-shadow: var(--shadow-soft); }
        
        .day-entry-item { background: #F9FAFB; padding: 12px 15px; border-radius: 12px; margin-bottom: 10px; cursor: pointer; border-left: 4px solid #ccc; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
        .day-entry-item:hover { background: #F3F4F6; }

        /* 컬러 팔레트 */
        .color-picker { display: flex; gap: 10px; margin-top: 10px; }
        .color-opt { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .color-opt.active { border-color: #333; transform: scale(1.1); }

        .board-tabs { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .board-tab { background: none; border: none; font-size: 1rem; font-weight: 700; color: var(--text-muted); cursor: pointer; padding: 5px 10px; position: relative; white-space: nowrap; transition: 0.2s; }
        .board-tab.active { color: var(--primary); }
        .board-tab.active::after { content: ''; position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%); width: 80%; height: 3px; background: var(--primary); border-radius: 3px; }

        .post-card { background: white; border-radius: var(--radius-md); padding: 20px; margin-bottom: 15px; border: 1px solid rgba(0,0,0,0.03); cursor: pointer; }
        .post-title { font-size: 1.15rem; font-weight: 800; margin-bottom: 8px; }
        .post-preview { font-size: 0.95rem; color: #666; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 15px; }
        
        .fab { position: absolute; bottom: 90px; right: 20px; width: 56px; height: 56px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; box-shadow: 0 5px 20px rgba(255,130,130,0.5); border: none; z-index: 90; cursor: pointer; }

        .detail-img-wrap img { width: 100%; border-radius: 12px; margin-bottom: 15px; }
        .detail-content { font-size: 1.05rem; line-height: 1.7; white-space: pre-wrap; margin-bottom: 20px; }
        
        /* 공통 유틸 */
        .badge { padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; }
    </style>
</head>
<body class="mobile-frame-mode">

    <!-- 토스트 메시지 (전역) -->
    <div id="toast" class="toast"><i class="fa-solid fa-circle-info"></i> <span id="toastMsg"></span></div>

    <!-- 확인 모달 (Confirm) -->
    <div class="modal-overlay" id="confirmModal" style="z-index: 5000;">
        <div class="modal-content" style="max-width: 300px; text-align: center; padding: 25px;">
            <i class="fa-solid fa-triangle-exclamation" style="font-size: 2.5rem; color: var(--primary); margin-bottom: 15px;"></i>
            <h3 style="font-size: 1.1rem; margin-bottom: 20px;" id="confirmMsg">정말 삭제할까요?</h3>
            <div style="display: flex; gap: 10px;">
                <button class="btn-primary" style="flex:1;" id="confirmBtnYes">확인</button>
                <button class="btn-outline" style="flex:1; padding:15px; border-radius:12px;" id="confirmBtnNo">취소</button>
            </div>
        </div>
    </div>

    <div id="app-wrapper">
        
        <!-- 1. 로그인 (비밀번호) 화면 -->
        <div id="auth-wall">
            <div class="auth-box glass">
                <i class="fa-solid fa-heart" style="font-size: 3rem; color: var(--primary); margin-bottom: 15px; animation: pulseAlert 2s infinite;"></i>
                <h1 style="font-size:1.5rem; margin-bottom:10px;">Our Secret Space</h1>
                <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:25px;">우리만의 암호를 입력하세요.</p>
                <div class="input-wrap"><i class="fa-solid fa-lock"></i><input type="password" class="form-input" id="l_pw" placeholder="비밀번호" onkeydown="if(event.key==='Enter') submitLogin()"></div>
                <button class="btn-primary" style="margin-top:20px;" onclick="submitLogin()">입장하기</button>
            </div>
        </div>

        <!-- 2. 역할 (작성자) 선택 팝업 -->
        <div class="modal-overlay" id="roleModal" style="z-index: 4500;">
            <div class="modal-content glass" style="max-width: 350px; padding: 30px; text-align: center;">
                <h2 style="font-size:1.4rem; font-weight:800; margin-bottom:10px;">당신은 누구인가요?</h2>
                <p style="color:var(--text-muted); font-size:0.9rem;">글 작성 시 표시될 역할을 선택해주세요.</p>
                <div class="role-btn-wrap">
                    <div class="role-btn" onclick="setAuthorName('남자친구')">
                        <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?q=80&w=200&auto=format&fit=crop" alt="Boy">
                        <span>남자친구</span>
                    </div>
                    <div class="role-btn" onclick="setAuthorName('여자친구')">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=200&auto=format&fit=crop" alt="Girl">
                        <span>여자친구</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. 메인 앱 영역 -->
        <div id="app-container" style="display: none;">
            
            <header class="app-header glass">
                <div class="header-title"><i class="fa-solid fa-heart" style="color:var(--primary);"></i> Our Story</div>
                <div style="display:flex; gap:15px;">
                    <button class="btn-close" onclick="showModal('settingsModal')"><i class="fa-solid fa-gear"></i></button>
                    <button class="btn-close" onclick="handleLogout()"><i class="fa-solid fa-lock"></i></button>
                </div>
            </header>

            <main class="view-section active" id="view-home">
                <div class="container">
                    <!-- 배너 -->
                    <div class="banner-wrap fade-up">
                        <img src="https://images.unsplash.com/photo-1522673607200-164d1b6ce486?q=80&w=800&auto=format&fit=crop" class="banner-img active">
                        <img src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?q=80&w=800&auto=format&fit=crop" class="banner-img">
                        <div class="banner-overlay"></div>
                        <div class="banner-content">
                            <div style="font-size:1rem; font-weight:700; margin-bottom:5px;">함께한 지</div>
                            <div class="dday-num" id="ddayText">D+1</div>
                            <div style="font-weight:700; font-size:1.1rem;" id="coupleNamesText">Boy & Girl</div>
                        </div>
                    </div>

                    <!-- 무드 위젯 (추가 기능) -->
                    <div class="widget-card fade-up">
                        <div class="widget-title">Today's Mood ☁️</div>
                        <div class="mood-wrap">
                            <div class="mood-item" onclick="changeMood('남자친구')">
                                <span class="mood-emoji" id="mood-boy">😎</span>
                                <span class="mood-name">남자친구</span>
                            </div>
                            <div style="width:1px; height:40px; background:var(--border-light);"></div>
                            <div class="mood-item" onclick="changeMood('여자친구')">
                                <span class="mood-emoji" id="mood-girl">🥰</span>
                                <span class="mood-name">여자친구</span>
                            </div>
                        </div>
                    </div>

                    <!-- 타임라인 -->
                    <div class="widget-card fade-up">
                        <div class="widget-title">
                            Milestones 
                            <button class="btn-close edit-mode-only-inline" style="font-size:1.2rem;" onclick="showModal('addTimelineModal')"><i class="fa-solid fa-circle-plus"></i></button>
                        </div>
                        <div class="timeline-box" id="timelineList"></div>
                    </div>
                </div>

                <!-- 다가오는 일정 알림 토스트 -->
                <div id="upcomingToast" class="upcoming-toast">
                    <i class="fa-regular fa-bell" style="font-size:1.5rem;"></i>
                    <div style="flex:1;">
                        <div style="font-size:0.8rem; opacity:0.9;">다가오는 일정</div>
                        <div style="font-weight:700;" id="upcomingText">내일: 1주년 기념일</div>
                    </div>
                    <button style="background:none; border:none; color:white; font-size:1.2rem; cursor:pointer;" onclick="closeUpcomingToast()"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </main>

            <main class="view-section" id="view-calendar">
                <div class="container">
                    <div class="cal-header-row fade-up">
                        <button class="cal-nav-btn" onclick="changeMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                        <div class="cal-month-title" id="cal-month-year">2026. 10</div>
                        <button class="cal-nav-btn" onclick="changeMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                    
                    <!-- 달력 그리드 -->
                    <div class="cal-grid fade-up" id="calendar-days"></div>
                    
                    <!-- 달력 하단 상세 보기 (인라인) -->
                    <div class="cal-inline-view" id="calInlineView">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                            <h4 id="inlineViewTitle" style="color:var(--text-main); font-size:1.2rem; font-weight:800;">날짜</h4>
                            <button onclick="closeInlineView()" class="btn-close"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div id="inlineEntryList"></div>
                        <div style="display:flex; gap:10px; margin-top:20px;">
                            <button class="btn-primary" style="padding:10px; font-size:0.95rem; background:var(--secondary);" onclick="openWriteModal('일정', document.getElementById('inlineDateHdn').value)"><i class="fa-solid fa-thumbtack"></i> 일정 추가</button>
                            <button class="btn-primary" style="padding:10px; font-size:0.95rem;" onclick="openWriteModal('다이어리', document.getElementById('inlineDateHdn').value)"><i class="fa-solid fa-book"></i> 다이어리</button>
                        </div>
                        <input type="hidden" id="inlineDateHdn">
                    </div>
                </div>
            </main>

            <main class="view-section" id="view-board">
                <div class="container">
                    <div class="board-tabs fade-up">
                        <button class="board-tab active" onclick="setBoardCategory('전체', this)">전체 스토리</button>
                        <button class="board-tab" onclick="setBoardCategory('갤러리', this)">사진 갤러리</button>
                        <button class="board-tab" onclick="setBoardCategory('편지함', this)">비밀 편지</button>
                    </div>
                    <div id="boardList" class="fade-up"></div>
                </div>
                <button class="fab fade-up" onclick="openWriteModal('일상')"><i class="fa-solid fa-pen"></i></button>
            </main>

            <!-- 하단 네비게이션 고정 -->

                <a class="nav-item active" onclick="switchView('home', this)"><i class="fa-solid fa-house"></i><span>홈</span></a>
                <a class="nav-item" onclick="switchView('calendar', this)"><i class="fa-regular fa-calendar"></i><span>캘린더</span></a>
                <a class="nav-item" onclick="switchView('board', this)"><i class="fa-solid fa-layer-group"></i><span>스토리</span></a>

    <!-- 글쓰기 모달 -->
    <div class="modal-overlay" id="writeModal">
        <div class="modal-content" style="max-height: 85vh; width: 95%;">
            <div class="modal-header">
                <h3 style="font-weight:800; font-size:1.2rem;">새로운 기록 ✨</h3>
                <button class="btn-close" onclick="hideModal('writeModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <div class="input-wrap">
                        <i class="fa-solid fa-folder-open"></i>
                        <select id="postCategory" class="form-select" onchange="toggleDateInput()">
                            <option value="일상">일상 스토리</option>
                            <option value="갤러리">갤러리 (사진 필수)</option>
                            <option value="편지함">비밀 편지함</option>
                            <option value="다이어리">다이어리 (달력 연동)</option>

                </div>
                
                <div class="form-group" id="dateInputWrap" style="display:none;">
                    <div class="input-wrap"><i class="fa-regular fa-calendar-days"></i><input type="date" id="postDate" class="form-input"></div>
                    
                    <!-- 캘린더 색상 지정 옵션 -->
                    <div style="margin-top:10px; font-size:0.85rem; font-weight:700; color:var(--text-muted);">라벨 색상 지정</div>
                    <div class="color-picker" id="eventColorPicker">
                        <div class="color-opt active" style="background:var(--primary);" data-color="#FF8282" onclick="selectColor(this)"></div>
                        <div class="color-opt" style="background:#4299E1;" data-color="#4299E1" onclick="selectColor(this)"></div>
                        <div class="color-opt" style="background:#48BB78;" data-color="#48BB78" onclick="selectColor(this)"></div>
                        <div class="color-opt" style="background:#ECC94B;" data-color="#ECC94B" onclick="selectColor(this)"></div>
                        <div class="color-opt" style="background:#9F7AEA;" data-color="#9F7AEA" onclick="selectColor(this)"></div>
                    </div>
                    <input type="hidden" id="postColor" value="#FF8282">

                <div class="form-group">
                    <div class="input-wrap"><i class="fa-solid fa-heading"></i><input type="text" id="postTitle" class="form-input" placeholder="제목을 적어주세요."></div>
                </div>
                
                <div class="form-group" style="background:white; border:1px solid var(--border-light); border-radius:var(--radius-sm); padding:0 15px;">
                    <textarea id="postContent" class="form-textarea" placeholder="여기에 내용을 작성하세요..."></textarea>
                </div>
                
                <div class="form-group">
                    <label style="font-size:0.9rem; font-weight:700; color:var(--text-muted); display:block; margin-bottom:5px;"><i class="fa-solid fa-camera"></i> 사진 첨부</label>
                    <input type="file" id="postImage" accept="image/*" class="form-input" style="padding:10px; border:1px solid #eee; border-radius:8px;">
                </div>
                
                <button class="btn-primary" onclick="submitPost()">저장하기</button>
            </div>
        </div>
    </div>

    <!-- 상세 보기 모달 -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content" style="max-height: 85vh; width: 95%;">
            <div class="modal-header">
                <span class="badge" id="modalCategory" style="background:var(--primary-light); color:var(--primary-dark);">카테고리</span>
                <div style="display:flex; gap:15px;">
                    <button class="btn-close" id="btnDelPost" onclick="deleteActivePost()" style="color:#FC8181; font-size:1.2rem;"><i class="fa-regular fa-trash-can"></i></button>

    <!-- 설정 모달 -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-content" style="width: 90%; max-width: 400px;">
            <div class="modal-header">
                <h3 style="font-weight:800;"><i class="fa-solid fa-gear"></i> 설정</h3>
                <button class="btn-close" onclick="hideModal('settingsModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label style="font-weight:700; font-size:0.9rem; margin-bottom:5px; display:block;">편집 모드 (삭제/추가 관리)</label>
                    <button onclick="toggleEditMode()" class="btn-outline" style="width:100%; padding:10px; border-radius:8px;">ON / OFF 전환</button>
                </div>
                <div class="form-group">
                    <label style="font-weight:700; font-size:0.9rem; margin-bottom:5px; display:block;">처음 만난 날 (D-Day)</label>

                </div>
                <div class="form-group">
                    <label style="font-weight:700; font-size:0.9rem; margin-bottom:5px; display:block;">커스텀 휴일 (예: 12-25, 05-01)</label>
                    <div class="input-wrap"><input type="text" id="settingHolidays" class="form-input" placeholder="쉼표로 구분하여 입력"></div>
                </div>
                <button class="btn-primary" style="margin-top:10px;" onclick="saveSettings()">설정 저장</button>
            </div>
        </div>

    <!-- 타임라인 추가 모달 -->
    <div class="modal-overlay" id="addTimelineModal">
        <div class="modal-content" style="width: 90%; max-width: 400px;">
            <div class="modal-header">
                <h3 style="font-weight:800;">마일스톤 추가</h3>
                <button class="btn-close" onclick="hideModal('addTimelineModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group"><div class="input-wrap"><input type="date" id="tlDate" class="form-input"></div></div>
                <div class="form-group"><div class="input-wrap"><input type="text" id="tlDesc" class="form-input" placeholder="기억하고 싶은 사건은?"></div></div>
                <button class="btn-primary" onclick="addTimeline()">추가하기</button>
            </div>
        </div>
    </div>

    <script>
        // 전역 상태 변수
        let currentUser = null;
        let authorName = localStorage.getItem('app_author') || '';
        let postsData = JSON.parse(localStorage.getItem('app_posts') || '[]');
        let timelineData = JSON.parse(localStorage.getItem('app_timeline') || '[{"date":"2026-01-01", "desc":"우리의 시작 💖"}]');
        let settings = JSON.parse(localStorage.getItem('app_settings') || '{"dday":"2026-01-01", "holidays":""}');
        let moodData = JSON.parse(localStorage.getItem('app_mood') || '{"남자친구":"😎", "여자친구":"🥰"}');
        
        let currentBoardTab = '전체';
        let activePostId = null;
        let confirmAction = null;

        // 2026년 기준 대한민국 법정 공휴일 (양력 기준 및 음력 변환 수치 하드코딩)
        const koreanHolidays2026 = [
            "01-01", // 신정
            "02-16", "02-17", "02-18", // 설날 연휴 (2/17이 설날)
            "03-01", "03-02", // 3.1절 및 대체공휴일(3.1이 일요일)
            "05-05", // 어린이날
            "05-24", // 부처님오신날
            "06-06", // 현충일
            "08-15", "08-17", // 광복절 및 대체공휴일(8.15 토요일)
            "09-24", "09-25", "09-26", // 추석 연휴
            "10-03", // 개천절
            "10-09", // 한글날
            "12-25"  // 기독탄신일
        ];

        /* 유틸리티 및 UI 컨트롤 */
        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        function showModal(id) { 
            const el = document.getElementById(id);
            el.style.display = 'flex'; void el.offsetWidth; el.classList.add('active');
        }
        function hideModal(id) { 
            const el = document.getElementById(id);
            el.classList.remove('active');
            setTimeout(() => el.style.display = 'none', 300);
        }

        function customConfirm(msg, callback) {
            document.getElementById('confirmMsg').innerText = msg;
            confirmAction = callback;
            showModal('confirmModal');
        }
        document.getElementById('confirmBtnYes').onclick = () => { if(confirmAction) confirmAction(); hideModal('confirmModal'); };
        document.getElementById('confirmBtnNo').onclick = () => hideModal('confirmModal');

        window.onload = () => {
            currentUser = localStorage.getItem('app_auth');
            if(currentUser === 'true') {
                document.getElementById('auth-wall').style.display = 'none';
                document.getElementById('app-container').style.display = 'flex';
                if(!authorName) showModal('roleModal');
                else initApp();
            }
        };

        function submitLogin() {
            const pw = document.getElementById('l_pw').value;
            // 간단한 시크릿 번호 시뮬레이션 (ex: 1004)
            if(pw === '1004') {
                localStorage.setItem('app_auth', 'true');
                document.getElementById('auth-wall').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('auth-wall').style.display = 'none';
                    document.getElementById('app-container').style.display = 'flex';
                    if(!authorName) showModal('roleModal'); else initApp();
                }, 500);
            } else {
                showToast('암호가 틀렸습니다.');
            }
        }

        function setAuthorName(name) {
            authorName = name;
            localStorage.setItem('app_author', name);
            hideModal('roleModal');
            initApp();
            showToast(`${name}님 환영합니다!`);
        }

        function handleLogout() {
            localStorage.removeItem('app_auth'); location.reload();
        }

        function initApp() {
            applySettings();
            renderTimeline();
            updateMoodUI();
            checkUpcomingEvents();
            
            // 배너 슬라이더
            setInterval(() => {
                const banners = document.querySelectorAll('.banner-img');
                const activeIdx = Array.from(banners).findIndex(b => b.classList.contains('active'));
                banners[activeIdx].classList.remove('active');
                banners[(activeIdx + 1) % banners.length].classList.add('active');
            }, 5000);
        }

        function toggleEditMode() {
            document.body.classList.toggle('edit-mode');
            hideModal('settingsModal');
            showToast(document.body.classList.contains('edit-mode') ? "편집 모드 켜짐" : "편집 모드 꺼짐");
        }

        function switchView(viewId, btnEl) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            btnEl.classList.add('active');
            
            document.querySelectorAll('.view-section').forEach(el => {
                el.classList.remove('active'); el.style.animation = 'none'; void el.offsetWidth;
            });
            const target = document.getElementById(`view-${viewId}`);
            target.classList.add('active');
            
            if(viewId === 'calendar') { renderCalendar(); closeInlineView(); }
            if(viewId === 'board') renderBoard();
            
            // 맨 위로 스크롤 복구
            target.scrollTo(0,0);
        }

        function applySettings() {
            document.getElementById('settingDday').value = settings.dday || '';
            document.getElementById('settingHolidays').value = settings.holidays || '';
            
            if(settings.dday) {
                const diff = Math.ceil(Math.abs(new Date() - new Date(settings.dday)) / (1000 * 60 * 60 * 24));
                document.getElementById('ddayText').innerText = `D+${diff}`;
            }
        }

        function saveSettings() {
            settings.dday = document.getElementById('settingDday').value;
            settings.holidays = document.getElementById('settingHolidays').value;
            localStorage.setItem('app_settings', JSON.stringify(settings));
            hideModal('settingsModal'); applySettings(); showToast("설정 저장됨");
            if(document.getElementById('view-calendar').classList.contains('active')) renderCalendar();
        }

        function updateMoodUI() {
            document.getElementById('mood-boy').innerText = moodData['남자친구'];
            document.getElementById('mood-girl').innerText = moodData['여자친구'];
        }

        function changeMood(who) {
            if(authorName !== who && !document.body.classList.contains('edit-mode')) {
                return showToast('본인의 기분만 바꿀 수 있어요!');
            }
            const emojis = ['🥰','😍','😎','😴','😥','😡','🥳','🤒'];
            let currentIdx = emojis.indexOf(moodData[who]);
            moodData[who] = emojis[(currentIdx + 1) % emojis.length];
            localStorage.setItem('app_mood', JSON.stringify(moodData));
            updateMoodUI();
        }

        function renderTimeline() {
            const list = document.getElementById('timelineList');
            timelineData.sort((a,b) => new Date(b.date) - new Date(a.date));
            list.innerHTML = timelineData.map((t, i) => `
                <div class="tl-item">
                    <div class="tl-line"></div><div class="tl-dot"></div>
                    <div class="tl-content">
                        <div style="font-size:0.8rem; color:var(--text-muted); font-weight:700;">${t.date}</div>
                        <div style="font-weight:700;">${t.desc} <button class="edit-mode-only-inline" style="background:none; border:none; color:#FC8181; margin-left:5px;" onclick="customConfirm('삭제할까요?', ()=>deleteTimeline(${i}))"><i class="fa-solid fa-xmark"></i></button></div>
                    </div>
                </div>
            `).join('');
        }
        function addTimeline() {
            const d = document.getElementById('tlDate').value; const desc = document.getElementById('tlDesc').value;
            if(!d || !desc) return showToast('모두 입력하세요.');
            timelineData.push({date:d, desc:desc}); localStorage.setItem('app_timeline', JSON.stringify(timelineData));
            hideModal('addTimelineModal'); renderTimeline(); showToast('추가되었습니다.');
        }
        function deleteTimeline(idx) { timelineData.splice(idx,1); localStorage.setItem('app_timeline', JSON.stringify(timelineData)); renderTimeline(); }

        function checkUpcomingEvents() {
            const today = new Date();
            today.setHours(0,0,0,0);
            const nextWeek = new Date(today.getTime() + 7 * 24 * 60 * 60 * 1000);
            
            const upcoming = postsData.filter(p => {
                if(p.category !== '일정' || !p.date) return false;
                const pDate = new Date(p.date);
                return pDate >= today && pDate <= nextWeek;
            }).sort((a,b) => new Date(a.date) - new Date(b.date));

            if(upcoming.length > 0) {
                const ev = upcoming[0];
                const diff = Math.ceil((new Date(ev.date) - today) / (1000 * 3600 * 24));
                const dText = diff === 0 ? '오늘' : diff === 1 ? '내일' : `${diff}일 뒤`;
                document.getElementById('upcomingText').innerText = `${dText}: ${ev.title}`;
                document.getElementById('upcomingToast').classList.add('show');
            }
        }
        function closeUpcomingToast() { document.getElementById('upcomingToast').classList.remove('show'); }

        let currentCalDate = new Date();

        function renderCalendar() {
            const y = currentCalDate.getFullYear(); const m = currentCalDate.getMonth();
            document.getElementById('cal-month-year').innerText = `${y}. ${String(m+1).padStart(2,'0')}`;
            
            const firstDay = new Date(y, m, 1).getDay();
            const daysInMonth = new Date(y, m + 1, 0).getDate();
            const grid = document.getElementById('calendar-days');
            
            const daysArr = ['일','월','화','수','목','금','토'];
            let html = daysArr.map((d,i) => `<div class="cal-day-name" style="${i===0?'color:#E53E3E':(i===6?'color:#3182CE':'')}">${d}</div>`).join('');
            
            for(let i=0; i<firstDay; i++) html += `<div></div>`;
            
            const userHolidays = settings.holidays ? settings.holidays.split(',').map(s=>s.trim()) : [];
            const todayStr = new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD

            for(let d=1; d<=daysInMonth; d++) {
                const mmdd = `${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const dateStr = `${y}-${mmdd}`;
                const dayOfWeek = new Date(y, m, d).getDay();
                
                let classes = ['cal-cell'];
                if(dateStr === todayStr) classes.push('today');
                
                // 휴일 로직 (일요일, 법정공휴일, 커스텀휴일)
                if(dayOfWeek === 0 || koreanHolidays2026.includes(mmdd) || userHolidays.includes(mmdd)) classes.push('holiday');
                else if(dayOfWeek === 6) classes.push('saturday');

                // 해당 날짜 이벤트 검색
                const dayEvents = postsData.filter(p => (p.category === '일정' || p.category === '다이어리') && p.date === dateStr);
                
                // 마커 생성 (최대 2개까지만 텍스트 표시)
                let markerHtml = '';
                dayEvents.slice(0,2).forEach(ev => {
                    const bg = ev.color || (ev.category==='일정'?'#48BB78':'#4299E1');
                    markerHtml += `<div class="event-mini-label" style="background:${bg};">${ev.title}</div>`;
                });
                if(dayEvents.length > 2) markerHtml += `<div style="font-size:0.6rem; color:#999;">+${dayEvents.length-2}</div>`;

                html += `<div class="${classes.join(' ')}" onclick="openInlineView(this, '${dateStr}')">
                            <span style="z-index:2;">${d}</span>
                            <div style="width:100%; display:flex; flex-direction:column; align-items:center; gap:2px; margin-top:2px;">${markerHtml}</div>
                         </div>`;
            }
            grid.innerHTML = html;
        }

        function changeMonth(offset) {
            currentCalDate.setMonth(currentCalDate.getMonth() + offset);
            renderCalendar(); closeInlineView();
        }

        function openInlineView(cellEl, dateStr) {
            document.querySelectorAll('.cal-cell').forEach(c => c.classList.remove('selected'));
            cellEl.classList.add('selected');

            document.getElementById('inlineDateHdn').value = dateStr;
            const p = dateStr.split('-');
            document.getElementById('inlineViewTitle').innerText = `${p[0]}년 ${p[1]}월 ${p[2]}일`;
            
            const dayEvents = postsData.filter(e => (e.category === '일정' || e.category === '다이어리') && e.date === dateStr);
            const list = document.getElementById('inlineEntryList');
            
            if(dayEvents.length === 0) {
                list.innerHTML = `<div style="text-align:center; color:#999; padding:20px 0;">기록이 없습니다.</div>`;
            } else {
                // onclick 시 event propagation 중단을 위해 상세 함수 호출 방식 수정
                list.innerHTML = dayEvents.map(e => {
                    const bg = e.color || (e.category==='일정'?'#48BB78':'#4299E1');
                    return `
                    <div class="day-entry-item" style="border-left-color:${bg};" onclick="event.stopPropagation(); openDetail('${e.id}')">
                        <span class="badge" style="background:${bg}30; color:${bg}; margin-right:10px;">${e.category}</span>
                        <div style="font-weight:700; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${e.title}</div>
                        <i class="fa-solid fa-chevron-right" style="color:#ccc; font-size:0.8rem;"></i>
                    </div>
                `}).join('');
            }
            document.getElementById('calInlineView').classList.add('active');
        }
        function closeInlineView() {
            document.getElementById('calInlineView').classList.remove('active');
            document.querySelectorAll('.cal-cell').forEach(c => c.classList.remove('selected'));
        }

        function toggleDateInput() {
            const c = document.getElementById('postCategory').value;
            document.getElementById('dateInputWrap').style.display = (c==='다이어리'||c==='일정') ? 'block' : 'none';
        }

        function selectColor(el) {
            document.querySelectorAll('.color-opt').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('postColor').value = el.getAttribute('data-color');
        }

        function openWriteModal(cat, dateStr) {
            document.getElementById('postCategory').value = cat || '일상';
            document.getElementById('postDate').value = dateStr || new Date().toLocaleDateString('en-CA');
            document.getElementById('postTitle').value = '';
            document.getElementById('postContent').value = '';
            document.getElementById('postImage').value = '';
            toggleDateInput();
            showModal('writeModal');
        }

        function submitPost() {
            const cat = document.getElementById('postCategory').value;
            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();
            const date = document.getElementById('postDate').value;
            const color = document.getElementById('postColor').value;
            // 간단 이미지 URL 모의 (실제 서비스는 서버 업로드 필요)
            const hasImg = document.getElementById('postImage').files.length > 0;
            const imgUrl = hasImg ? 'https://images.unsplash.com/photo-1518199268839-497c413d806a?q=80&w=800&auto=format&fit=crop' : '';

            if(!title) return showToast('제목을 입력하세요!');

            const newPost = {
                id: Date.now().toString(),
                author: authorName,
                category: cat,
                title: title,
                content: content,
                date: (cat==='다이어리'||cat==='일정') ? date : '',
                color: color,
                image: imgUrl,
                created_at: new Date().toLocaleDateString()
            };

            postsData.unshift(newPost);
            localStorage.setItem('app_posts', JSON.stringify(postsData));
            hideModal('writeModal'); showToast('기록되었습니다 💖');
            
            if(document.getElementById('view-calendar').classList.contains('active')) { renderCalendar(); closeInlineView(); checkUpcomingEvents(); }
            if(document.getElementById('view-board').classList.contains('active')) renderBoard();
        }

        function setBoardCategory(cat, btn) {
            currentBoardTab = cat;
            document.querySelectorAll('.board-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderBoard();
        }

        function renderBoard() {
            const list = document.getElementById('boardList');
            const filtered = postsData.filter(p => {
                if(currentBoardTab === '전체') return p.category !== '다이어리' && p.category !== '일정';
                return p.category === currentBoardTab;
            });

            if(filtered.length === 0) {
                list.innerHTML = `<div style="text-align:center; padding:50px 0; color:#999;">작성된 글이 없어요.</div>`;
                return;
            }

            if(currentBoardTab === '갤러리') {
                list.style.display = 'grid'; list.style.gridTemplateColumns = '1fr 1fr'; list.style.gap = '10px';
                list.innerHTML = filtered.map(p => `
                    <div style="border-radius:12px; overflow:hidden; aspect-ratio:1; cursor:pointer;" onclick="openDetail('${p.id}')">
                        <img src="${p.image || 'https://via.placeholder.com/400'}" style="width:100%; height:100%; object-fit:cover;">
                    </div>
                `).join('');
            } else {
                list.style.display = 'block';
                list.innerHTML = filtered.map(p => `
                    <div class="post-card" onclick="openDetail('${p.id}')">
                        <span class="badge" style="background:var(--primary-light); color:var(--primary-dark); margin-bottom:8px; display:inline-block;">${p.category}</span>
                        <div class="post-title">${p.title}</div>
                        <div class="post-preview">${p.content}</div>
                        <div style="font-size:0.8rem; color:#A0AEC0;">${p.created_at} · ${p.author}</div>
                    </div>
                `).join('');
            }
        }

        function openDetail(id) {
            const p = postsData.find(x => x.id === id); if(!p) return;
            activePostId = id;
            document.getElementById('modalCategory').innerText = p.category;
            document.getElementById('modalTitle').innerText = p.title;
            document.getElementById('modalAuthor').innerText = p.author;
            document.getElementById('modalDateMeta').innerText = (p.date ? p.date + " / " : "") + p.created_at;
            document.getElementById('modalContent').innerText = p.content;
            document.getElementById('modalImageWrap').innerHTML = p.image ? `<img src="${p.image}">` : '';
            
            const canEdit = document.body.classList.contains('edit-mode') || p.author === authorName;
            document.getElementById('btnDelPost').style.display = canEdit ? 'inline-block' : 'none';
            
            showModal('detailModal');
        }

        function deleteActivePost() {
            customConfirm('기록을 완전히 삭제하시겠습니까?', () => {
                postsData = postsData.filter(p => p.id !== activePostId);
                localStorage.setItem('app_posts', JSON.stringify(postsData));
                hideModal('detailModal'); showToast('삭제되었습니다.');
                
                if(document.getElementById('view-calendar').classList.contains('active')) { renderCalendar(); closeInlineView(); checkUpcomingEvents(); }
                if(document.getElementById('view-board').classList.contains('active')) renderBoard();
            });
        }
    </script>
</body>
</html>
