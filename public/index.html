<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Our Secret Space 💖</title>
    <!-- 파비콘 (하트 이모지) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💖</text></svg>">
    <!-- Web Fonts & Icons -->
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #FF8282;       
            --primary-light: #FFF0F0; 
            --primary-dark: #E56A6A;
            --secondary: #A0C4E2;     
            --bg-base: #FDFBF9;       
            --surface: rgba(255, 255, 255, 0.95); 
            --text-main: #333333;
            --text-muted: #9CA3AF;
            --border-light: rgba(255, 130, 130, 0.15);
            --shadow-app: 0 0 40px rgba(0, 0, 0, 0.08);
            --shadow-card: 0 10px 25px rgba(255, 130, 130, 0.06);
            --shadow-float: 0 12px 30px rgba(255, 130, 130, 0.3);
            --radius-sm: 16px;
            --radius-md: 24px;
            --radius-lg: 32px;
            --nav-height: 75px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* 100dvh를 사용해 모바일 브라우저 주소창 스크롤에 하단 메뉴가 밀리는 현상 방지 */
        body { background: #E5E7EB; color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100dvh; overflow: hidden; font-weight: 400; }
        
        /* 하이브리드 앱 랩퍼 */
        #app-wrapper { width: 100%; height: 100dvh; max-width: 480px; background: var(--bg-base); position: relative; display: flex; flex-direction: column; box-shadow: var(--shadow-app); overflow: hidden; transition: max-width 0.3s ease; }
        body:not(.mobile-frame-mode) #app-wrapper { max-width: 100%; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 130, 130, 0.3); border-radius: 10px; }
        
        /* 공통 애니메이션 */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.9) translateY(20px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes pulseHeart { 0%, 100% { transform: scale(1); filter: drop-shadow(0 4px 10px rgba(255,130,130,0.4)); } 50% { transform: scale(1.1); filter: drop-shadow(0 8px 20px rgba(255,130,130,0.6)); } }
        @keyframes slideUpToast { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }

        .fade-up { opacity: 0; transform: translateY(20px); transition: opacity 0.5s ease-out, transform 0.5s ease-out; }
        .fade-up.visible { opacity: 1; transform: translateY(0); }
        .glass { background: var(--surface); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.7); }

        /* 편집 모드 뱃지 */
        .edit-mode-only { display: none !important; }
        body.edit-mode .edit-mode-only { display: flex !important; }
        body.edit-mode .edit-mode-only-inline { display: inline-block !important; }

        .view-section { display: none; flex-grow: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: calc(var(--nav-height) + 30px); scroll-behavior: smooth; }
        .view-section.active { display: block; animation: fadeIn 0.4s ease-out; }

        .app-header { flex-shrink: 0; width: 100%; height: 65px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 50; border-bottom: 1px solid var(--border-light); background: rgba(253,251,249,0.9); backdrop-filter: blur(10px); }
        .header-title { font-weight: 800; font-size: 1.15rem; color: var(--primary); display: flex; align-items: center; gap: 8px; font-family: 'Georgia', serif; font-style: italic; }
        .header-clock { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); font-variant-numeric: tabular-nums; }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .icon-btn { background: none; border: none; font-size: 1.25rem; color: var(--text-muted); cursor: pointer; transition: 0.2s; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .icon-btn:hover { color: var(--primary); background: var(--primary-light); }

        .bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; height: var(--nav-height); background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); z-index: 100; display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -5px 20px rgba(0,0,0,0.03); }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 33%; height: 100%; color: var(--text-muted); transition: 0.3s; cursor: pointer; gap: 4px; }
        .nav-item i { font-size: 1.4rem; transition: 0.3s; }
        .nav-item span { font-size: 0.75rem; font-weight: 700; }
        .nav-item.active { color: var(--primary); }
        .nav-item.active i { transform: translateY(-3px); filter: drop-shadow(0 2px 5px rgba(255,130,130,0.3)); }

        #auth-wall { position: absolute; inset: 0; background: url('https://images.unsplash.com/photo-1518621736915-f3b1c41bfd00?q=80&w=1000&auto=format&fit=crop') center/cover; z-index: 9999; display: flex; align-items: center; justify-content: center; transition: opacity 0.4s ease; }
        #auth-wall::before { content: ''; position: absolute; inset: 0; background: rgba(255,255,255,0.7); backdrop-filter: blur(15px); }
        .auth-box { position: relative; z-index: 1; width: 85%; max-width: 360px; padding: 45px 30px; border-radius: var(--radius-lg); text-align: center; }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 5000; display: none; align-items: center; justify-content: center; opacity: 0; transition: 0.3s; padding: 20px; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content { width: 100%; max-width: 450px; max-height: 90vh; border-radius: var(--radius-lg); display: flex; flex-direction: column; background: #FFF; box-shadow: var(--shadow-glass); transform: scale(0.95); transition: 0.3s; overflow: hidden; }
        .modal-overlay.active .modal-content { transform: scale(1); }
        
        .modal-header { padding: 20px 25px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-light); }
        .modal-body { padding: 25px; overflow-y: auto; flex-grow: 1; }
        .btn-close { background: #F3F4F6; border: none; font-size: 1.2rem; color: var(--text-muted); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .btn-close:hover { color: var(--primary); background: var(--primary-light); }

        .toast { position: fixed; bottom: calc(var(--nav-height) + 20px); left: 50%; transform: translate(-50%, 20px); background: rgba(30, 30, 30, 0.9); backdrop-filter: blur(10px); color: white; padding: 14px 24px; border-radius: 30px; font-size: 0.95rem; font-weight: 700; opacity: 0; transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 10000; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); pointer-events: none; white-space: nowrap; }
        .toast.show { transform: translate(-50%, 0); opacity: 1; }

        .upcoming-toast { position: absolute; bottom: 20px; left: 20px; right: 20px; background: var(--primary); color: white; padding: 16px 20px; border-radius: 20px; display: none; align-items: center; gap: 15px; box-shadow: 0 10px 25px rgba(255,130,130,0.4); z-index: 40; animation: slideUpToast 0.5s cubic-bezier(0.2,0.8,0.2,1); }
        .upcoming-toast.show { display: flex; }

        /* 역할(남/녀) 버튼 UI */
        .role-btn-grid { display: flex; gap: 15px; margin-top: 20px; }
        .role-btn { flex: 1; padding: 25px 10px; border-radius: 20px; border: 2px solid var(--border-light); background: #FFF; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .role-btn i { font-size: 2.5rem; color: var(--text-muted); transition: 0.3s; }
        .role-btn span { font-size: 1.1rem; font-weight: 800; color: var(--text-main); }
        .role-btn.boy:hover { border-color: #60A5FA; background: #EFF6FF; }
        .role-btn.boy:hover i { color: #60A5FA; }
        .role-btn.girl:hover { border-color: var(--primary); background: var(--primary-light); }
        .role-btn.girl:hover i { color: var(--primary); }

        .form-group { margin-bottom: 15px; }
        .form-input, .form-textarea, .form-select { width: 100%; padding: 16px; background: #F8F9FA; border: 1px solid var(--border-light); border-radius: var(--radius-sm); font-size: 1.05rem; transition: 0.3s; outline: none; color: var(--text-main); }
        .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); background: white; }
        .btn-primary { width: 100%; background: var(--primary); color: white; border: none; padding: 18px; border-radius: var(--radius-sm); font-size: 1.1rem; font-weight: 800; cursor: pointer; transition: 0.2s; box-shadow: var(--shadow-float); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary:active { transform: scale(0.96); box-shadow: 0 5px 15px rgba(255, 130, 130, 0.2); }

        /* 트렌디한 파일 업로드 박스 */
        .file-upload-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 25px; border: 2px dashed var(--primary); border-radius: var(--radius-sm); background: var(--primary-light); color: var(--primary-dark); cursor: pointer; transition: 0.3s; text-align: center; gap: 10px; font-weight: 700; }
        .file-upload-box:hover { background: #ffe5e5; }
        .file-upload-box i { font-size: 2.2rem; }

        .container { padding: 20px; }
        .banner-wrap { position: relative; width: 100%; height: 350px; border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-card); margin-bottom: 25px; cursor: zoom-in; }
        .banner-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.5s ease; z-index: 1; }
        .banner-img.active { opacity: 1; z-index: 2; }
        .banner-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.6), transparent 60%); z-index: 3; }
        .banner-content { position: absolute; bottom: 25px; left: 0; width: 100%; text-align: center; z-index: 4; color: white; }
        .dday-badge { display: inline-block; background: rgba(255,255,255,0.25); backdrop-filter: blur(10px); padding: 6px 18px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.4); }
        .dday-num { font-size: 4.5rem; font-weight: 800; font-family: 'Georgia', serif; line-height: 1; margin-bottom: 5px; }
        
        .widget-card { background: white; border-radius: var(--radius-md); padding: 25px; margin-bottom: 20px; box-shadow: var(--shadow-card); border: 1px solid rgba(0,0,0,0.02); }
        .widget-title { font-size: 1.25rem; font-weight: 800; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; color: var(--text-main); }
        
        .profile-flex { display: flex; justify-content: space-evenly; align-items: center; }
        .profile-pic { width: 95px; height: 95px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary-light); box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 10px; }
        .profile-item { text-align: center; position: relative; }
        .profile-item span { font-weight: 800; font-size: 1.1rem; }

        .timeline-box { max-height: 280px; overflow-y: auto; padding-right: 5px; }
        .tl-item { display: flex; gap: 15px; margin-bottom: 20px; position: relative; }
        .tl-line { position: absolute; left: 5px; top: 25px; bottom: -20px; width: 2px; background: var(--border-light); }
        .tl-item:last-child .tl-line { display: none; }
        .tl-dot { width: 12px; height: 12px; background: var(--primary); border-radius: 50%; z-index: 2; margin-top: 5px; box-shadow: 0 0 0 4px var(--primary-light); }
        .tl-content { flex-grow: 1; background: #F9FAFB; padding: 15px 20px; border-radius: 16px; font-size: 1.05rem; font-weight: 600; }
        .tl-date { font-size: 0.85rem; font-weight: 800; color: var(--primary); margin-bottom: 4px; }

        .cal-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 0 5px; }
        .cal-month-title { font-size: 1.7rem; font-weight: 800; font-family: 'Georgia', serif; }
        .cal-nav-btn { background: #FFF; border: 1px solid var(--border-light); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.02); transition: 0.2s; }
        
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; background: white; padding: 20px 15px; border-radius: var(--radius-lg); box-shadow: var(--shadow-card); touch-action: pan-y; }
        .cal-day-name { text-align: center; font-weight: 800; font-size: 0.85rem; padding-bottom: 10px; border-bottom: 1px solid var(--border-light); margin-bottom: 5px; color: var(--text-muted); }
        .cal-cell { aspect-ratio: 1/1; display: flex; flex-direction: column; align-items: center; padding-top: 8px; border-radius: 14px; cursor: pointer; font-weight: 700; font-size: 1.05rem; transition: 0.2s; position: relative; border: 2px solid transparent; }
        .cal-cell:active { background: #F3F4F6; transform: scale(0.95); }
        .cal-cell.today { background: var(--primary-light); color: var(--primary); }
        .cal-cell.selected { border-color: var(--primary); background: #FFF; }
        .cal-cell.holiday { color: #E53E3E !important; }
        .cal-cell.saturday { color: #3182CE; }
        
        .cal-holiday-name { font-size: 0.6rem; color: #E53E3E; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; padding: 0 2px; }
        .cal-indicators { display: flex; gap: 4px; margin-top: auto; padding-bottom: 6px; }
        .dot-marker { width: 6px; height: 6px; border-radius: 50%; }

        /* 다이렉트 데이 뷰 */
        .cal-day-view { max-height: 0; overflow: hidden; opacity: 0; transition: 0.4s ease; margin-top: 15px; }
        .cal-day-view.active { max-height: 600px; opacity: 1; }
        .day-view-card { background: white; border-radius: var(--radius-md); padding: 25px; box-shadow: var(--shadow-card); }
        .day-entry-item { background: #F9FAFB; padding: 16px; border-radius: 14px; margin-bottom: 12px; border-left: 4px solid var(--primary); cursor: pointer; transition: 0.2s; }
        .day-entry-item:active { transform: scale(0.98); background: #F3F4F6; }
        .entry-cat { font-size: 0.8rem; font-weight: 800; color: var(--text-muted); margin-bottom: 4px; display: block; }
        .entry-title { font-size: 1.1rem; font-weight: 800; color: var(--text-main); }

        .color-picker { display: flex; gap: 12px; margin-top: 10px; }
        .color-dot { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .color-dot.active { border-color: var(--text-main); transform: scale(1.15); }

        .board-tabs { display: flex; gap: 12px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .board-tab { background: none; border: none; font-size: 1.1rem; font-weight: 800; color: var(--text-muted); cursor: pointer; padding: 8px 4px; position: relative; white-space: nowrap; transition: 0.2s; }
        .board-tab.active { color: var(--text-main); }
        .board-tab.active::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 100%; height: 4px; background: var(--primary); border-radius: 4px; }

        .post-card { background: white; border-radius: var(--radius-md); padding: 22px; margin-bottom: 15px; cursor: pointer; box-shadow: var(--shadow-card); border: 1px solid rgba(0,0,0,0.02); display: flex; gap: 15px; transition: 0.3s; }
        .post-card:active { transform: scale(0.98); }
        .post-text-wrap { flex-grow: 1; overflow: hidden; }
        .post-cat-badge { background: var(--primary-light); color: var(--primary-dark); padding: 5px 12px; border-radius: 10px; font-weight: 800; font-size: 0.8rem; display: inline-block; margin-bottom: 8px; }
        .post-title { font-size: 1.25rem; font-weight: 800; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .post-preview { font-size: 0.95rem; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.5; }
        
        .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .gallery-item { border-radius: var(--radius-sm); overflow: hidden; cursor: pointer; aspect-ratio: 1/1; box-shadow: var(--shadow-card); position: relative; }
        .gallery-item img, .gallery-item video { width: 100%; height: 100%; object-fit: cover; }

        .inline-comments { background: #F9FAFB; padding: 15px; border-radius: 14px; margin-top: 15px; border-top: 1px dashed var(--border-light); }
        .inline-comment-item { display: flex; justify-content: space-between; font-size: 0.95rem; margin-bottom: 8px; align-items: flex-start; }
        .inline-comment-input-wrap { display: flex; gap: 8px; margin-top: 12px; }
        .inline-comment-input-wrap input { flex-grow: 1; padding: 12px 15px; border: 1px solid var(--border-light); border-radius: 12px; outline: none; }
        .inline-comment-input-wrap button { padding: 0 18px; background: var(--text-main); color: white; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; }

        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 25px; }
        .page-btn { width: 36px; height: 36px; border-radius: 50%; background: #FFF; border: 1px solid var(--border-light); color: var(--text-muted); font-weight: 800; cursor: pointer; }
        .page-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: var(--shadow-float); }

        .fab { position: absolute; bottom: calc(var(--nav-height) + 20px); right: 20px; width: 60px; height: 60px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; box-shadow: var(--shadow-float); border: none; z-index: 90; cursor: pointer; transition: 0.2s; }
        .fab:active { transform: scale(0.9) rotate(45deg); }

        #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 8000; align-items: center; justify-content: center; opacity: 0; transition: 0.3s ease; }
        #lightbox img, #lightbox video { max-width: 95vw; max-height: 95vh; border-radius: 16px; object-fit: contain; }
    </style>
</head>
<body class="mobile-frame-mode">

    <!-- 전역 모달 및 토스트 -->
    <div id="toast" class="toast"><i class="fa-solid fa-heart" style="color:var(--primary);"></i> <span id="toastMsg"></span></div>

    <div class="modal-overlay" id="confirmModal" style="z-index: 6000;">
        <div class="modal-content glass" style="max-width: 320px; padding: 35px 25px; text-align: center;">
            <i class="fa-solid fa-circle-exclamation" style="font-size: 3rem; color: #FC8181; margin-bottom: 20px;"></i>
            <h3 style="font-size: 1.2rem; font-weight: 800; margin-bottom: 25px;" id="confirmMsg">정말 삭제할까요?</h3>
            <div style="display: flex; gap: 10px; width: 100%;">
                <button class="btn-primary" style="background: #E2E8F0; color: var(--text-main); flex: 1; box-shadow:none;" id="confirmBtnNo">취소</button>
                <button class="btn-primary" style="background: #FC8181; flex: 1;" id="confirmBtnYes">삭제</button>
            </div>
        </div>
    </div>

    <!-- 시크릿 월 & 역할 선택 -->
    <div id="auth-wall">
        <div class="auth-box glass fade-up">
            <i class="fa-solid fa-heart" style="font-size:3.5rem; color:var(--primary); margin-bottom:20px; animation: pulseAlert 2s infinite;"></i>
            <h1 style="font-size:1.6rem; font-weight:800; margin-bottom:25px;">Secret Place</h1>
            <div class="input-wrap"><i class="fa-solid fa-lock"></i><input type="password" class="form-input center" id="l_pw" placeholder="암호 입력 (1004)" onkeydown="if(event.key==='Enter') submitLogin()" style="border:none; margin:0; padding:15px 0;"></div>
            <button class="btn-primary" style="margin-top:20px;" onclick="submitLogin()">입장하기</button>
        </div>
    </div>

    <div class="modal-overlay" id="roleModal" style="z-index:5000;">
        <div class="modal-content glass" style="max-width: 380px; padding: 40px 25px; text-align: center;">
            <h3 style="font-size:1.6rem; font-weight:800; margin-bottom:10px;">누가 접속했나요?</h3>
            <p style="color:var(--text-muted); font-size:0.95rem;">작성할 역할을 선택해주세요.</p>
            <div class="role-btn-grid">
                <button class="role-btn boy" onclick="setAuthorName('남자친구')">
                    <i class="fa-solid fa-mars"></i><span>남자친구</span>
                </button>
                <button class="role-btn girl" onclick="setAuthorName('여자친구')">
                    <i class="fa-solid fa-venus"></i><span>여자친구</span>
                </button>
            </div>
        </div>
    </div>

    <div id="app-wrapper">
        <div id="app-container" style="display:none;">
            
            <header class="app-header glass">
                <div class="header-title"><i class="fa-solid fa-heart"></i> Our Story</div>
                <div class="header-actions">
                    <span id="top-clock" class="header-clock">00:00:00</span>
                    <button class="icon-btn" onclick="showModal('settingsModal')"><i class="fa-solid fa-gear"></i></button>
                </div>

    <script>
        let user = null;
        let authorName = localStorage.getItem('app_author') || '';
        let postsData = []; let commentsData = []; let timelineData = []; 
        let siteSettings = {}; let customHolidaysMap = {};
        
        const koreanHolidays2026 = {"01-01":"신정","02-16":"설연휴","02-17":"설날","02-18":"설연휴","03-01":"삼일절","03-02":"대체공휴일","05-05":"어린이날","05-24":"부처님오신날","06-06":"현충일","08-15":"광복절","08-17":"대체공휴일","09-24":"추석연휴","09-25":"추석","09-26":"추석연휴","10-03":"개천절","10-09":"한글날","12-25":"성탄절"};
        
        let currentBoardTab = '전체'; 
        let currentFilteredPosts = []; let currentPage = 1; const postsPerPage = 5; let activePostIndex = -1;
        let activePost = null; let pendingConfirmAction = null;
        
        let isHybridMode = localStorage.getItem('hybrid_mode') === 'true';
        if(isHybridMode) document.body.classList.add('mobile-frame-mode');

        function toggleHybridMode() {
            isHybridMode = !isHybridMode; localStorage.setItem('hybrid_mode', isHybridMode);
            if(isHybridMode) document.body.classList.add('mobile-frame-mode');
            else document.body.classList.remove('mobile-frame-mode');
            document.getElementById('hybridToggleBtn').innerText = `현재: ${isHybridMode ? 'ON' : 'OFF'}`;
            showToast("화면 모드가 변경되었습니다.");
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function customConfirm(msg, action) {
            document.getElementById('confirmMsg').innerText = msg;
            pendingConfirmAction = action;
            showModal('confirmModal');
        }

        document.getElementById('confirmBtnYes').addEventListener('click', () => {
            if(pendingConfirmAction) pendingConfirmAction();
            hideModal('confirmModal');
        });
        document.getElementById('confirmBtnNo').addEventListener('click', () => hideModal('confirmModal'));

        function showModal(id) { 
            const el = document.getElementById(id); el.style.display = 'flex'; void el.offsetWidth; el.classList.add('active');
        }
        function hideModal(id) { 
            const el = document.getElementById(id); el.classList.remove('active');
            setTimeout(() => { if(!el.classList.contains('active')) el.style.display = 'none'; }, 300);
        }
        
        function openLightbox(url) {
            const ext = url.split('.').pop().toLowerCase();
            let html = '';
            if(['mp4','webm','ogg'].includes(ext)) { html = `<video src="${url}" controls autoplay style="max-width:95vw; max-height:95vh; border-radius:16px;"></video>`; } 
            else { html = `<img src="${url}" style="max-width:95vw; max-height:95vh; border-radius:16px; object-fit:contain;">`; }
            document.getElementById('lightboxContent').innerHTML = html;
            const lb = document.getElementById('lightbox'); lb.style.display = 'flex'; void lb.offsetWidth; lb.style.opacity = '1';
        }
        function closeLightbox() {
            const lb = document.getElementById('lightbox'); lb.style.opacity = '0';
            setTimeout(() => { lb.style.display = 'none'; document.getElementById('lightboxContent').innerHTML = ''; }, 300);
        }

        function formatDate(date) {
            const d = new Date(date);
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
        }

        function getMediaHTML(url) {
            if(!url) return '';
            const ext = url.split('.').pop().toLowerCase();
            if(['mp4', 'webm', 'ogg'].includes(ext)) return `<video controls src="${url}" style="width:100%; border-radius:16px; margin-bottom:20px;"></video>`;
            else if(['mp3', 'wav', 'm4a'].includes(ext)) return `<audio controls src="${url}" style="width:100%; margin-bottom:20px; outline:none;"></audio>`;
            else return `<img src="${url}" style="width:100%; border-radius:16px; margin-bottom:20px; cursor:zoom-in;" onclick="openLightbox('${url}')">`;
        }

        let currentSlide = 0; const banners = document.querySelectorAll('.banner-img');
        function nextSlide() { currentSlide = (currentSlide + 1) % banners.length; updateSlide(); }

        function checkUpcomingEvents() {
            const today = new Date(); today.setHours(0,0,0,0);
            const nextWeek = new Date(today); nextWeek.setDate(today.getDate() + 7);
            
            let upcoming = null; let minDiff = 999;
            postsData.forEach(p => {
                const prt = (p.author||'').split('|');
                if (prt[3] === '일정' && prt[4]) {
                    const d = new Date(prt[4]);
                    if (d >= today && d <= nextWeek) {
                        const diff = Math.ceil((d - today) / (1000 * 60 * 60 * 24));
                        if (diff < minDiff) { minDiff = diff; upcoming = { title: prt[2], diff }; }
                    }
                }
            });
            if (upcoming) {
                const dText = upcoming.diff === 0 ? '오늘' : upcoming.diff === 1 ? '내일' : `D-${upcoming.diff}`;
                document.getElementById('upcomingText').innerText = `${dText} : ${upcoming.title}`;
                document.getElementById('upcomingToast').classList.add('show');
            }
        }
        function closeUpcomingToast() { document.getElementById('upcomingToast').classList.remove('show'); }

        function applySettings() {
            const names = siteSettings.couple_names || "Boy & Girl";
            document.getElementById('coupleNamesText').innerText = names; document.getElementById('settingNames').value = names;

            if(siteSettings.banner_1) document.getElementById('bgImg1').src = siteSettings.banner_1;
            if(siteSettings.banner_2) document.getElementById('bgImg2').src = siteSettings.banner_2;
            if(siteSettings.profile_1) document.getElementById('profile1').src = siteSettings.profile_1;
            if(siteSettings.profile_2) document.getElementById('profile2').src = siteSettings.profile_2;

            if(siteSettings.dday_date) {
                document.getElementById('settingDday').value = siteSettings.dday_date;
                const start = new Date(siteSettings.dday_date); const now = new Date();
                const diffDays = Math.ceil(Math.abs(now - start) / (1000 * 60 * 60 * 24)); 
                document.getElementById('ddayText').innerText = `D+${diffDays}`;
            }

            customHolidaysMap = {};
            if(siteSettings.holidays) {
                document.getElementById('settingHolidays').value = siteSettings.holidays;
                siteSettings.holidays.split(',').forEach(item => {
                    const parts = item.trim().split(':');

        function saveSettings() {

        function renderTimeline() {

                <div class="tl-item">

        function addTimelineItem() {

        let currentImgKey = '';
        function triggerSiteImgUpload(key) { currentImgKey = key; document.getElementById('siteImgFileInput').click(); }
        function handleSiteImgSelected(e) {
            const file = e.target.files[0]; if(!file || !currentImgKey) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                siteSettings[currentImgKey] = event.target.result;
                saveData(); applySettings(); showToast("사진이 변경되었습니다.");
            };

        let currentCalDate = new Date();
        
        function renderCalendar() {
            const year = currentCalDate.getFullYear(); const month = currentCalDate.getMonth();
            document.getElementById('cal-month-year').innerText = `${year}. ${String(month+1).padStart(2,'0')}`;
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const grid = document.getElementById('calendar-days');
            
            const daysArr = ['일','월','화','수','목','금','토'];
            let html = daysArr.map((d,i) => `<div class="cal-day-name" style="${i===0?'color:var(--holiday)':(i===6?'color:var(--saturday)':'')}">${d}</div>`).join('');
            const todayStr = new Date().toLocaleDateString('en-CA');

            for(let i=0; i<firstDay; i++) html += `<div class="cal-cell empty"></div>`;
            
            for(let d=1; d<=daysInMonth; d++) {
                const mmdd = `${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const dateStr = `${year}-${mmdd}`;
                
                const dayPosts = postsData.filter(p => {
                    const prt = (p.author||'').split('|');
                    return (prt[3] === '다이어리' || prt[3] === '일정') && prt[4] === dateStr;
                });
                
                let classes = ['cal-cell'];
                if(dateStr === todayStr) classes.push('today');
                
                const dayOfWeek = new Date(year, month, d).getDay();
                let holName = koreanHolidays2026[mmdd] || customHolidaysMap[mmdd] || '';
                
                if(dayOfWeek === 0 || holName !== '') classes.push('holiday');
                else if(dayOfWeek === 6) classes.push('saturday');

                let indicators = '';
                dayPosts.forEach(p => {
                    const prt = (p.author||'').split('|');
                    const color = prt[5] || (prt[3]==='일정' ? 'var(--secondary)' : 'var(--primary)');
                    indicators += `<div class="dot-marker" style="background:${color};"></div>`;
                });
                
                html += `<div class="${classes.join(' ')}" onclick="openDayView(this, '${dateStr}', '${holName}')">
                    ${d}
                    <div class="cal-holiday-name">${holName}</div>
                    <div class="cal-indicators">${indicators}</div>
                </div>`;
            }
            grid.innerHTML = html;
        }

        function changeMonth(offset) { currentCalDate.setMonth(currentCalDate.getMonth() + offset); renderCalendar(); closeDayView(); }

        function openDayView(cellEl, dateStr, currentHolName) {
            document.querySelectorAll('.cal-cell').forEach(c => c.classList.remove('selected'));
            cellEl.classList.add('selected');

            const view = document.getElementById('calDayView');
            document.getElementById('dayViewDateHdn').value = dateStr;
            const parts = dateStr.split('-');
            document.getElementById('dayViewTitle').innerText = `${parts[0]}년 ${parts[1]}월 ${parts[2]}일`;
            
            const dayPosts = postsData.filter(p => {
                const prt = (p.author||'').split('|');
                return (prt[3] === '다이어리' || prt[3] === '일정') && prt[4] === dateStr;
            });
            const listEl = document.getElementById('dayEntryList');
            
            if(dayPosts.length === 0) {
                listEl.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:20px 0;">등록된 기록이 없습니다.</p>`;
            } else {
                listEl.innerHTML = dayPosts.map(p => {
                    const prt = (p.author||'').split('|');
                    const color = prt[5] || (prt[3]==='일정' ? 'var(--secondary)' : 'var(--primary)');
                    return `<div class="day-entry-item" style="border-left-color:${color};" onclick="openDetailById('${p.id}')">
                        <span class="entry-cat" style="color:${color};">${prt[3]}</span>
                        <div class="entry-title">${prt[2]}</div>
                    </div>`;
                }).join('');
            }
            view.classList.add('active');
            
            setTimeout(() => {
                const calSec = document.getElementById('view-calendar');
                calSec.scrollTo({ top: calSec.scrollHeight, behavior: 'smooth' });
            }, 50);
        }

        function closeDayView() {
            document.getElementById('calDayView').classList.remove('active');
            document.querySelectorAll('.cal-cell').forEach(c => c.classList.remove('selected'));
        }

        function bindEvents() {
            // 외부 클릭 방지
            document.addEventListener('click', (e) => {
                const viewCal = document.getElementById('view-calendar');
                if(!viewCal.classList.contains('active')) return;
                const isGrid = document.getElementById('calendar-days').contains(e.target);
                const isView = document.getElementById('calDayView').contains(e.target);
                const isBtn = e.target.closest('.cal-nav-btn') || e.target.closest('.modal-overlay');
                if(!isGrid && !isView && !isBtn) { closeDayView(); }
            });

            // 스와이프
            let touchStartX = 0;
            const calArea = document.getElementById('calendar-area');
            calArea.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX, {passive: true});
            calArea.addEventListener('touchend', e => {
                let touchEndX = e.changedTouches[0].screenX;
                if(touchEndX < touchStartX - 50) changeMonth(1); 
                if(touchEndX > touchStartX + 50) changeMonth(-1); 
            }, {passive: true});

            // 키보드 화살표
            document.addEventListener('keydown', (e) => {
                if(document.getElementById('view-calendar').classList.contains('active')) {
                    if(e.key === 'ArrowLeft') changeMonth(-1);
                    if(e.key === 'ArrowRight') changeMonth(1);
                }
            });
        }

            const dateWrap = document.getElementById('dateInputWrap');
            if(cat === '다이어리' || cat === '일정') dateWrap.style.display = 'block';
            else dateWrap.style.display = 'none';

        function setBoardCategory(cat, btnEl) { 
            currentBoardTab = cat; currentPage = 1;
            document.querySelectorAll('.board-tab').forEach(b => b.classList.remove('active')); btnEl.classList.add('active'); 
            processFilteredPosts(); 
        }

        function submitPost() {
            const cat = document.getElementById('postCategory').value; 
            const title = document.getElementById('postTitle').value.trim(); 
            const content = document.getElementById('postContent').value.trim(); 
            const dateStr = document.getElementById('postDate').value || new Date().toLocaleDateString('en-CA');
            const color = document.getElementById('postColor').value;
            const file = document.getElementById('postImage').files[0];

            if(!title) return showToast('제목을 입력하세요.');
            if(cat === '갤러리' && !file) return showToast('갤러리는 사진 첨부가 필수입니다!');

            const authorMeta = `${authorName}||${title}|${cat}|${dateStr}|${color}`;
            
            const saveLocalPost = (imageUrl) => {
                postsData.unshift({id: Date.now().toString(), author: authorMeta, content: content, image_url: imageUrl, created_at: formatDate(new Date())});
                saveData(); hideModal('writeModal'); showToast("기록되었습니다! 💖");
                if(document.getElementById('view-calendar').classList.contains('active')) { renderCalendar(); checkUpcomingEvents(); }
                if(document.getElementById('view-board').classList.contains('active')) processFilteredPosts();
            };

            if(file) {
                const reader = new FileReader();
                reader.onload = (e) => saveLocalPost(e.target.result);
                reader.readAsDataURL(file);
            } else {
                saveLocalPost('');
            }
        }

        function processFilteredPosts() {
            const list = document.getElementById('boardList'); const pageArea = document.getElementById('paginationArea');
            list.innerHTML = ''; pageArea.innerHTML = '';
            
            currentFilteredPosts = postsData.filter(p => {
                const cat = (p.author||'').split('|')[3]||'일상';
                if(currentBoardTab === '전체') return cat !== '다이어리' && cat !== '일정';
                return cat === currentBoardTab;
            });
            
            if(currentFilteredPosts.length === 0) { list.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:50px 0;">작성된 기록이 없습니다.</p>`; list.className=''; return; }

            const totalPages = Math.ceil(currentFilteredPosts.length / postsPerPage);
            const startIndex = (currentPage - 1) * postsPerPage;
            const paginatedPosts = currentFilteredPosts.slice(startIndex, startIndex + postsPerPage);

            if(currentBoardTab === '갤러리') {
                list.className = 'gallery-grid';
                paginatedPosts.forEach((p, index) => {
                    const actualIdx = startIndex + index;
                    const prt = (p.author||'').split('|');
                    if(!p.image_url) return;
                    list.innerHTML += `<div class="gallery-item" onclick="openDetailByIndex(${actualIdx})">${getMediaHTML(p.image_url)}</div>`;
                });
            } else {
                list.className = '';
                paginatedPosts.forEach((p, index) => {
                    const actualIdx = startIndex + index;
                    const prt = (p.author||'').split('|');
                    const postComments = commentsData.filter(c => c.post_id === p.id);
                    const previewComments = postComments.slice(-3);
                    let inlineHtml = previewComments.map(c => `
                        <div class="inline-comment-item">
                            <div><b style="color:var(--text-main); margin-right:8px;">${c.author}</b><span style="color:#666;">${c.content}</span></div>
                            <span style="font-size:0.75rem; color:#999;">${(c.created_at||'').slice(5,16)}</span>
                        </div>
                    `).join('');
                    if(!inlineHtml) inlineHtml = `<div style="font-size:0.85rem; color:#999;">첫 댓글을 남겨보세요.</div>`;

                    list.innerHTML += `
                        <div class="post-card">
                            <div class="post-text-wrap">
                                <div onclick="openDetailByIndex(${actualIdx})">
                                    <div><span class="post-cat-badge">${prt[3]||''}</span></div>
                                    <div class="post-title">${prt[2]||''}</div>
                                    <div class="post-preview">${p.content}</div>
                                    <div class="post-timestamp">${p.created_at || ''} · ${prt[0]||''}</div>
                                </div>
                                <div class="inline-comments">
                                    <div style="font-size:0.85rem; font-weight:800; color:var(--primary); margin-bottom:10px;"><i class="fa-regular fa-comment-dots"></i> 댓글 (${postComments.length})</div>
                                    ${inlineHtml}
                                    <div class="inline-comment-input-wrap">
                                        <input type="text" id="inline-comment-${p.id}" placeholder="따뜻한 한마디..." onkeydown="if(event.key==='Enter') submitInlineComment('${p.id}')">
                                        <button onclick="submitInlineComment('${p.id}')">등록</button>
                                    </div>
                                </div>
                            </div>
                            ${p.image_url ? `<div style="width:110px; height:110px; flex-shrink:0;">${getMediaHTML(p.image_url)}</div>` : ''}
                        </div>`;
                });
            }

            if (totalPages > 1) {
                let pageHtml = '';
                for(let i=1; i<=totalPages; i++) pageHtml += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
                pageArea.innerHTML = pageHtml;
            }
        }

        function goToPage(num) {
            currentPage = num; processFilteredPosts();
            const container = document.body.classList.contains('mobile-frame-mode') ? document.getElementById('app-container') : window;
            container.scrollTo({top:0, behavior:'smooth'});
        }

        function submitInlineComment(postId) {
            const input = document.getElementById(`inline-comment-${postId}`); const content = input.value.trim();
            if (!content) return;
            commentsData.push({ id: Date.now().toString(), post_id: postId, author: authorName || '우리', content: content, created_at: formatDate(new Date()) });
            saveData(); processFilteredPosts(); showToast('댓글이 등록되었습니다.');
        }

        function openDetailByIndex(index) {
            if(index < 0 || index >= currentFilteredPosts.length) return;
            activePostIndex = index; const p = currentFilteredPosts[index];
            renderDetailModal(p);
            
            const navArea = document.getElementById('modalNavArea'); navArea.style.display = 'flex';
            navArea.querySelector('button:first-child').disabled = (index === 0); 
            navArea.querySelector('button:last-child').disabled = (index === currentFilteredPosts.length - 1);
        }

        function openDetailById(id) {
            const p = postsData.find(item => item.id === id); if(!p) return;
            activePostIndex = -1; renderDetailModal(p);
            document.getElementById('modalNavArea').style.display = 'none';
        }

        function goPrevPost() { if (activePostIndex > 0) openDetailByIndex(activePostIndex - 1); }
        function goNextPost() { if (activePostIndex < currentFilteredPosts.length - 1) openDetailByIndex(activePostIndex + 1); }

        function renderDetailModal(p) {
            activePost = p;
            const prt = (p.author||'').split('|');
            document.getElementById('modalCategory').innerText = prt[3]||'기록';
            document.getElementById('modalDateMeta').innerText = prt[4] ? `${prt[4]} / ${p.created_at||''}` : (p.created_at||'');
            document.getElementById('modalAuthor').innerText = prt[0]||'';
            document.getElementById('modalTitle').innerText = prt[2]||'무제';
            document.getElementById('modalContent').innerText = p.content;
            document.getElementById('modalImageWrap').innerHTML = getMediaHTML(p.image_url);
            
            renderComments(); showModal('detailModal');
        }

        function renderComments() {
            if(!activePost) return;
            const postComments = commentsData.filter(c => c.post_id === activePost.id);
            document.getElementById('modalCommentsHeader').innerHTML = `댓글 <span style="color:var(--primary);">${postComments.length}</span>`;
            document.getElementById('modalCommentsList').innerHTML = postComments.map(c => `
                <div style="display:flex; justify-content:space-between; font-size:0.95rem; border-bottom:1px solid #eee; padding-bottom:10px;">
                    <div><b style="color:var(--text-main); margin-right:8px;">${c.author}</b> <span style="color:#666;">${c.content}</span><br><span style="font-size:0.75rem; color:#999;">${c.created_at||''}</span></div>
                    ${(isEditMode || c.author === authorName) ? `<button style="background:none; border:none; color:#FC8181; cursor:pointer; padding:5px;" onclick="customConfirm('댓글을 지울까요?', () => deleteComment('${c.id}'))"><i class="fa-solid fa-xmark"></i></button>` : ''}
                </div>
            `).join('');
            document.getElementById('modal-comment-input').value = '';
        }

        function submitComment() {
            if(!activePost) return;
            const content = document.getElementById('modal-comment-input').value.trim(); if (!content) return;
            commentsData.push({ id: Date.now().toString(), post_id: activePost.id, author: authorName || '우리', content: content, created_at: formatDate(new Date()) });
            saveData(); renderComments();
            if(document.getElementById('view-board').classList.contains('active')) processFilteredPosts();
        }
        
        function deleteComment(id) {
            commentsData = commentsData.filter(c => c.id !== id); saveData(); renderComments();
            if(document.getElementById('view-board').classList.contains('active')) processFilteredPosts(); showToast('삭제되었습니다.');
        }

        function openEditFromDetail() {
            hideModal('detailModal'); if(!activePost) return;
            const prt = (activePost.author||'').split('|');
            document.getElementById('editPostId').value = activePost.id; 
            document.getElementById('editAuthorMeta').value = `${prt[0]}|${prt[1]}`;
            document.getElementById('editCategory').value = prt[3]||'일상';
            document.getElementById('editDateStr').value = prt[4]||'';
            document.getElementById('editColor').value = prt[5]||'#FF8282';
            document.getElementById('editKeepImage').value = activePost.image_url||'';
            document.getElementById('editTitle').value = prt[2]||''; 
            document.getElementById('editContent').value = activePost.content; 
            showModal('editModal');
        }

        function submitEdit() {
            const id = document.getElementById('editPostId').value; const p = postsData.find(x => x.id === id);
            if(p) {
                const title = document.getElementById('editTitle').value.trim();
                const content = document.getElementById('editContent').value.trim();
                const authorMeta = document.getElementById('editAuthorMeta').value;
                const cat = document.getElementById('editCategory').value;
                const dateStr = document.getElementById('editDateStr').value;
                const color = document.getElementById('editColor').value;
                
                p.author = `${authorMeta}|${title}|${cat}|${dateStr}|${color}`;
                p.content = content;
                
                const file = document.getElementById('editImage').files[0];
                if(file) {
                    const reader = new FileReader();
                    reader.onload = (e) => { p.image_url = e.target.result; finishEdit(); };
                    reader.readAsDataURL(file);
                } else { finishEdit(); }
                
                function finishEdit() { saveData(); hideModal('editModal'); loadLocalData(); showToast("수정 완료!"); }
            }
        }

        function deleteFromDetail() {
            customConfirm("추억을 완전히 삭제하시겠습니까?", () => {
                postsData = postsData.filter(p => p.id !== activePost.id);
                commentsData = commentsData.filter(c => c.post_id !== activePost.id);
                saveData(); hideModal('detailModal'); loadLocalData(); showToast("삭제되었습니다.");
            });
        }
    </script>
</body>
</html>
