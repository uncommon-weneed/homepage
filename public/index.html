<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Our Secret Space 💖</title>
    <!-- 폰트 및 아이콘 -->
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* 2026 Soft Romantic Palette */
            --primary: #FF8E8B;       /* 메인 코랄 핑크 */
            --primary-light: #FFF0F0; /* 연한 핑크 배경 */
            --primary-dark: #E57A77;
            --secondary: #8DA9C4;     /* 뮤트 블루 (일정 등에 사용) */
            --bg-base: #F8F9FA;       /* 앱 전체 배경 */
            --surface: #FFFFFF;       /* 카드/모달 배경 */
            --text-main: #2D3748;     /* 기본 텍스트 */
            --text-muted: #A0AEC0;    /* 서브 텍스트 */
            --border-light: #EDF2F7;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.03);
            --shadow-md: 0 10px 30px rgba(255, 142, 139, 0.08);
            --shadow-lg: 0 20px 40px rgba(0,0,0,0.1);
            --radius-sm: 12px;
            --radius-md: 20px;
            --radius-lg: 32px;
            --nav-height: 65px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; background: var(--bg-base); color: var(--text-main); overflow-x: hidden; scroll-behavior: smooth; }
        
        #app-container { display: none; width: 100%; height: 100vh; flex-direction: column; }
        .view-section { display: none; flex-grow: 1; overflow-y: auto; padding-bottom: calc(var(--nav-height) + 20px); animation: fadeIn 0.4s ease; }
        .view-section.active { display: block; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.9) translateY(20px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes pulseAlert { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 142, 139, 0.3); border-radius: 10px; }

        #auth-wall { position: fixed; inset: 0; background: url('https://images.unsplash.com/photo-1518621736915-f3b1c41bfd00?q=80&w=1920&auto=format&fit=crop') center/cover; z-index: 9999; display: flex; align-items: center; justify-content: center; transition: opacity 0.5s ease; }
        #auth-wall::before { content: ''; position: absolute; inset: 0; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px); }
        .auth-box { position: relative; z-index: 1; background: rgba(255,255,255,0.7); backdrop-filter: blur(20px); padding: 50px 40px; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); width: 90%; max-width: 380px; text-align: center; border: 1px solid rgba(255,255,255,0.5); }
        .auth-box i.fa-heart { font-size: 3rem; color: var(--primary); margin-bottom: 20px; filter: drop-shadow(0 4px 10px rgba(255,142,139,0.4)); animation: pulseAlert 2s infinite; }
        .auth-box h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 25px; letter-spacing: 1px; color: var(--text-main); }
        .auth-input { width: 100%; padding: 16px; background: rgba(255,255,255,0.9); border: 1px solid var(--border-light); border-radius: var(--radius-sm); margin-bottom: 15px; font-size: 1.05rem; text-align: center; letter-spacing: 2px; transition: 0.3s; }
        .auth-input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px var(--primary-light); background: white; }
        .btn-auth { width: 100%; background: var(--primary); color: white; border: none; padding: 16px; border-radius: var(--radius-sm); font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(255,142,139,0.3); }
        .btn-auth:hover { background: var(--primary-dark); transform: translateY(-2px); }

        .app-header { position: sticky; top: 0; width: 100%; height: 60px; background: rgba(248, 249, 250, 0.85); backdrop-filter: blur(12px); z-index: 50; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; border-bottom: 1px solid rgba(0,0,0,0.02); }
        .header-title { font-size: 1.2rem; font-weight: 800; color: var(--primary); font-family: 'Georgia', serif; font-style: italic; display: flex; align-items: center; gap: 8px; }
        .header-actions { display: flex; gap: 15px; align-items: center; }
        .icon-btn { background: none; border: none; font-size: 1.2rem; color: var(--text-muted); cursor: pointer; transition: 0.2s; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .icon-btn:hover { background: var(--primary-light); color: var(--primary); }
        .icon-btn.active { color: var(--primary); background: var(--primary-light); transform: rotate(90deg); }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: var(--nav-height); background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--border-light); z-index: 100; display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -4px 20px rgba(0,0,0,0.02); }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 25%; height: 100%; color: var(--text-muted); text-decoration: none; transition: 0.3s; cursor: pointer; }
        .nav-item i { font-size: 1.3rem; margin-bottom: 4px; transition: 0.3s; }
        .nav-item span { font-size: 0.75rem; font-weight: 600; transition: 0.3s; }
        .nav-item.active { color: var(--primary); }
        .nav-item.active i { transform: translateY(-3px); filter: drop-shadow(0 2px 4px rgba(255,142,139,0.3)); }
        
        @media (min-width: 768px) {
            .bottom-nav { top: 0; width: 250px; height: 100vh; flex-direction: column; justify-content: flex-start; padding-top: 80px; border-top: none; border-right: 1px solid var(--border-light); align-items: flex-start; }
            .nav-item { width: 100%; height: 60px; flex-direction: row; justify-content: flex-start; padding-left: 40px; gap: 15px; }
            .nav-item i { font-size: 1.2rem; margin-bottom: 0; }
            .nav-item span { font-size: 1.05rem; }
            .nav-item.active i { transform: none; }
            .nav-item.active { background: var(--primary-light); border-right: 4px solid var(--primary); }
            #app-container { flex-direction: row; }
            .view-section { padding-left: 250px; padding-bottom: 40px; }
            .app-header { left: 250px; width: calc(100% - 250px); }
        }

        .home-container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .banner-wrap { position: relative; width: 100%; height: 350px; border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-md); margin-bottom: 30px; }
        .banner-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.5s ease; z-index: 1; }
        .banner-img.active { opacity: 1; z-index: 2; }
        .banner-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.6), transparent); z-index: 3; }
        .banner-content { position: absolute; bottom: 30px; left: 0; width: 100%; text-align: center; z-index: 4; color: white; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        .dday-badge { display: inline-block; background: rgba(255,255,255,0.25); backdrop-filter: blur(10px); padding: 6px 16px; border-radius: 20px; font-size: 0.9rem; font-weight: 700; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.3); }
        .dday-num { font-size: 4rem; font-weight: 800; font-family: 'Georgia', serif; line-height: 1; margin-bottom: 5px; }
        .couple-name { font-size: 1.2rem; font-weight: 500; letter-spacing: 2px; }

        .widget-card { background: var(--surface); border-radius: var(--radius-md); padding: 25px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-light); margin-bottom: 25px; position: relative; }
        .widget-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 20px; color: var(--text-main); display: flex; align-items: center; justify-content: space-between; }
        
        .profile-flex { display: flex; justify-content: space-around; align-items: center; }
        .profile-item { text-align: center; }
        .profile-pic { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary-light); box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 10px; }
        .profile-item span { font-weight: 800; font-size: 1.1rem; }

        .timeline-box { max-height: 300px; overflow-y: auto; padding-right: 10px; }
        .tl-item { display: flex; gap: 15px; margin-bottom: 20px; position: relative; }
        .tl-line { position: absolute; left: 5px; top: 25px; bottom: -20px; width: 2px; background: var(--border-light); }
        .tl-item:last-child .tl-line { display: none; }
        .tl-dot { width: 12px; height: 12px; background: var(--primary); border-radius: 50%; box-shadow: 0 0 0 4px var(--primary-light); z-index: 2; margin-top: 5px; }
        .tl-content { flex-grow: 1; background: #F9FAFB; padding: 15px; border-radius: 12px; }
        .tl-date { font-size: 0.85rem; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
        .tl-desc { font-size: 1rem; color: var(--text-main); }

        .calendar-container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .cal-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .cal-month-title { font-size: 1.8rem; font-weight: 800; font-family: 'Georgia', serif; }
        .cal-nav-btn { background: white; border: 1px solid var(--border-light); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm); }
        .cal-nav-btn:hover { color: var(--primary); border-color: var(--primary); }

        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; background: white; padding: 20px; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); border: 1px solid var(--border-light); }
        .cal-day-name { text-align: center; font-weight: 700; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--border-light); }
        .cal-cell { aspect-ratio: 1/1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 8px; border-radius: 14px; cursor: pointer; transition: 0.2s; font-weight: 600; position: relative; border: 2px solid transparent; }
        .cal-cell:hover { background: #F8F9FA; border-color: var(--primary-light); transform: translateY(-2px); }
        .cal-cell.today { color: var(--primary); background: var(--primary-light); }
        .cal-cell.empty { pointer-events: none; }
        .cal-indicators { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; justify-content: center; }
        .dot-diary { width: 6px; height: 6px; background: var(--primary); border-radius: 50%; }
        .dot-schedule { width: 6px; height: 6px; background: var(--secondary); border-radius: 50%; }

        .board-container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .board-tabs { display: flex; gap: 15px; margin-bottom: 25px; overflow-x: auto; padding-bottom: 5px; -webkit-overflow-scrolling: touch; }
        .board-tab { background: none; border: none; font-size: 1.1rem; font-weight: 700; color: var(--text-muted); cursor: pointer; padding: 8px 4px; position: relative; transition: 0.3s; white-space: nowrap; }
        .board-tab.active { color: var(--primary); }
        .board-tab.active::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: var(--primary); border-radius: 3px 3px 0 0; }

        .post-card { background: white; border-radius: var(--radius-md); padding: 25px; margin-bottom: 20px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-light); transition: 0.3s; cursor: pointer; display: flex; gap: 20px; }
        .post-card:hover { box-shadow: var(--shadow-md); transform: translateY(-3px); }
        .post-content-flex { flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
        .post-top-meta { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.85rem; align-items: center; }
        .post-cat-badge { background: var(--primary-light); color: var(--primary-dark); padding: 4px 10px; border-radius: 12px; font-weight: 700; }
        .post-date { color: var(--text-muted); }
        .post-title { font-size: 1.3rem; font-weight: 800; color: var(--text-main); margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .post-preview { font-size: 1rem; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .post-thumb { width: 120px; height: 120px; border-radius: 12px; object-fit: cover; flex-shrink: 0; }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        @media(min-width: 768px) { .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; } }
        .gallery-item { background: white; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); cursor: pointer; transition: 0.3s; border: 1px solid var(--border-light); display: flex; flex-direction: column; }
        .gallery-item:hover { transform: translateY(-5px); box-shadow: var(--shadow-md); }
        .gallery-item img { width: 100%; aspect-ratio: 1/1; object-fit: cover; }
        .gallery-item-info { padding: 15px; }
        .gallery-item-title { font-weight: 800; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .fab { position: fixed; bottom: calc(var(--nav-height) + 20px); right: 20px; width: 60px; height: 60px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; box-shadow: 0 10px 25px rgba(255, 142, 139, 0.4); cursor: pointer; transition: 0.3s; border: none; z-index: 90; }
        .fab:hover { transform: scale(1.1) rotate(90deg); background: var(--primary-dark); }
        @media(min-width: 768px) { .fab { bottom: 40px; right: 40px; } }

        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 0.9rem; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; }
        .form-input, .form-textarea, .form-select { width: 100%; padding: 16px; background: #F8F9FA; border: 1px solid var(--border-light); border-radius: 14px; font-size: 1.05rem; transition: 0.3s; color: var(--text-main); }
        .form-input:focus, .form-textarea:focus, .form-select:focus { background: white; border-color: var(--primary); outline: none; box-shadow: 0 0 0 4px var(--primary-light); }
        .btn-submit { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 14px; font-size: 1.1rem; font-weight: 800; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-submit:hover { background: var(--primary-dark); box-shadow: 0 5px 15px rgba(255, 142, 139, 0.3); }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; opacity: 0; transition: opacity 0.3s ease; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content { background: white; width: 100%; max-width: 500px; max-height: 90vh; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; overflow: hidden; transform: scale(0.95) translateY(20px); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); }
        
        .modal-header { padding: 25px 30px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-light); }
        .modal-title { font-size: 1.4rem; font-weight: 800; color: var(--text-main); }
        .btn-close { background: none; border: none; font-size: 1.5rem; color: var(--text-muted); cursor: pointer; transition: 0.2s; }
        .btn-close:hover { color: var(--primary); }
        .modal-body { padding: 30px; overflow-y: auto; flex-grow: 1; }

        .day-entry-item { background: #F8F9FA; padding: 20px; border-radius: 16px; margin-bottom: 15px; border-left: 4px solid var(--primary); cursor: pointer; transition: 0.2s; box-shadow: var(--shadow-sm); }
        .day-entry-item:hover { background: var(--primary-light); transform: translateX(5px); }
        .day-entry-item.schedule { border-left-color: var(--secondary); }
        .entry-cat { font-size: 0.85rem; font-weight: 800; color: var(--text-muted); margin-bottom: 5px; display: inline-block; }
        .entry-title { font-size: 1.15rem; font-weight: 800; color: var(--text-main); }

        .detail-meta-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-light); padding-bottom: 15px; }
        .detail-author { font-weight: 700; color: var(--primary); font-size: 1.1rem; }
        .detail-date { font-size: 0.9rem; color: var(--text-muted); }
        .detail-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 20px; line-height: 1.4; }
        .detail-content { font-size: 1.1rem; line-height: 1.8; color: #4A5568; white-space: pre-wrap; margin-bottom: 30px; }
        .detail-image { width: 100%; border-radius: 16px; margin-bottom: 20px; cursor: zoom-in; }
        
        .comment-section { background: #F8F9FA; border-radius: 16px; padding: 20px; margin-top: 30px; }
        .comment-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .comment-list { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        .comment-box { display: flex; justify-content: space-between; font-size: 0.95rem; align-items: flex-start; }
        .comment-box b { color: var(--text-main); margin-right: 8px; }
        .comment-box span { color: #4A5568; word-break: break-all; line-height: 1.4; }
        .comment-del-btn { background: none; border: none; color: #FC8181; cursor: pointer; padding-left: 10px; font-size: 1.1rem; }
        
        .comment-input-row { display: flex; gap: 10px; }
        .comment-input-row input { flex-grow: 1; padding: 12px 15px; border: 1px solid var(--border-light); border-radius: 10px; outline: none; }
        .comment-input-row button { padding: 12px 20px; background: var(--text-main); color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; }

        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: rgba(45, 55, 72, 0.95); backdrop-filter: blur(10px); color: white; padding: 15px 25px; border-radius: 30px; font-size: 1rem; font-weight: 600; opacity: 0; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 9999; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); pointer-events: none; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast i { color: var(--primary); font-size: 1.2rem; }

        .edit-badge { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.9); color: var(--text-main); padding: 8px 15px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; cursor: pointer; box-shadow: var(--shadow-sm); border: none; z-index: 10; display: none; align-items: center; gap: 5px; }
        .edit-badge:hover { background: var(--primary); color: white; }
        body.edit-mode .edit-badge { display: flex; }
        .edit-mode-only { display: none !important; }
        body.edit-mode .edit-mode-only { display: inline-block !important; }
        body.edit-mode .edit-mode-only-flex { display: flex !important; }
        
        #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 3000; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; }
        #lightbox img { max-width: 95vw; max-height: 95vh; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); object-fit: contain; }
    </style>
</head>
<body>

    <!-- 토스트 알림 컴포넌트 -->
    <div id="toast" class="toast"><i class="fa-solid fa-heart"></i> <span id="toastMsg">알림 메시지</span></div>

    <!-- 1. 시크릿 로그인 화면 -->
    <div id="auth-wall">
        <div class="auth-box">
            <i class="fa-solid fa-heart"></i>
            <h1>Secret Place</h1>
            <p style="color:var(--text-muted); font-size:0.95rem; margin-bottom:30px;">우리만의 암호를 입력해 주세요.</p>
            <input type="text" class="auth-input" id="l_id" placeholder="아이디">
            <input type="password" class="auth-input" id="l_pw" placeholder="비밀번호" onkeydown="if(event.key==='Enter') submitLogin()">
            <button class="btn-auth" onclick="submitLogin()">입장하기</button>
        </div>
    </div>

    <!-- 2. 로그인 후 작성자 선택 팝업 -->
    <div class="modal-overlay" id="authorSelectModal">
        <div class="modal-content" style="max-width: 400px; text-align: center; padding: 40px 30px;">
            <i class="fa-solid fa-face-smile-wink" style="font-size:3.5rem; color:var(--primary); margin-bottom:20px;"></i>
            <h3 style="margin-bottom:10px; font-size:1.6rem; color:var(--text-main);">누가 접속했나요?</h3>
            <p style="color:var(--text-muted); font-size:0.95rem; margin-bottom:25px;">앞으로 남길 추억에 기록될 이름을 적어주세요.</p>
            <input type="text" id="authorNameInput" class="form-input" placeholder="예: 영재, 수진" onkeydown="if(event.key==='Enter') setAuthorName()" style="text-align:center; font-weight:700;">
            <button class="btn-submit" onclick="setAuthorName()" style="margin-top:10px;"><i class="fa-solid fa-heart"></i> 시작하기</button>
        </div>
    </div>

    <!-- 자체 커스텀 Confirm 모달 (경고창 대체) -->
    <div class="modal-overlay" id="confirmModal">

        <span style="position:absolute; top:30px; right:30px; color:white; font-size:2.5rem; cursor:pointer;"><i class="fa-solid fa-xmark"></i></span>
        <img id="lightboxImg" src="" style="max-width:90%; max-height:90%; border-radius:12px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); object-fit:contain;">

    <script>
        let user = null;
        let postsData = []; let commentsData = []; 
        let siteSettings = {}; let timelineData = [];
        let currentBoardTab = '전체'; 
        let isEditMode = false;
        let activePost = null;

        // 자체 확인 창 (alert/confirm 대체)
        let confirmAction = null;
        function showConfirm(action) {
            confirmAction = action;
            showModal('confirmModal');
        }
        document.getElementById('confirmBtn').addEventListener('click', () => {
            if(confirmAction) confirmAction();
            hideModal('confirmModal');
        });

        document.addEventListener('DOMContentLoaded', () => {
            try { user = JSON.parse(localStorage.getItem('couple_user') || 'null'); } catch(e){}
            
            // 로그인 이력이 있고 이름이 설정된 경우
            if(user && user.fullName && user.fullName !== "우리") {
                document.getElementById('auth-wall').style.display = 'none';
                document.getElementById('app-container').style.display = 'flex';
                initApp();
            } 
            // 로그인은 했지만 이름이 "우리" (기본값) 인 경우
            else if (user) {
                document.getElementById('auth-wall').style.display = 'none';
                showModal('authorSelectModal');
            } 
            // 로그인 안된 경우
            else {
                document.getElementById('auth-wall').style.opacity = '1';
            }
        });

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        async function submitLogin() {
            const id = document.getElementById('l_id').value.trim(); const pw = document.getElementById('l_pw').value.trim();
            const res = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:id, password:pw}) });
            
            if(res.ok) {
                user = await res.json(); 
                document.getElementById('auth-wall').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('auth-wall').style.display = 'none';
                    // 로그인 직후 이름 입력 모달 표시
                    showModal('authorSelectModal');
                }, 500);
            } else { const d = await res.json(); showToast(d.error); }
        }

        function setAuthorName() {
            const name = document.getElementById('authorNameInput').value.trim();
            if(!name) return showToast('이름을 입력해주세요!');
            
            user.fullName = name;
            localStorage.setItem('couple_user', JSON.stringify(user));
            
            hideModal('authorSelectModal');
            document.getElementById('app-container').style.display = 'flex';
            
            initApp();
            showToast(`${name}님 환영합니다! 💖`);
        }

        function handleLogout() { localStorage.removeItem('couple_user'); location.reload(); }

        function initApp() {
            startClock();
            loadSettings();
            loadPosts();
            setupScrollAnimations();
            startBannerSlider();
            requestNotificationPermission();
            startNotificationPolling();
            document.querySelector('.nav-item').click();
        }

        function switchView(viewId, btnElement) {
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            
            document.querySelectorAll('.view-section').forEach(sec => {
                sec.classList.remove('active');
                sec.style.animation = 'none'; void sec.offsetWidth;
            });
            
            const target = document.getElementById(`view-${viewId}`);
            if(target) {
                target.classList.add('active');
                target.style.animation = 'fadeIn 0.4s ease';
            }
            
            if(viewId === 'calendar') renderCalendar();
            if(viewId === 'board') renderBoardList();
            window.scrollTo(0,0);
        }

        function startClock() {
            setInterval(() => {
                const now = new Date(); const days = ['일','월','화','수','목','금','토'];
                document.getElementById('top-clock').innerText = `${now.getFullYear()}. ${String(now.getMonth()+1).padStart(2,'0')}. ${String(now.getDate()).padStart(2,'0')} (${days[now.getDay()]})`;
            }, 1000);
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            const btn = document.getElementById('editToggleBtn');
            if(isEditMode) {
                document.body.classList.add('edit-mode');
                btn.classList.add('active');
                showToast("편집 모드가 켜졌습니다. ⚙️");
            } else {
                document.body.classList.remove('edit-mode');
                btn.classList.remove('active');
            }
        }

        let currentSlide = 0; const banners = document.querySelectorAll('.banner-img');
        function nextSlide() { currentSlide = (currentSlide + 1) % banners.length; updateSlide(); }
        function updateSlide() {
            banners.forEach(b => b.classList.remove('active'));
            if(banners[currentSlide]) banners[currentSlide].classList.add('active');
        }
        function startBannerSlider() { setInterval(nextSlide, 6000); }

        function setupScrollAnimations() {
            const observer = new IntersectionObserver((entries) => { entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('visible'); }); }, { threshold: 0.1 });
            document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
            setTimeout(() => document.querySelectorAll('.fade-up').forEach(el => el.classList.add('visible')), 200);
        }

        function showModal(id) { 
            const el = document.getElementById(id);
            el.style.display = 'flex';
            void el.offsetWidth;
            el.classList.add('active');
        }
        function hideModal(id) { 
            const el = document.getElementById(id);
            el.classList.remove('active');
            setTimeout(() => { if(!el.classList.contains('active')) el.style.display = 'none'; }, 300);
        }

        function openLightbox(url) {
            document.getElementById('lightboxImg').src = url;
            document.getElementById('lightbox').style.display = 'flex';
            setTimeout(() => document.getElementById('lightbox').style.opacity = '1', 10);
        }
        function closeLightbox() {
            document.getElementById('lightbox').style.opacity = '0';
            setTimeout(() => document.getElementById('lightbox').style.display = 'none', 300);
        }

        async function loadSettings() {
            const res = await fetch('/api/settings'); siteSettings = await res.json();
            
            if(siteSettings.banner_1) document.getElementById('bgImg1').src = siteSettings.banner_1;
            if(siteSettings.banner_2) document.getElementById('bgImg2').src = siteSettings.banner_2;
            if(siteSettings.profile_1) document.getElementById('profile1').src = siteSettings.profile_1;
            if(siteSettings.profile_2) document.getElementById('profile2').src = siteSettings.profile_2;

            const names = siteSettings.couple_names || "Boy & Girl";
            document.getElementById('coupleNamesText').innerText = names;
            document.getElementById('settingNames').value = names;

            if(siteSettings.dday_date) {
                document.getElementById('settingDday').value = siteSettings.dday_date;
                const start = new Date(siteSettings.dday_date); const now = new Date();
                const diffTime = Math.abs(now - start); const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
                document.getElementById('ddayText').innerText = `D+${diffDays}`;
            }

            if(siteSettings.timeline_data) {
                try { timelineData = JSON.parse(siteSettings.timeline_data); } catch(e){}
            } else { timelineData = [{date: "2024-01-01", desc: "우리의 첫 만남"}]; }
            renderTimeline();
        }

        async function saveSettings() {
            const dday = document.getElementById('settingDday').value; const names = document.getElementById('settingNames').value;
            await fetch('/api/settings', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({key:'dday_date', value:dday}) });
            await fetch('/api/settings', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({key:'couple_names', value:names}) });
            hideModal('settingsModal'); loadSettings(); showToast("설정이 저장되었습니다.");
        }

        function renderTimeline() {
            timelineData.sort((a,b) => new Date(b.date) - new Date(a.date));
            document.getElementById('timelineList').innerHTML = timelineData.map((t, idx) => `
                <div class="tl-item">
                    <div class="tl-line"></div><div class="tl-dot"></div>
                    <div class="tl-content">
                        <div class="tl-date">${t.date}</div>
                        <div class="tl-desc">${t.desc} <button class="edit-mode-only-inline btn-close" style="font-size:1rem; padding-left:5px;" onclick="deleteTimelineItem(${idx})"><i class="fa-solid fa-xmark"></i></button></div>
                    </div>
                </div>
            `).join('');
        }

        async function addTimelineItem() {
            const date = document.getElementById('tlDate').value; const desc = document.getElementById('tlDesc').value;
            if(!date || !desc) return showToast('날짜와 내용을 모두 입력해주세요.');
            timelineData.push({date, desc});
            await fetch('/api/settings', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({key:'timeline_data', value:JSON.stringify(timelineData)}) });
            hideModal('addTimelineModal'); document.getElementById('tlDate').value=''; document.getElementById('tlDesc').value=''; renderTimeline(); showToast("역사가 기록되었습니다.");
        }
        
        function deleteTimelineItem(idx) {
            showConfirm(async () => {
                timelineData.splice(idx, 1);
                await fetch('/api/settings', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({key:'timeline_data', value:JSON.stringify(timelineData)}) });
                renderTimeline(); showToast("삭제되었습니다.");
            });
        }

        let currentImgKey = '';
        function triggerSiteImgUpload(key) { currentImgKey = key; document.getElementById('siteImgFileInput').click(); }
        async function handleSiteImgSelected(e) {
            const file = e.target.files[0]; if(!file || !currentImgKey) return;
            showToast("사진 업로드 중...");
            const fd = new FormData(); fd.append('key', currentImgKey); fd.append('image', file);
            const res = await fetch('/api/admin/site-image', { method:'POST', body:fd });
            if(res.ok) { loadSettings(); showToast("사진이 변경되었습니다."); } else showToast('업로드 실패');
        }

        let currentCalDate = new Date();
        
        function renderCalendar() {
            const year = currentCalDate.getFullYear(); const month = currentCalDate.getMonth();
            document.getElementById('cal-month-year').innerText = `${year}. ${String(month+1).padStart(2,'0')}`;
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const grid = document.getElementById('calendar-days');
            
            const daysArr = ['일','월','화','수','목','금','토'];
            let html = daysArr.map((d,i) => `<div class="cal-day-name" style="${i===0?'color:#FC8181':(i===6?'color:#63B3ED':'')}">${d}</div>`).join('');
            const todayStr = new Date().toISOString().split('T')[0];

            for(let i=0; i<firstDay; i++) html += `<div class="cal-cell empty"></div>`;
            
            for(let d=1; d<=daysInMonth; d++) {
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                
                const hasDiary = postsData.some(p => { const prts = (p.author||'').split('|'); return prts[3] === '다이어리' && prts[4] === dateStr; });
                const hasSchedule = postsData.some(p => { const prts = (p.author||'').split('|'); return prts[3] === '일정' && prts[4] === dateStr; });
                
                const isToday = dateStr === todayStr ? 'today' : '';
                let indicators = '';
                if(hasDiary) indicators += `<div class="dot-diary"></div>`;
                if(hasSchedule) indicators += `<div class="dot-schedule"></div>`;
                
                html += `<div class="cal-cell ${isToday}" onclick="openDayView('${dateStr}')">${d}<div class="cal-indicators">${indicators}</div></div>`;
            }
            grid.innerHTML = html;
        }

        function changeMonth(offset) { currentCalDate.setMonth(currentCalDate.getMonth() + offset); renderCalendar(); }
        
        function openDayView(dateStr) {
            document.getElementById('dayViewDateHdn').value = dateStr;
            const parts = dateStr.split('-');
            document.getElementById('dayViewTitle').innerText = `${parts[0]}. ${parts[1]}. ${parts[2]}`;
            
            const dayPosts = postsData.filter(p => {
                const prts = (p.author||'').split('|');
                return (prts[3] === '다이어리' || prts[3] === '일정') && prts[4] === dateStr;
            });
            
            const listEl = document.getElementById('dayEntryList');
            if(dayPosts.length === 0) {
                listEl.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:30px 0;">등록된 기록이 없습니다.</p>`;
            } else {
                listEl.innerHTML = dayPosts.map(p => {
                    const prts = (p.author||'').split('|');
                    const catClass = prts[3] === '일정' ? 'schedule' : '';
                    return `
                        <div class="day-entry-item ${catClass}" onclick="openDetail(${p.id})">
                            <span class="entry-cat">${prts[3]}</span>
                            <div class="entry-title">${prts[2]}</div>
                        </div>
                    `;
                }).join('');
            }
            showModal('dayViewModal');
        }

        function openWriteModal(catDefault, dateDefault) { 
            hideModal('dayViewModal');
            document.getElementById('postCategory').value = catDefault || '일상';
            document.getElementById('postDate').value = dateDefault || new Date().toISOString().split('T')[0];
            document.getElementById('postTitle').value = '';
            document.getElementById('postContent').value = '';
            document.getElementById('postImage').value = '';
            showModal('writeModal'); 
        }

        function setBoardCategory(cat, btnEl) { 
            currentBoardTab = cat; 
            document.querySelectorAll('.board-tab').forEach(b => b.classList.remove('active')); 
            btnEl.classList.add('active'); 
            renderBoardList(); 
        }

        async function submitPost() {
            const cat = document.getElementById('postCategory').value; 
            const title = document.getElementById('postTitle').value.trim(); 
            const content = document.getElementById('postContent').value.trim(); 
            const file = document.getElementById('postImage').files[0];
            const dateStr = document.getElementById('postDate').value || new Date().toISOString().split('T')[0];

            if(!title) return showToast('제목을 입력하세요.');
            if(cat === '갤러리' && !file) return showToast('갤러리 분류는 사진 첨부가 필수입니다!');

            const fd = new FormData(); 
            fd.append('author', user.fullName); 
            fd.append('username', user.username); 
            fd.append('title', title); 
            fd.append('category', cat); 
            fd.append('date', dateStr); 
            fd.append('content', content); 
            if(file) fd.append('image', file);
            
            showToast("기록을 안전하게 저장하는 중...");
            const res = await fetch('/api/posts', { method: 'POST', body: fd });
            if(res.ok) { hideModal('writeModal'); loadPosts(); showToast("기록이 예쁘게 저장되었습니다! 💖"); }
            else showToast('저장에 실패했습니다.');
        }

        async function loadPosts() {
            const [rp, rc] = await Promise.all([fetch('/api/posts'), fetch('/api/comments')]);
            postsData = await rp.json(); commentsData = await rc.json();
            
            if(document.getElementById('view-calendar').classList.contains('active')) renderCalendar();
            if(document.getElementById('view-board').classList.contains('active')) renderBoardList();
            
            if(postsData.length > 0) localStorage.setItem('last_post_id', postsData[0].id);
        }

        function renderBoardList() {
            const list = document.getElementById('boardList'); list.innerHTML = '';
            
            let filtered = postsData.filter(p => {
                const cat = (p.author||'').split('|')[3]||'일상';
                if(currentBoardTab === '전체') return cat !== '다이어리' && cat !== '일정';
                return cat === currentBoardTab;
            });
            
            if(filtered.length === 0) { list.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:50px 0;">작성된 기록이 없습니다.</p>`; list.className=''; return; }

            if(currentBoardTab === '갤러리') {
                list.className = 'gallery-grid';
                filtered.forEach(p => {
                    const parts = (p.author||'').split('|');
                    if(!p.image_url) return;
                    list.innerHTML += `
                        <div class="gallery-item" onclick="openDetail(${p.id})">
                            <img src="${p.image_url}">
                            <div class="gallery-item-info">
                                <div class="gallery-item-title">${parts[2]}</div>
                            </div>
                        </div>`;
                });
            } else {
                list.className = '';
                filtered.forEach(p => {
                    const parts = (p.author||'').split('|');
                    const ccount = commentsData.filter(c=>c.post_id===p.id).length;
                    list.innerHTML += `
                        <div class="post-card" onclick="openDetail(${p.id})">
                            <div class="post-content-flex">
                                <div>
                                    <div class="post-top-meta">
                                        <span class="post-cat-badge">${parts[3]}</span>
                                        <span class="post-date">${parts[4] || ''}</span>
                                    </div>
                                    <div class="post-title">${parts[2]}</div>
                                    <div class="post-preview">${p.content}</div>
                                </div>
                                <div style="font-size:0.85rem; color:var(--text-muted); margin-top:10px;"><i class="fa-solid fa-pen-nib"></i> ${parts[0]} <span style="margin-left:10px;"><i class="fa-regular fa-comment"></i> ${ccount}</span></div>
                            </div>
                            ${p.image_url ? `<img src="${p.image_url}" class="post-thumb">` : ''}
                        </div>`;
                });
            }
        }

        function openDetail(id) {
            activePost = postsData.find(p => p.id === id); if(!activePost) return;
            const parts = (activePost.author||'').split('|');
            document.getElementById('modalCategory').innerText = parts[3]||'기록';
            
            let metaTxt = parts[0];
            if(parts[3] === '다이어리' || parts[3] === '일정') metaTxt = `[${parts[4]}] ${parts[0]}`;
            
            document.getElementById('modalDateMeta').innerText = metaTxt;
            document.getElementById('modalAuthor').innerText = parts[0];
            document.getElementById('modalTitle').innerText = parts[2]||'무제';
            document.getElementById('modalContent').innerText = activePost.content;
            
            document.getElementById('modalImageWrap').innerHTML = activePost.image_url ? `<img src="${activePost.image_url}" class="detail-image" onclick="openLightbox('${activePost.image_url}')">` : '';
            
            renderComments();
            showModal('detailModal');
        }

        function renderComments() {
            if(!activePost) return;
            const postComments = commentsData.filter(c => c.post_id === activePost.id);
            document.getElementById('modalCommentsHeader').innerHTML = `댓글 <span style="color:var(--primary);">${postComments.length}</span>`;
            document.getElementById('modalCommentsList').innerHTML = postComments.map(c => `
                <div class="comment-box">
                    <div><b style="color:var(--primary);">${c.author}</b> <span>${c.content}</span></div>
                    <button class="comment-del-btn edit-mode-only-inline" onclick="deleteComment(${c.id})"><i class="fa-solid fa-xmark"></i></button>
                </div>
            `).join('');
            document.getElementById('modal-comment-input').value = '';
        }

        async function submitComment() {
            if(!activePost) return;
            const content = document.getElementById('modal-comment-input').value.trim();
            if (!content) return showToast('댓글을 입력해주세요.');
            const res = await fetch('/api/comments', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ postId: activePost.id, author: user.fullName, content }) });
            if (res.ok) { 
                const resComments = await fetch('/api/comments'); commentsData = await resComments.json();
                renderComments();
                if(document.getElementById('view-board').classList.contains('active')) renderBoardList();
            }
        }
        
        function deleteComment(id) {
            showConfirm(async () => {
                const res = await fetch('/api/comments', { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
                if (res.ok) { 
                    const resComments = await fetch('/api/comments'); commentsData = await resComments.json();
                    renderComments();
                    if(document.getElementById('view-board').classList.contains('active')) renderBoardList();
                    showToast('삭제되었습니다.');
                }
            });
        }

        function openEditFromDetail() {
            hideModal('detailModal'); 
            if(!activePost) return;
            const parts = (activePost.author || '').split('|');
            document.getElementById('editPostId').value = activePost.id; 
            document.getElementById('editAuthorMeta').value = `${parts[0]}|${parts[1]}`; 
            document.getElementById('editCategory').value = parts[3] || '일상'; 
            document.getElementById('editDate').value = parts[4] || ''; 
            document.getElementById('editKeepImage').value = activePost.image_url || '';
            document.getElementById('editTitle').value = parts[2] || ''; 
            document.getElementById('editContent').value = activePost.content || ''; 
            document.getElementById('editImage').value = '';
            showModal('editModal');
        }

        async function submitEdit() {
            const fd = new FormData(); 
            fd.append('id', document.getElementById('editPostId').value); 
            fd.append('authorMeta', document.getElementById('editAuthorMeta').value); 
            fd.append('category', document.getElementById('editCategory').value); 
            fd.append('date', document.getElementById('editDate').value); 
            fd.append('keepImage', document.getElementById('editKeepImage').value); 
            fd.append('title', document.getElementById('editTitle').value.trim()); 
            fd.append('content', document.getElementById('editContent').value.trim()); 
            if (document.getElementById('editImage').files[0]) fd.append('image', document.getElementById('editImage').files[0]);
            
            showToast("수정 중...");
            const res = await fetch('/api/posts', { method:'PUT', body: fd }); 
            if (res.ok) { hideModal('editModal'); loadPosts(); showToast("수정이 완료되었습니다!"); }
        }

        function deleteFromDetail() {
            showConfirm(async () => {
                await fetch('/api/posts', { method:'DELETE', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:activePost.id}) });
                hideModal('detailModal'); loadPosts(); showToast("기록이 삭제되었습니다.");
            });
        }

        function requestNotificationPermission() {
            if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission();
            }
        }

        function startNotificationPolling() {
            setInterval(async () => {
                try {
                    const [rp, rc] = await Promise.all([fetch('/api/posts'), fetch('/api/comments')]);
                    const latestPosts = await rp.json(); const latestComms = await rc.json();
                    
                    let notify = false;
                    
                    if(latestPosts.length > 0) {
                        const topPost = latestPosts[0]; const lastSeenId = localStorage.getItem('last_post_id');
                        if(lastSeenId && topPost.id > parseInt(lastSeenId) && !(topPost.author||'').includes(user.username)) {
                            localStorage.setItem('last_post_id', topPost.id); notify = true;
                        }
                    }
                    
                    if(latestComms.length > 0) {
                        const topComm = latestComms[latestComms.length-1]; const lastCommId = localStorage.getItem('last_comm_id');
                        if(lastCommId && topComm.id > parseInt(lastCommId) && topComm.author !== user.fullName) {
                            localStorage.setItem('last_comm_id', topComm.id); notify = true;
                        }
                    }
                    
                    if(latestPosts.length > 0 && !localStorage.getItem('last_post_id')) localStorage.setItem('last_post_id', latestPosts[0].id);
                    if(latestComms.length > 0 && !localStorage.getItem('last_comm_id')) localStorage.setItem('last_comm_id', latestComms[latestComms.length-1].id);

                    if(notify) {
                        showToast("새로운 소식이 도착했어요! 💌");
                        if(Notification.permission === "granted") {
                            new Notification("Our Space 💖", { body: "상대방이 새로운 추억을 남겼어요!", icon: "https://cdn-icons-png.flaticon.com/512/833/833472.png" });
                        }
                        loadPosts(); 
                    }
                } catch(e) {}
            }, 30000); 
        }

    </script>
</body>
</html>
