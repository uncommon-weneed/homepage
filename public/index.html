<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Secret Space 💖</title>
    <!-- Pretendard Font & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #E68A8A; 
            --primary-light: #FDE8E8;
            --accent: #D47979;
            --bg-main: #FAF7F5;
            --surface: #FFFFFF;
            --text-dark: #3A3A3A;
            --text-muted: #9CA3AF;
            --border: #F1E5E3;
            --radius-md: 18px;
            --radius-lg: 28px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
        html { scroll-behavior: smooth; }
        body { background: var(--bg-main); color: var(--text-dark); line-height: 1.6; overflow-x: hidden; min-height: 100vh; }

        /* 편집 모드(Edit Mode) 스타일 */
        .edit-mode-only { display: none !important; }
        body.edit-mode .edit-mode-only { display: flex !important; }

        /* 애니메이션 */
        .fade-up { opacity: 1; transform: translateY(0); transition: opacity 0.6s ease-out, transform 0.6s ease-out; }
        .fade-init { opacity: 0; transform: translateY(20px); }
        .fade-init.visible { opacity: 1; transform: translateY(0); }

        /* 시크릿 진입 화면 */
        #auth-wall { 
            position: fixed; 
            inset: 0; 
            background: #F8F5F2; 
            z-index: 9999; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            flex-direction: column; 
            padding: 20px; 
            transition: opacity 0.4s ease, visibility 0.4s ease; 
        }
        #auth-wall.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .auth-box { background: white; padding: 40px; border-radius: var(--radius-lg); box-shadow: 0 15px 40px rgba(0,0,0,0.05); width: 100%; max-width: 380px; text-align: center; }
        .auth-box i { font-size: 2.3rem; color: var(--primary); margin-bottom: 12px; }
        .auth-box h1 { font-size: 1.4rem; color: #444; margin-bottom: 20px; font-weight: 800; letter-spacing: 1px; }
        .auth-box input { width: 100%; padding: 14px; background: #F9FAFB; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; font-size: 1rem; text-align: center; letter-spacing: 2px; transition: 0.2s; outline: none; }
        .auth-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
        .auth-box button { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 1.05rem; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .auth-box button:hover { background: var(--accent); }

        /* 메인 콘텐츠 영역 */
        #main-content { display: none; padding-top: 70px; }
        #main-content.active { display: block; }

        header { position: fixed; top: 0; width: 100%; background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(15px); z-index: 100; border-bottom: 1px solid rgba(0,0,0,0.03); }
        .nav-inner { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; height: 70px; padding: 0 20px; }
        .logo { font-size: 1.35rem; font-weight: 800; color: var(--primary); text-decoration: none; display: flex; align-items: center; gap: 8px; font-family: 'Georgia', serif; font-style: italic; }
        .header-center { font-size: 0.9rem; font-weight: 600; color: var(--text-muted); }
        .header-right { display: flex; gap: 15px; align-items: center; }
        .header-btn { background: none; border: none; font-size: 1.25rem; color: var(--text-muted); cursor: pointer; transition: 0.2s; }
        .header-btn:hover, .header-btn.active { color: var(--primary); }

        /* 사진 교체 배지 */
        .admin-img-badge { position: absolute; top: 15px; right: 15px; z-index: 30; background: rgba(255,255,255,0.95); color: var(--text-dark); padding: 7px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: none; align-items: center; gap: 6px; }
        .admin-img-badge:hover { background: var(--primary); color: white; }

        /* 크로스페이드 배너 */
        .slider-container { position: relative; width: 100%; height: calc(100vh - 70px); min-height: 520px; overflow: hidden; background: #F8F5F2; }
        .slide { position: absolute; inset: 0; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 1.2s ease-in-out; z-index: 1; }
        .slide.active { opacity: 1; z-index: 2; }
        .slide::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0.2)); }
        
        .dday-box { position: relative; z-index: 3; text-align: center; color: white; text-shadow: 0 4px 15px rgba(0,0,0,0.4); padding: 0 20px; }
        .dday-title { font-size: 1.15rem; letter-spacing: 3px; margin-bottom: 8px; font-weight: 400; text-transform: uppercase; }
        .dday-count { font-size: 4.8rem; font-weight: 800; font-family: 'Georgia', serif; display: inline-block; padding: 0 10px; line-height: 1.1; margin-bottom: 8px; }
        .dday-names { font-size: 1.35rem; font-weight: 400; letter-spacing: 2px; }

        .slider-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: transparent; color: rgba(255,255,255,0.4); border: none; font-size: 2.6rem; cursor: pointer; z-index: 10; transition: 0.2s; padding: 15px; }
        .slider-arrow:hover { color: white; }
        .slider-arrow.prev { left: 15px; }
        .slider-arrow.next { right: 15px; }

        /* 레이아웃 컨테이너 */
        .container { max-width: 1050px; margin: 0 auto; padding: 70px 20px; }
        .section-header { text-align: center; margin-bottom: 35px; }
        .section-header h2 { font-size: 1.85rem; font-weight: 800; color: var(--text-dark); font-family: 'Georgia', serif; font-style: italic; }
        .section-header p { color: var(--primary); font-weight: 600; margin-top: 4px; font-size: 0.95rem; letter-spacing: 1px; }

        .grid-premium { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        .card { background: var(--surface); border-radius: var(--radius-lg); box-shadow: 0 8px 25px rgba(0,0,0,0.02); padding: 35px; border: 1px solid var(--border); }

        .profile-img-wrap { width: 100%; aspect-ratio: 1/1; border-radius: var(--radius-md); background: #eee; position: relative; overflow: hidden; margin-bottom: 12px; }
        .profile-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .profile-name { font-size: 1.2rem; font-weight: 800; color: var(--text-dark); text-align: center; }

        /* 타임라인 */
        .timeline { border-left: 2px solid var(--primary-light); padding-left: 20px; margin-left: 10px; margin-top: 15px; }
        .timeline-item { position: relative; margin-bottom: 20px; }
        .timeline-item::before { content:''; position: absolute; left: -27px; top: 5px; width: 12px; height: 12px; background: var(--primary); border-radius: 50%; box-shadow: 0 0 0 4px white; }
        .tl-date { font-weight: 800; color: var(--primary); font-size: 0.95rem; }
        .tl-desc { color: var(--text-dark); font-size: 0.9rem; margin-top: 2px; }
        .tl-delete { color: #EF4444; background: none; border: none; cursor: pointer; margin-left: 8px; }

        /* 캘린더 */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .calendar-header button { background: none; border: none; font-size: 1.3rem; color: var(--text-muted); cursor: pointer; padding: 6px 12px; }
        .calendar-header button:hover { color: var(--primary); }
        .calendar-header h3 { font-size: 1.35rem; font-weight: 800; font-family: 'Georgia', serif; color: var(--text-dark); }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
        .cal-day-header { font-weight: 700; color: var(--text-muted); font-size: 0.8rem; margin-bottom: 8px; }
        .cal-cell { aspect-ratio: 1/1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 10px; cursor: pointer; transition: 0.15s; font-size: 0.95rem; font-weight: 600; }
        .cal-cell:hover { background: var(--primary-light); }
        .cal-cell.today { background: var(--primary); color: white; }
        .cal-cell.empty { visibility: hidden; }
        .cal-dot { width: 5px; height: 5px; background: var(--accent); border-radius: 50%; margin-top: 3px; }
        .cal-cell.today .cal-dot { background: white; }

        /* 갤러리 메이슨리 */
        .board-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .board-tabs { display: flex; gap: 15px; }
        .board-tab { background: none; border: none; font-size: 1.05rem; font-weight: 700; color: var(--text-muted); cursor: pointer; position: relative; padding-bottom: 8px; }
        .board-tab.active { color: var(--primary); }
        .board-tab.active::after { content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 3px; background: var(--primary); border-radius: 3px 3px 0 0; }

        .masonry-grid { column-count: 3; column-gap: 16px; }
        .masonry-item { break-inside: avoid; margin-bottom: 16px; background: white; border-radius: var(--radius-md); overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.03); cursor: pointer; transition: 0.2s; border: 1px solid var(--border); }
        .masonry-item:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(0,0,0,0.06); }
        .masonry-item img { width: 100%; height: auto; display: block; }
        .masonry-info { padding: 12px; }
        .masonry-title { font-weight: 800; font-size: 0.95rem; margin-bottom: 4px; color: var(--text-dark); }
        .masonry-meta { font-size: 0.8rem; color: var(--text-muted); display: flex; justify-content: space-between; }

        .post-list { display: flex; flex-direction: column; gap: 12px; }
        .post-item { background: white; padding: 20px; border-radius: var(--radius-md); border: 1px solid var(--border); display: flex; gap: 16px; align-items: center; cursor: pointer; transition: 0.2s; }
        .post-item:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.03); }
        .post-info { flex-grow: 1; }
        .post-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 4px; }
        .post-desc { color: var(--text-muted); font-size: 0.9rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* 폼 & 모달 */
        input, textarea, select { width: 100%; padding: 12px 14px; background: #F9FAFB; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; font-size: 0.95rem; outline: none; }
        input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); background: white; }
        .btn-primary { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-primary:hover { background: var(--accent); }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: white; padding: 35px; border-radius: var(--radius-lg); width: 100%; max-width: 550px; max-height: 88vh; overflow-y: auto; }

        .toast { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%) translateY(80px); background: #333; color: white; padding: 10px 22px; border-radius: 25px; font-size: 0.9rem; font-weight: 600; opacity: 0; transition: 0.3s; z-index: 9999; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        .hidden { display: none !important; }

        @media (max-width: 768px) {
            .grid-premium { grid-template-columns: 1fr; }
            .masonry-grid { column-count: 2; column-gap: 10px; }
            .dday-count { font-size: 3.8rem; }
            .header-center { display: none; }
            .card { padding: 25px; }
        }
    </style>
</head>
<body>

    <!-- 🔐 시크릿 진입 화면 (Auth Wall) -->
    <div id="auth-wall">
        <div class="auth-box">
            <i class="fa-solid fa-heart"></i>
            <h1>Secret Place</h1>
            <p style="color:var(--text-muted); font-size:0.85rem; margin-bottom:20px;">우리만의 암호를 입력해 주세요.</p>
            <input type="text" id="l_id" placeholder="아이디" autocomplete="off">
            <input type="password" id="l_pw" placeholder="비밀번호" onkeydown="if(event.key==='Enter') submitLogin()">
            <button onclick="submitLogin()">입장하기</button>
        </div>
    </div>

    <!-- 💖 메인 콘텐츠 -->
    <div id="main-content">
        <header>
            <div class="nav-inner">
                <a href="#" class="logo"><i class="fa-solid fa-heart" style="font-size:1.1rem;"></i> Our Story</a>
                <div class="header-center" id="top-clock">시간 로딩 중...</div>
                <div class="header-right">
                    <button class="header-btn" id="editToggleBtn" onclick="toggleEditMode()" title="편집 모드"><i class="fa-solid fa-gear"></i></button>
                    <button class="header-btn" onclick="handleLogout()" title="잠그기"><i class="fa-solid fa-lock"></i></button>
                </div>
            </div>
        </header>

        <!-- 배너 & D-Day -->
        <div class="slider-container" id="section-home">
            <div class="slides" id="slideTrack">
                <div class="slide active" id="slideBanner1" style="background-image: url('https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?q=80&w=1920&auto=format&fit=crop');">
                    <button class="admin-img-badge edit-mode-only" onclick="triggerSiteImgUpload('banner_1')"><i class="fa-solid fa-camera"></i> 배경 변경</button>
                    <div class="dday-box">
                        <div class="dday-title">우리 만난 지</div>
                        <div class="dday-count" id="ddayText">D+♥</div>
                        <div class="dday-names" id="coupleNamesText">Boy & Girl</div>
                        <div style="margin-top:12px;">
                            <button class="edit-mode-only" onclick="showModal('settingsModal')" style="background:rgba(255,255,255,0.3); color:white; border:none; padding:5px 14px; border-radius:15px; cursor:pointer; font-size:0.85rem;"><i class="fa-solid fa-pen"></i> 디데이 수정</button>
                        </div>
                    </div>
                </div>
                <div class="slide" id="slideBanner2" style="background-image: url('https://images.unsplash.com/photo-1522673607200-164d1b6ce486?q=80&w=1920&auto=format&fit=crop');">
                    <button class="admin-img-badge edit-mode-only" onclick="triggerSiteImgUpload('banner_2')"><i class="fa-solid fa-camera"></i> 배경 변경</button>
                    <div class="dday-box">
                        <h2 style="font-size:2.4rem; font-weight:800; margin-bottom:8px;">모든 순간이 기적이야</h2>
                        <p style="font-size:1.05rem; font-weight:300;">함께하는 평범한 일상이 가장 큰 행복</p>
                    </div>
                </div>
            </div>
            <button class="slider-arrow prev" onclick="prevSlide()"><i class="fa-solid fa-angle-left"></i></button>
            <button class="slider-arrow next" onclick="nextSlide()"><i class="fa-solid fa-angle-right"></i></button>
        </div>

        <!-- 프로필 & 타임라인 -->
        <div class="container">
            <div class="section-header">
                <h2>Our Profile</h2>
                <p>소중한 둘만의 프로필</p>
            </div>
            
            <div class="grid-premium">
                <div class="card" style="display:flex; flex-direction:row; align-items:center; gap:15px;">
                    <div style="flex:1;">
                        <div class="profile-img-wrap">
                            <img id="profile1" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=400&auto=format&fit=crop">
                            <button class="admin-img-badge edit-mode-only" onclick="triggerSiteImgUpload('profile_1')"><i class="fa-solid fa-camera"></i></button>
                        </div>
                        <div class="profile-name">Her</div>
                    </div>
                    <i class="fa-solid fa-heart" style="color:var(--primary); font-size:1.6rem; opacity:0.8;"></i>
                    <div style="flex:1;">
                        <div class="profile-img-wrap">
                            <img id="profile2" src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?q=80&w=400&auto=format&fit=crop">
                            <button class="admin-img-badge edit-mode-only" onclick="triggerSiteImgUpload('profile_2')"><i class="fa-solid fa-camera"></i></button>
                        </div>
                        <div class="profile-name">Him</div>
                    </div>
                </div>
                
                <div class="card">
                    <h3 style="font-size:1.35rem; color:var(--text-dark); margin-bottom:15px; font-family:'Georgia', serif;">Our Milestones</h3>
                    <div class="timeline" id="timelineList"></div>
                    <button class="edit-mode-only btn-primary" style="margin-top:15px; padding:8px; background:#F3F4F6; color:var(--text-dark); font-size:0.9rem;" onclick="showModal('addTimelineModal')"><i class="fa-solid fa-plus"></i> 역사 기록 추가</button>
                </div>
            </div>
        </div>

        <!-- 다이어리 캘린더 -->
        <div class="container" style="background:#fff; border-radius:var(--radius-lg); box-shadow: 0 8px 25px rgba(0,0,0,0.02); margin-bottom:30px;">
            <div class="section-header" style="margin-bottom:15px;">
                <h2>Our Diary</h2>
                <p>그날의 일상과 기억</p>
            </div>
            
            <div class="calendar-header">
                <button onclick="changeMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                <h3 id="cal-month-year">2026. 10</h3>
                <button onclick="changeMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            
            <div class="calendar-grid">
                <div class="cal-day-header" style="color:#EF4444;">일</div>
                <div class="cal-day-header">월</div>
                <div class="cal-day-header">화</div>
                <div class="cal-day-header">수</div>
                <div class="cal-day-header">목</div>
                <div class="cal-day-header">금</div>
                <div class="cal-day-header" style="color:#3B82F6;">토</div>
            </div>
            <div class="calendar-grid" id="calendar-days"></div>
        </div>

        <!-- 갤러리 & 게시판 -->
        <div class="container" id="section-board" style="padding-top:20px;">
            <div class="board-controls">
                <div class="board-tabs">
                    <button class="board-tab active" onclick="setCategoryTab('갤러리')">사진 갤러리</button>
                    <button class="board-tab" onclick="setCategoryTab('편지함')">비밀 편지함</button>
                </div>
                <button onclick="openWritePanel()" style="background:var(--primary); color:white; border:none; padding:8px 18px; border-radius:20px; font-weight:700; cursor:pointer; font-size:0.9rem;"><i class="fa-solid fa-pen"></i> 기록 남기기</button>
            </div>

            <div id="writePanel" class="hidden" style="background:white; border:1px solid var(--border); padding:25px; border-radius:var(--radius-lg); margin-bottom:25px;">
                <input type="hidden" id="postDate" value="">
                <select id="postCategory">
                    <option value="갤러리">갤러리 (사진필수)</option>
                    <option value="다이어리">다이어리 (캘린더 연동)</option>
                    <option value="편지함">비밀 편지함</option>
                </select>
                <input type="text" id="postTitle" placeholder="제목을 입력하세요">
                <textarea id="postContent" rows="4" placeholder="내용을 적어주세요..."></textarea>
                <input type="file" id="postImage" accept="image/*">
                <button class="btn-primary" onclick="submitPost()">저장하기</button>
            </div>

            <div id="boardList">기록을 불러오는 중...</div>
        </div>

        <footer style="text-align:center; padding: 40px 20px; color:var(--text-muted); font-size:0.85rem;">
            <div style="font-size:1.15rem; font-weight:800; font-family:'Georgia',serif; margin-bottom:4px; color:var(--primary);">Our Secret Space</div>
            <p>언제나 변치 않는 마음으로 사랑할게 ♥</p>
        </footer>
    </div>

    <!-- 숨겨진 이미지 파일 인풋 -->
    <input type="file" id="siteImgFileInput" accept="image/*" class="hidden" onchange="handleSiteImgSelected(event)">

    <!-- 모달: 상세 보기 -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content">
            <span style="float:right; font-size:1.4rem; cursor:pointer; color:#aaa;" onclick="hideModal('detailModal')">&times;</span>
            <div style="margin-bottom:12px; font-size:0.85rem; color:var(--text-muted);">
                <span style="background:var(--primary-light); color:var(--primary); padding:3px 10px; border-radius:15px; font-weight:700;" id="modalCategory"></span>
                <span id="modalDateMeta" style="margin-left:8px;"></span>
            </div>
            <h2 id="modalTitle" style="font-size:1.45rem; margin-bottom:15px; color:var(--text-dark); font-weight:800;"></h2>
            <div id="modalContent" style="white-space:pre-wrap; line-height:1.7; color:#444; margin-bottom:20px;"></div>
            <div id="modalImageWrap"></div>
            
            <div class="edit-mode-only" style="display:flex; justify-content:flex-end; gap:8px; margin-top:20px; border-top:1px solid var(--border); padding-top:15px;">
                <button style="padding:7px 14px; border:none; border-radius:8px; font-weight:700; cursor:pointer; background:#EF4444; color:white;" onclick="deleteFromDetail()">삭제</button>
            </div>
        </div>
    </div>

    <!-- 모달: D-Day 설정 -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-content" style="max-width: 380px;">
            <h3 style="margin-bottom:15px; font-size:1.3rem;">우리 설정</h3>
            <label style="font-size:0.85rem; font-weight:700; color:var(--text-muted);">처음 만난 날</label>
            <input type="date" id="settingDday" style="margin-top:4px;">
            <label style="font-size:0.85rem; font-weight:700; color:var(--text-muted);">메인 타이틀</label>
            <input type="text" id="settingNames" style="margin-top:4px;" placeholder="Boy & Girl">
            <button class="btn-primary" onclick="saveSettings()">설정 저장</button>
            <button class="btn-primary" style="background:#eee; color:#333; margin-top:8px;" onclick="hideModal('settingsModal')">닫기</button>
        </div>
    </div>

    <!-- 모달: 타임라인 추가 -->
    <div class="modal-overlay" id="addTimelineModal">
        <div class="modal-content" style="max-width: 380px;">
            <h3 style="margin-bottom:15px; font-size:1.3rem;">역사 추가하기</h3>
            <input type="date" id="tlDate">
            <input type="text" id="tlDesc" placeholder="어떤 일이 있었나요?">
            <button class="btn-primary" onclick="addTimelineItem()">기록 추가</button>
            <button class="btn-primary" style="background:#eee; color:#333; margin-top:8px;" onclick="hideModal('addTimelineModal')">취소</button>
        </div>
    </div>

    <div id="toast" class="toast"><i class="fa-solid fa-bell"></i> <span id="toastMsg">새로운 추억이 도착했어요!</span></div>

    <script>
        let user = null;
        let postsData = [];
        let commentsData = [];
        let siteSettings = {};
        let timelineData = [];
        let currentTab = '갤러리';
        let isEditMode = false;
        let activePost = null;
        let currentCalDate = new Date();
        let currentSlide = 0;
        let slideInt = null;

        // 새로고침 방어: DOM 준비 후 세션 체크
        window.addEventListener('DOMContentLoaded', () => {
            try {
                user = JSON.parse(localStorage.getItem('couple_user') || 'null');
            } catch (e) {
                user = null;
            }

            if (user) {
                showMainInterface();
            } else {
                document.getElementById('auth-wall').classList.remove('hidden');
                document.getElementById('main-content').classList.remove('active');
            }
        });

        function showMainInterface() {
            document.getElementById('auth-wall').classList.add('hidden');
            document.getElementById('main-content').classList.add('active');
            initApp();
        }

        async function submitLogin() {
            const id = document.getElementById('l_id').value.trim();
            const pw = document.getElementById('l_pw').value.trim();
            if (!id || !pw) return alert('아이디와 비밀번호를 입력해주세요.');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: id, password: pw})
                });
                if (res.ok) {
                    user = await res.json();
                    localStorage.setItem('couple_user', JSON.stringify(user));
                    showMainInterface();
                } else {
                    const d = await res.json();
                    alert(d.error || '로그인에 실패했습니다.');
                }
            } catch (err) {
                alert('서버 연결 중 오류가 발생했습니다.');
            }
        }

        function handleLogout() {
            localStorage.removeItem('couple_user');
            location.reload();
        }

        async function initApp() {
            startClock();
            await loadSettings();
            await loadPosts();
            startSlider();
        }

        function startClock() {
            function updateTime() {
                const now = new Date();
                const days = ['일','월','화','수','목','금','토'];
                const clockEl = document.getElementById('top-clock');
                if (clockEl) {
                    clockEl.innerText = `${now.getFullYear()}. ${String(now.getMonth()+1).padStart(2,'0')}. ${String(now.getDate()).padStart(2,'0')} (${days[now.getDay()]}) ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
                }
            }
            updateTime();
            setInterval(updateTime, 1000);
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            document.body.classList.toggle('edit-mode', isEditMode);
            const btn = document.getElementById('editToggleBtn');
            if (btn) btn.classList.toggle('active', isEditMode);
        }

        // 슬라이더 안전 전환
        function updateSlide() {
            const slides = document.querySelectorAll('.slide');
            if (!slides || slides.length === 0) return;
            slides.forEach((s, idx) => {
                s.classList.toggle('active', idx === currentSlide);
            });
        }
        function nextSlide() {
            const slides = document.querySelectorAll('.slide');
            if (!slides || slides.length === 0) return;
            currentSlide = (currentSlide + 1) % slides.length;
            updateSlide();
        }
        function prevSlide() {
            const slides = document.querySelectorAll('.slide');
            if (!slides || slides.length === 0) return;
            currentSlide = (currentSlide - 1 + slides.length) % slides.length;
            updateSlide();
        }
        function startSlider() {
            if (slideInt) clearInterval(slideInt);
            slideInt = setInterval(nextSlide, 5000);
        }

        // 설정 불러오기
        async function loadSettings() {
            try {
                const res = await fetch('/api/settings');
                siteSettings = await res.json();

                if (siteSettings.banner_1) document.getElementById('slideBanner1').style.backgroundImage = `url('${siteSettings.banner_1}')`;
                if (siteSettings.banner_2) document.getElementById('slideBanner2').style.backgroundImage = `url('${siteSettings.banner_2}')`;
                if (siteSettings.profile_1) document.getElementById('profile1').src = siteSettings.profile_1;
                if (siteSettings.profile_2) document.getElementById('profile2').src = siteSettings.profile_2;

                const names = siteSettings.couple_names || "Boy & Girl";
                document.getElementById('coupleNamesText').innerText = names;
                document.getElementById('settingNames').value = names;

                if (siteSettings.dday_date) {
                    document.getElementById('settingDday').value = siteSettings.dday_date;
                    const start = new Date(siteSettings.dday_date);
                    const now = new Date();
                    const diffTime = Math.abs(now - start);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    document.getElementById('ddayText').innerText = `D+${diffDays}`;
                }

                if (siteSettings.timeline_data) {
                    try { timelineData = JSON.parse(siteSettings.timeline_data); } catch(e){ timelineData = []; }
                } else {
                    timelineData = [{date: "2024-01-01", desc: "우리의 첫 만남"}];
                }
                renderTimeline();
            } catch (err) {
                console.error("설정 로드 실패:", err);
            }
        }

        async function saveSettings() {
            const dday = document.getElementById('settingDday').value;
            const names = document.getElementById('settingNames').value;
            await fetch('/api/settings', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({key:'dday_date', value:dday}) });
            await fetch('/api/settings', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({key:'couple_names', value:names}) });
            hideModal('settingsModal');
            loadSettings();
        }

        function renderTimeline() {
            const listEl = document.getElementById('timelineList');
            if (!listEl) return;
            timelineData.sort((a,b) => new Date(b.date) - new Date(a.date));
            listEl.innerHTML = timelineData.map((t, idx) => `
                <div class="timeline-item">
                    <div class="tl-date">${t.date} 
                        <button class="edit-mode-only tl-delete" onclick="deleteTimelineItem(${idx})"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="tl-desc">${t.desc}</div>
                </div>
            `).join('');
        }

        async function addTimelineItem() {
            const date = document.getElementById('tlDate').value;
            const desc = document.getElementById('tlDesc').value;
            if(!date || !desc) return alert('모두 입력해주세요.');
            timelineData.push({date, desc});
            await fetch('/api/settings', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({key:'timeline_data', value:JSON.stringify(timelineData)}) });
            hideModal('addTimelineModal');
            document.getElementById('tlDate').value = '';
            document.getElementById('tlDesc').value = '';
            renderTimeline();
        }

        async function deleteTimelineItem(idx) {
            if(!confirm('삭제하시겠습니까?')) return;
            timelineData.splice(idx, 1);
            await fetch('/api/settings', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({key:'timeline_data', value:JSON.stringify(timelineData)}) });
            renderTimeline();
        }

        let currentImgKey = '';
        function triggerSiteImgUpload(key) {
            currentImgKey = key;
            document.getElementById('siteImgFileInput').click();
        }
        async function handleSiteImgSelected(e) {
            const file = e.target.files[0];
            if(!file || !currentImgKey) return;
            const fd = new FormData();
            fd.append('key', currentImgKey);
            fd.append('image', file);
            const res = await fetch('/api/admin/site-image', { method:'POST', body:fd });
            if(res.ok) loadSettings();
            else alert('업로드에 실패했습니다.');
        }

        // 캘린더
        function renderCalendar() {
            const year = currentCalDate.getFullYear();
            const month = currentCalDate.getMonth();
            const titleEl = document.getElementById('cal-month-year');
            if (titleEl) titleEl.innerText = `${year}. ${String(month+1).padStart(2,'0')}`;
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const grid = document.getElementById('calendar-days');
            if (!grid) return;
            grid.innerHTML = '';
            
            const todayStr = new Date().toISOString().split('T')[0];

            for(let i=0; i<firstDay; i++) {
                grid.innerHTML += `<div class="cal-cell empty"></div>`;
            }
            
            for(let d=1; d<=daysInMonth; d++) {
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const diaryPost = postsData.find(p => {
                    const parts = (p.author||'').split('|');
                    return parts[3] === '다이어리' && parts[4] === dateStr;
                });
                
                const isToday = (dateStr === todayStr) ? 'today' : '';
                const dotHtml = diaryPost ? `<div class="cal-dot"></div>` : '';
                
                grid.innerHTML += `<div class="cal-cell ${isToday}" onclick="handleDayClick('${dateStr}', ${diaryPost ? diaryPost.id : null})">${d}${dotHtml}</div>`;
            }
        }

        function changeMonth(offset) {
            currentCalDate.setMonth(currentCalDate.getMonth() + offset);
            renderCalendar();
        }

        function handleDayClick(dateStr, postId) {
            if(postId) {
                openDetail(postId);
            } else {
                document.getElementById('postDate').value = dateStr;
                document.getElementById('postCategory').value = '다이어리';
                document.getElementById('postTitle').value = `${dateStr}의 일기`;
                document.getElementById('writePanel').classList.remove('hidden');
                document.getElementById('section-board').scrollIntoView({behavior:'smooth'});
            }
        }

        // 게시글 관리
        function openWritePanel() {
            document.getElementById('postDate').value = '';
            document.getElementById('writePanel').classList.toggle('hidden');
        }
        function showModal(id) {
            document.getElementById(id).classList.add('active');
        }
        function hideModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function setCategoryTab(cat) {
            currentTab = cat;
            document.querySelectorAll('.board-tab').forEach(b => b.classList.remove('active'));
            if (event && event.target) event.target.classList.add('active');
            renderPosts();
        }

        async function submitPost() {
            const cat = document.getElementById('postCategory').value;
            const title = document.getElementById('postTitle').value.trim(); 
            const content = document.getElementById('postContent').value.trim();
            const file = document.getElementById('postImage').files[0];
            const dateStr = document.getElementById('postDate').value;

            if(!title) return alert('제목을 입력해주세요.');
            if(cat === '갤러리' && !file) return alert('갤러리는 사진 첨부가 필수입니다!');

            const fd = new FormData();
            fd.append('author', user.fullName || '우리');
            fd.append('username', user.username || 'ourlove');
            fd.append('title', title);
            fd.append('category', cat);
            fd.append('date', dateStr);
            fd.append('content', content);
            if(file) fd.append('image', file);
            
            const res = await fetch('/api/posts', { method: 'POST', body: fd });
            if(res.ok) {
                document.getElementById('writePanel').classList.add('hidden');
                document.getElementById('postTitle').value = '';
                document.getElementById('postContent').value = '';
                document.getElementById('postImage').value = '';
                loadPosts();
            } else {
                alert('저장에 실패했습니다.');
            }
        }

        async function loadPosts() {
            try {
                const [rp, rc] = await Promise.all([fetch('/api/posts'), fetch('/api/comments')]);
                postsData = await rp.json();
                commentsData = await rc.json();
                renderCalendar();
                renderPosts();
            } catch (err) {
                console.error("게시물 로드 실패:", err);
            }
        }

        function renderPosts() {
            const list = document.getElementById('boardList');
            if (!list) return;
            list.innerHTML = '';
            
            const filtered = postsData.filter(p => ((p.author||'').split('|')[3]||'데이트록') === currentTab);
            
            if(filtered.length === 0) {
                list.innerHTML = `<p style="text-align:center; color:#999; padding:40px 0;">작성된 기록이 없습니다.</p>`;
                list.className = '';
                return;
            }

            if(currentTab === '갤러리') {
                list.className = 'masonry-grid';
                filtered.forEach(p => {
                    const parts = (p.author||'').split('|');
                    if(!p.image_url) return;
                    list.innerHTML += `
                        <div class="masonry-item" onclick="openDetail(${p.id})">
                            <img src="${p.image_url}">
                            <div class="masonry-info">
                                <div class="masonry-title">${parts[2]}</div>
                                <div class="masonry-meta"><span>${parts[0]}</span> <span><i class="fa-regular fa-comment"></i> ${commentsData.filter(c=>c.post_id===p.id).length}</span></div>
                            </div>
                        </div>`;
                });
            } else {
                list.className = 'post-list';
                filtered.forEach(p => {
                    const parts = (p.author||'').split('|');
                    list.innerHTML += `
                        <div class="post-item" onclick="openDetail(${p.id})">
                            <div class="post-info">
                                <div class="post-title">${parts[2]}</div>
                                <div class="post-desc">${p.content}</div>
                                <div style="font-size:0.8rem; color:var(--text-muted); margin-top:8px;">${parts[0]} | 댓글 ${commentsData.filter(c=>c.post_id===p.id).length}</div>
                            </div>
                            ${p.image_url ? `<img src="${p.image_url}" style="width:85px; height:85px; border-radius:10px; object-fit:cover;">` : ''}
                        </div>`;
                });
            }
        }

        function openDetail(id) {
            activePost = postsData.find(p => p.id === id);
            if(!activePost) return;
            const parts = (activePost.author||'').split('|');
            document.getElementById('modalCategory').innerText = parts[3]||'기록';
            document.getElementById('modalDateMeta').innerText = (parts[4]||'') ? `${parts[4]} / ${parts[0]}` : parts[0];
            document.getElementById('modalTitle').innerText = parts[2]||'무제';
            document.getElementById('modalContent').innerText = activePost.content;
            document.getElementById('modalImageWrap').innerHTML = activePost.image_url ? `<img src="${activePost.image_url}" style="width:100%; border-radius:12px; margin-top:10px;">` : '';
            showModal('detailModal');
        }

        async function deleteFromDetail() {
            if(!confirm('추억을 삭제하시겠습니까?')) return;
            await fetch('/api/posts', { method:'DELETE', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id: activePost.id}) });
            hideModal('detailModal');
            loadPosts();
        }
    </script>
</body>
</html>
