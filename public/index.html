<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Our Secret Space 💖</title>
    <!-- 브라우저 탭 아이콘 (파비콘) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💖</text></svg>">
    
    <!-- Web Fonts & Icons -->
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Soft Romantic Theme */
            --primary: #FF8282;       
            --primary-light: #FFF0F0; 
            --primary-dark: #E56A6A;
            --secondary: #A0C4E2;     
            --bg-base: #FCF9F6;       
            --surface: rgba(255, 255, 255, 0.95); 
            --text-main: #3D3D3D;
            --text-muted: #9CA3AF;
            --border-light: rgba(255, 130, 130, 0.15);
            --shadow-soft: 0 8px 24px rgba(255, 130, 130, 0.08);
            --shadow-glass: 0 10px 30px rgba(0, 0, 0, 0.05);
            --radius-sm: 16px;
            --radius-md: 24px;
            --radius-lg: 36px;
            --nav-height: 75px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* 100dvh 고정 앱 레이아웃 (하단 메뉴 밀림 방지) */
        body { background: #E5E7EB; color: var(--text-main); overflow: hidden; display: flex; justify-content: center; height: 100dvh; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 130, 130, 0.3); border-radius: 10px; }

        /* 공통 애니메이션 */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeScale { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes pulseAlert { 0% { transform: scale(1); } 50% { transform: scale(1.1); filter: drop-shadow(0 5px 15px rgba(255,130,130,0.5)); } 100% { transform: scale(1); } }
        @keyframes floatUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .fade-up { opacity: 0; transform: translateY(20px); transition: 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
        .fade-up.visible { opacity: 1; transform: translateY(0); }
        .glass { background: var(--surface); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: var(--shadow-glass); }

        /* 앱 컨테이너 */
        #app-wrapper { width: 100%; max-width: 480px; height: 100dvh; display: flex; flex-direction: column; background: var(--bg-base); position: relative; box-shadow: 0 0 40px rgba(0,0,0,0.1); overflow: hidden; }
        body:not(.mobile-frame-mode) #app-wrapper { max-width: 100%; box-shadow: none; }

        /* 편집 모드 */
        .edit-mode-only { display: none !important; }
        body.edit-mode .edit-mode-only { display: flex !important; }
        body.edit-mode .edit-mode-only-inline { display: inline-block !important; }

        /* 헤더 & 뷰 섹션 & 네비게이션 */
        .app-header { flex-shrink: 0; width: 100%; height: 65px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 50; border-bottom: 1px solid rgba(0,0,0,0.03); background: rgba(252, 249, 246, 0.9); backdrop-filter: blur(10px); }
        .header-title { font-weight: 800; font-size: 1.15rem; color: var(--primary); display: flex; align-items: center; gap: 8px; font-family: 'Georgia', serif; font-style: italic; }
        .header-clock { font-size: 0.85rem; font-weight: 500; color: var(--text-muted); font-variant-numeric: tabular-nums; }
        
        .icon-btn { background: none; border: none; font-size: 1.25rem; color: var(--text-muted); cursor: pointer; transition: 0.2s; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .icon-btn:hover, .icon-btn.active { color: var(--primary); background: var(--primary-light); }

        .view-section { flex: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: 30px; display: none; position: relative; scroll-behavior: smooth; }
        .view-section.active { display: block; animation: fadeIn 0.4s ease; }

        .bottom-nav { flex-shrink: 0; width: 100%; height: var(--nav-height); display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); border-top: 1px solid rgba(0,0,0,0.03); background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); z-index: 100; box-shadow: 0 -5px 20px rgba(0,0,0,0.02); }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 33%; height: 100%; color: var(--text-muted); font-size: 0.75rem; font-weight: 700; cursor: pointer; transition: 0.3s; gap: 4px; }
        .nav-item i { font-size: 1.35rem; transition: 0.3s; }
        .nav-item.active { color: var(--primary); }
        .nav-item.active i { transform: translateY(-3px); filter: drop-shadow(0 2px 6px rgba(255,130,130,0.4)); }

        /* 폼 & 모달 & 토스트 */
        .btn-primary { width: 100%; background: var(--primary); color: white; border: none; padding: 16px; border-radius: var(--radius-sm); font-size: 1.05rem; font-weight: 800; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(255,130,130,0.3); display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-primary:active { transform: scale(0.96); box-shadow: none; }
        .btn-outline { background: white; color: var(--text-main); border: 1px solid var(--border-light); font-weight: 700; }
        
        .form-group { margin-bottom: 18px; }
        .form-label { display: block; font-size: 0.9rem; font-weight: 800; color: var(--text-muted); margin-bottom: 8px; }
        .input-wrap { display: flex; align-items: center; background: rgba(255,255,255,0.8); border: 1px solid var(--border-light); border-radius: var(--radius-sm); padding: 5px 15px; transition: 0.3s; }
        .input-wrap:focus-within { border-color: var(--primary); background: white; box-shadow: 0 0 0 3px var(--primary-light); }
        .input-wrap i { color: var(--primary); margin-right: 12px; font-size: 1.1rem; opacity: 0.8; }
        .form-input, .form-textarea, .form-select { flex: 1; width: 100%; padding: 12px 0; border: none; background: transparent; font-size: 1.05rem; outline: none; color: var(--text-main); }
        .form-textarea { resize: vertical; min-height: 120px; padding: 12px 0; }

        /* 세련된 파일 업로드 UI */
        .custom-file-upload { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 20px; background: #FAFAFA; border: 2px dashed #FFB3B3; border-radius: var(--radius-sm); cursor: pointer; transition: 0.3s; color: var(--primary); gap: 10px; font-weight: 700; font-size: 0.95rem; text-align: center; }
        .custom-file-upload:hover, .custom-file-upload:active { background: var(--primary-light); border-color: var(--primary); }
        .custom-file-upload i { font-size: 2.2rem; margin-bottom: 5px; }

        .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); z-index: 3000; display: none; align-items: center; justify-content: center; padding: 20px; opacity: 0; transition: opacity 0.3s ease; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content { width: 100%; max-width: 450px; max-height: 90vh; border-radius: var(--radius-lg); background: white; box-shadow: var(--shadow-glass); display: flex; flex-direction: column; transform: scale(0.95) translateY(20px); transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); overflow: hidden; }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); }
        .modal-header { padding: 25px 30px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-light); }
        .modal-body { padding: 25px 30px; overflow-y: auto; }
        .btn-close { background: #F3F4F6; border: none; font-size: 1.2rem; color: var(--text-main); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }

        .toast { position: absolute; bottom: calc(var(--nav-height) + 20px); left: 50%; transform: translateX(-50%) translateY(50px); background: rgba(30, 30, 30, 0.95); backdrop-filter: blur(10px); color: white; padding: 14px 25px; border-radius: 30px; font-size: 0.95rem; font-weight: 700; opacity: 0; transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 10000; display: flex; gap: 10px; align-items: center; white-space: nowrap; box-shadow: 0 10px 30px rgba(0,0,0,0.2); pointer-events: none; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* 인증 및 역할 선택 */
        #auth-layer { position: absolute; inset: 0; background: url('https://images.unsplash.com/photo-1518621736915-f3b1c41bfd00?q=80&w=1920&auto=format&fit=crop') center/cover; z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; transition: 0.5s ease; }
        #auth-layer::before { content: ''; position: absolute; inset: 0; background: rgba(255,255,255,0.8); backdrop-filter: blur(15px); }
        
        .auth-panel { position: relative; z-index: 1; padding: 40px 30px; border-radius: var(--radius-lg); width: 85%; max-width: 380px; text-align: center; display: none; }
        .auth-panel.active { display: block; animation: fadeScale 0.4s ease; }
        
        .role-btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .role-btn { padding: 25px 10px; border-radius: var(--radius-md); border: 2px solid var(--border-light); background: white; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; align-items: center; gap: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.02); }
        .role-btn img { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; border: 3px solid #eee; }
        .role-btn span { font-weight: 800; font-size: 1.1rem; color: var(--text-main); }
        .role-btn.boy:active, .role-btn.boy:hover { border-color: var(--secondary); background: var(--secondary-light); transform: translateY(-3px); }
        .role-btn.boy:hover img { border-color: var(--secondary); }
        .role-btn.girl:active, .role-btn.girl:hover { border-color: var(--primary); background: var(--primary-light); transform: translateY(-3px); }
        .role-btn.girl:hover img { border-color: var(--primary); }

        /* 홈 화면 */
        .container { padding: 20px; }
        .banner-wrap { position: relative; width: 100%; height: 350px; border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 25px; box-shadow: var(--shadow-card); cursor: zoom-in; }
        .banner-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.5s ease; z-index: 1; }
        .banner-img.active { opacity: 1; z-index: 2; }
        .banner-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 60%); z-index: 3; }
        .banner-content { position: absolute; bottom: 25px; left: 0; width: 100%; text-align: center; color: white; z-index: 4; }
        .dday-badge { display: inline-block; background: rgba(255,255,255,0.25); backdrop-filter: blur(10px); padding: 6px 16px; border-radius: 20px; font-size: 0.9rem; font-weight: 800; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.4); }
        .dday-num { font-size: 4rem; font-weight: 800; font-family: 'Georgia', serif; line-height: 1; margin-bottom: 5px; text-shadow: 0 4px 15px rgba(0,0,0,0.2); }

        .widget-card { border-radius: var(--radius-md); padding: 25px; margin-bottom: 20px; background: white; border: 1px solid rgba(0,0,0,0.02); box-shadow: var(--shadow-card); }
        .widget-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; color: var(--text-main); }
        
        /* 다가오는 일정 알림 (홈 내부) */
        .upcoming-toast { background: white; padding: 20px; border-radius: var(--radius-md); margin-bottom: 20px; display: none; align-items: center; gap: 15px; box-shadow: var(--shadow-card); border-left: 5px solid var(--secondary); animation: floatUp 0.6s ease; }
        .upcoming-toast.show { display: flex; }

        .timeline-box { max-height: 280px; overflow-y: auto; padding-right: 5px; }
        .tl-item { display: flex; gap: 15px; margin-bottom: 20px; position: relative; }
        .tl-line { position: absolute; left: 5px; top: 25px; bottom: -20px; width: 2px; background: var(--border-light); }
        .tl-item:last-child .tl-line { display: none; }
        .tl-dot { width: 12px; height: 12px; background: var(--primary); border-radius: 50%; z-index: 2; margin-top: 5px; box-shadow: 0 0 0 4px var(--primary-light); }
        .tl-content { flex: 1; background: #FAFAFA; padding: 16px 20px; border-radius: 16px; font-size: 1.05rem; color: var(--text-main); font-weight: 500; border: 1px solid var(--border-light); }

        /* 캘린더 화면 */
        .cal-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 0 5px; }
        .cal-month-title { font-size: 1.6rem; font-weight: 800; font-family: 'Georgia', serif; }
        .cal-nav-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border-light); background: white; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.02); transition: 0.2s; }
        .cal-nav-btn:active { background: var(--border-light); }
        
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 20px 15px; background: white; border-radius: var(--radius-lg); box-shadow: var(--shadow-card); border: 1px solid var(--border-light); touch-action: pan-y; }
        .cal-day-name { text-align: center; font-weight: 800; font-size: 0.85rem; padding-bottom: 10px; border-bottom: 1px solid var(--border-light); margin-bottom: 5px; color: var(--text-muted); }
        
        .cal-cell { min-height: 55px; display: flex; flex-direction: column; align-items: center; padding: 6px 2px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 1.05rem; position: relative; border: 2px solid transparent; transition: 0.2s; }
        .cal-cell:active { background: #F3F4F6; transform: scale(0.95); }
        .cal-cell.today { background: var(--primary-light); color: var(--primary-dark); }
        .cal-cell.selected { border-color: var(--primary); background: #FFF; }
        .cal-cell.holiday { color: #E53E3E !important; }
        .cal-cell.saturday { color: #3182CE; }
        
        .cal-holiday-name { font-size: 0.65rem; color: #E53E3E; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; font-weight: 800; }
        
        /* 캘린더 색상 도트/라벨 */
        .event-mini-label { font-size: 0.6rem; font-weight: 800; color: white; border-radius: 6px; padding: 2px 5px; margin-top: 2px; max-width: 95%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* 다이렉트 인라인 뷰 (달력 아래 열림) */
        .cal-inline-view { max-height: 0; overflow: hidden; opacity: 0; transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); margin-top: 15px; background: white; border-radius: var(--radius-lg); border: 1px solid var(--border-light); }
        .cal-inline-view.active { max-height: 600px; opacity: 1; padding: 25px; box-shadow: var(--shadow-card); }
        
        .day-entry-item { background: #F8F9FA; padding: 16px 20px; border-radius: 16px; margin-bottom: 12px; cursor: pointer; border-left: 5px solid #ccc; display: flex; align-items: center; gap: 15px; transition: 0.2s; }
        .day-entry-item:active { background: #F1F3F5; transform: scale(0.98); }
        
        .color-picker { display: flex; gap: 12px; margin-top: 12px; }
        .color-opt { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: 0.2s; }
        .color-opt.active { border-color: var(--text-main); transform: scale(1.1); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        /* 게시판 & 스토리 */
        .board-tabs { display: flex; gap: 12px; margin-bottom: 25px; overflow-x: auto; padding-bottom: 5px; }
        .board-tab { background: none; border: none; font-size: 1.1rem; font-weight: 800; color: var(--text-muted); cursor: pointer; padding: 8px 6px; position: relative; white-space: nowrap; transition: 0.2s; }
        .board-tab.active { color: var(--text-main); }
        .board-tab.active::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 100%; height: 4px; background: var(--primary); border-radius: 4px; }

        .post-card { background: white; border-radius: var(--radius-md); padding: 22px; margin-bottom: 15px; border: 1px solid var(--border-light); cursor: pointer; box-shadow: var(--shadow-card); display: flex; gap: 15px; transition: 0.2s; }
        .post-card:active { transform: scale(0.98); }
        .post-text-wrap { flex-grow: 1; overflow: hidden; }
        .post-cat-badge { background: var(--primary-light); color: var(--primary-dark); padding: 5px 12px; border-radius: 12px; font-size: 0.8rem; font-weight: 800; display: inline-block; margin-bottom: 8px; }
        .post-title { font-size: 1.25rem; font-weight: 800; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
        .post-preview { font-size: 1rem; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.5; margin-bottom: 12px; }
        .post-thumb { width: 110px; height: 110px; border-radius: 16px; object-fit: cover; flex-shrink: 0; }
        
        .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .gallery-item { border-radius: var(--radius-md); overflow: hidden; cursor: pointer; position: relative; aspect-ratio: 1/1; box-shadow: var(--shadow-card); }
        .gallery-item img, .gallery-item video { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }
        .gallery-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.6), transparent); display: flex; align-items: flex-end; padding: 15px; color: white; font-weight: 800; opacity: 0; transition: 0.3s; }
        .gallery-item:active img { transform: scale(1.05); }
        .gallery-item:active .gallery-overlay { opacity: 1; }

        .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 25px; }
        .page-btn { width: 38px; height: 38px; border-radius: 50%; background: white; border: 1px solid var(--border-light); color: var(--text-muted); font-weight: 800; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.02); display: flex; align-items: center; justify-content: center; }
        .page-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 15px rgba(255,130,130,0.3); }

        .fab { position: absolute; bottom: calc(var(--nav-height) + 20px); right: 20px; width: 60px; height: 60px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; box-shadow: var(--shadow-float); border: none; z-index: 90; cursor: pointer; transition: 0.2s; }
        .fab:active { transform: scale(0.9) rotate(45deg); }

        /* 인라인 댓글 */
        .inline-comments { background: #FAFAFA; padding: 16px; border-radius: 16px; margin-top: 15px; border-top: 1px dashed var(--border-light); }
        .inline-comment-item { display: flex; justify-content: space-between; font-size: 0.95rem; margin-bottom: 8px; align-items: flex-start; }
        .inline-comment-input-wrap { display: flex; gap: 8px; margin-top: 12px; }
        .inline-comment-input-wrap input { flex-grow: 1; padding: 12px 16px; border: 1px solid var(--border-light); border-radius: 12px; outline: none; background: white; font-size: 0.95rem; }
        .inline-comment-input-wrap button { padding: 0 20px; background: var(--text-main); color: white; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; }

        /* 상세 보기 뷰어 */
        .detail-meta-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border-light); padding-bottom: 15px; }
        .detail-img-wrap img, .detail-img-wrap video { width: 100%; border-radius: 16px; margin-bottom: 25px; cursor: zoom-in; }
        .detail-content { font-size: 1.1rem; line-height: 1.8; color: #4A5568; white-space: pre-wrap; margin-bottom: 30px; }

        #lightbox { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 6000; align-items: center; justify-content: center; opacity: 0; transition: 0.3s ease; }
        #lightbox img, #lightbox video { max-width: 95vw; max-height: 95vh; border-radius: 16px; object-fit: contain; }
    </style>
</head>
<body>

    <!-- 전역 모달 및 토스트 -->
    <div id="toast" class="toast"><i class="fa-solid fa-heart" style="color:var(--primary);"></i> <span id="toastMsg">메시지</span></div>

    <!-- 커스텀 Confirm -->
    <div class="modal-overlay" id="confirmModal" style="z-index: 5000;">
        <div class="modal-content glass" style="max-width: 320px; text-align: center; padding: 35px 25px;">
            <i class="fa-solid fa-circle-exclamation" style="font-size: 3rem; color: var(--primary); margin-bottom: 20px;"></i>
            <h3 style="font-size: 1.2rem; font-weight: 800; margin-bottom: 25px; color: var(--text-main);" id="confirmMsg">삭제하시겠습니까?</h3>
            <div style="display: flex; gap: 10px; width: 100%;">
                <button class="btn-primary" style="background: #F1F3F5; color: var(--text-main); flex: 1;" id="confirmBtnNo">취소</button>
                <button class="btn-primary" style="flex: 1;" id="confirmBtnYes">확인</button>
            </div>
        </div>
    </div>

    <!-- 앱 레이아웃 -->
    <div id="app-wrapper">
        
        <!-- 1. 시크릿 로그인 & 역할 선택 월 (통합) -->
        <div id="auth-layer">
            
            <!-- 비밀번호 패널 -->

    <script>
        /* =========================================================
           1. 상태 변수 및 유틸리티
           ========================================================= */
        let user = null;
        let authorName = localStorage.getItem('app_author') || '';
        let postsData = JSON.parse(localStorage.getItem('app_posts') || '[]');
        let commentsData = JSON.parse(localStorage.getItem('app_comments') || '[]');
        let timelineData = JSON.parse(localStorage.getItem('app_timeline') || '[{"date":"2026-01-01", "desc":"우리의 첫 만남 💖"}]');
        let settings = JSON.parse(localStorage.getItem('app_settings') || '{"dday":"", "holidays":""}');
        
        let currentBoardTab = '전체';
        let currentFilteredPosts = [];
        let currentPage = 1;
        const postsPerPage = 5;
        let activePostId = null;
        let confirmAction = null;
        let isHybridMode = localStorage.getItem('hybrid_mode') === 'true';

        // 2026년 기준 한국 법정 공휴일 (음력/양력 포함)
        const koreanHolidays = {
            "01-01": "신정", "02-16": "설날 연휴", "02-17": "설날", "02-18": "설날 연휴",
            "03-01": "삼일절", "05-05": "어린이날", "05-24": "부처님오신날", "06-06": "현충일",
            "08-15": "광복절", "09-24": "추석 연휴", "09-25": "추석", "09-26": "추석 연휴",
            "10-03": "개천절", "10-09": "한글날", "12-25": "크리스마스"
        };
        let customHolidays = {}; // 설정에서 파싱됨

        if(isHybridMode) document.body.classList.add('mobile-frame-mode');

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function showModal(id) { 
            const el = document.getElementById(id);
            el.style.display = 'flex'; void el.offsetWidth; el.classList.add('active');
        }
        function hideModal(id) { 
            const el = document.getElementById(id);
            el.classList.remove('active');
            setTimeout(() => { if(!el.classList.contains('active')) el.style.display = 'none'; }, 300);
        }

        function customConfirm(msg, callback) {
            document.getElementById('confirmMsg').innerText = msg;
            confirmAction = callback;
            showModal('confirmModal');
        }
        document.getElementById('confirmBtnYes').onclick = () => { if(confirmAction) confirmAction(); hideModal('confirmModal'); };
        document.getElementById('confirmBtnNo').onclick = () => hideModal('confirmModal');

        function openLightbox(url) {
            const ext = url.split('.').pop().toLowerCase();
            let html = '';
            if(['mp4','webm','ogg'].includes(ext)) {
                html = `<video src="${url}" controls autoplay style="max-width:95vw; max-height:95vh; border-radius:16px;"></video>`;
            } else {
                html = `<img src="${url}" style="max-width:95vw; max-height:95vh; border-radius:16px; object-fit:contain;">`;
            }
            document.getElementById('lightboxContent').innerHTML = html;
            const lb = document.getElementById('lightbox');
            lb.style.display = 'flex'; void lb.offsetWidth; lb.style.opacity = '1';
        }
        function closeLightbox() {
            const lb = document.getElementById('lightbox');
            lb.style.opacity = '0';
            document.getElementById('lightboxContent').innerHTML = '';
            setTimeout(() => { lb.style.display = 'none'; }, 300);
        }

        function formatDate(date) {
            const d = new Date(date);
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
        }

        function getMediaHTML(url) {
            if(!url) return '';
            const ext = url.split('.').pop().toLowerCase();
            if(['mp4', 'webm', 'ogg'].includes(ext)) {
                return `<video controls src="${url}"></video>`;
            } else if(['mp3', 'wav', 'm4a'].includes(ext)) {
                return `<audio controls src="${url}" style="width:100%; margin-bottom:20px; outline:none;"></audio>`;
            } else {
                return `<img src="${url}" onclick="openLightbox('${url}')">`;
            }
        }

        /* =========================================================
           2. 인증 및 진입 제어 (2단계)
           ========================================================= */
        window.onload = () => {
            const isAuth = localStorage.getItem('app_auth');
            if(isAuth === 'true') {
                document.getElementById('auth-wall').style.display = 'none';
                if(!authorName) {
                    document.getElementById('auth-layer').style.display = 'flex';
                    document.getElementById('authPwPanel').classList.remove('active');
                    document.getElementById('authRolePanel').classList.add('active');
                } else {
                    document.getElementById('auth-layer').style.display = 'none';
                    document.getElementById('app-container').style.display = 'flex';
                    initApp();
                }
            }
        };

        function submitPassword() {
            const pw = document.getElementById('l_pw').value.trim();
            if(pw === '1004') {
                localStorage.setItem('app_auth', 'true');
                // 비밀번호 패널 숨기고 역할 선택 패널 띄우기
                document.getElementById('authPwPanel').classList.remove('active');
                setTimeout(() => document.getElementById('authRolePanel').classList.add('active'), 300);
            } else {
                showToast('암호가 틀렸습니다. 다시 시도해 주세요.');
            }
        }

        function setAuthorName(name) {
            authorName = name; localStorage.setItem('app_author', name);
            document.getElementById('auth-layer').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('auth-layer').style.display = 'none';
                document.getElementById('app-container').style.display = 'flex';
                initApp();
                showToast(`${name} 환영해! 💖`);
            }, 500);
        }

        function handleLogout() { localStorage.removeItem('app_auth'); location.reload(); }

        /* =========================================================
           3. 초기화 & 홈 화면 기능
           ========================================================= */
        function initApp() {
            startClock(); applySettings(); renderTimeline(); startBannerSlider(); checkUpcomingEvents();
            document.getElementById('hybridToggleBtn').innerText = `현재: ${isHybridMode ? 'ON' : 'OFF'}`;
            document.querySelector('.nav-item').click();
        }

        function switchView(viewId, btnEl) {
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            if(btnEl) btnEl.classList.add('active');
            
            document.querySelectorAll('.view-section').forEach(sec => {
                sec.classList.remove('active'); sec.style.animation = 'none'; void sec.offsetWidth;
            });
            const target = document.getElementById(`view-${viewId}`);
            if(target) target.classList.add('active');
            
            if(viewId === 'calendar') { renderCalendar(); closeInlineView(); }
            if(viewId === 'board') processFilteredPosts();
            
            const container = document.getElementById('app-wrapper');
            container.scrollTo(0,0);
        }

        function startClock() {
            setInterval(() => {
                const now = new Date(); const days = ['일','월','화','수','목','금','토'];
                document.getElementById('top-clock').innerText = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} (${days[now.getDay()]}) ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
            }, 1000);
        }

        function toggleEditMode() {
            document.body.classList.toggle('edit-mode');
            showToast(document.body.classList.contains('edit-mode') ? "편집 모드 ON ⚙️" : "편집 모드 OFF");
        }

        function toggleHybridMode() {
            isHybridMode = !isHybridMode; localStorage.setItem('hybrid_mode', isHybridMode);
            if(isHybridMode) document.body.classList.add('mobile-frame-mode');
            else document.body.classList.remove('mobile-frame-mode');
            document.getElementById('hybridToggleBtn').innerText = `현재: ${isHybridMode ? 'ON' : 'OFF'}`;
            showToast("화면 모드가 변경되었습니다.");
        }

        let currentSlide = 0; const banners = document.querySelectorAll('.banner-img');
        function startBannerSlider() { 
            setInterval(() => {
                banners.forEach(b => b.classList.remove('active'));
                currentSlide = (currentSlide + 1) % banners.length;
                if(banners[currentSlide]) banners[currentSlide].classList.add('active');
            }, 5000); 
        }

        // 다가오는 일정(토스트) 체크
        function checkUpcomingEvents() {
            const today = new Date(); today.setHours(0,0,0,0);
            const nextWeek = new Date(today.getTime() + 7 * 24 * 60 * 60 * 1000);
            
            const upcoming = postsData.filter(p => {
                if(p.category !== '일정' || !p.date) return false;
                const pDate = new Date(p.date);
                return pDate >= today && pDate <= nextWeek;
            }).sort((a,b) => new Date(a.date) - new Date(b.date));

            if(upcoming.length > 0) {
                const ev = upcoming[0];
                const diff = Math.ceil((new Date(ev.date) - today) / (1000 * 3600 * 24));
                const dText = diff === 0 ? '오늘' : diff === 1 ? '내일' : `${diff}일 뒤`;
                document.getElementById('upcomingText').innerText = `${dText}: ${ev.title}`;
                document.getElementById('upcomingToast').classList.add('show');
            } else {
                document.getElementById('upcomingToast').classList.remove('show');
            }
        }
        function closeUpcomingToast() { document.getElementById('upcomingToast').classList.remove('show'); }

        /* =========================================================
           4. 설정 및 타임라인 데이터
           ========================================================= */
        function applySettings() {
            document.getElementById('settingDday').value = settings.dday || '';
            document.getElementById('settingHolidays').value = settings.holidays || '';
            
            if(settings.dday) {
                const diff = Math.ceil(Math.abs(new Date() - new Date(settings.dday)) / (1000 * 60 * 60 * 24));
                document.getElementById('ddayText').innerText = `D+${diff}`;
            }

            // 커스텀 휴일 파싱 (형식: "10-04:수진생일, 12-25:크리스마스")
            customHolidays = {};
            if(settings.holidays) {
                settings.holidays.split(',').forEach(item => {
                    const parts = item.split(':');
                    if(parts.length >= 1) {
                        const date = parts[0].trim();
                        const name = parts[1] ? parts[1].trim() : '기념일';
                        customHolidays[date] = name;
                    }
                });
            }
        }

        function saveSettings() {
            settings.dday = document.getElementById('settingDday').value;
            settings.holidays = document.getElementById('settingHolidays').value;
            localStorage.setItem('app_settings', JSON.stringify(settings));
            hideModal('settingsModal'); applySettings(); showToast("설정이 저장되었습니다.");
            if(document.getElementById('view-calendar').classList.contains('active')) renderCalendar();
        }

        function renderTimeline() {
            timelineData.sort((a,b) => new Date(b.date) - new Date(a.date));
            document.getElementById('timelineList').innerHTML = timelineData.map((t, idx) => `
                <div class="tl-item">
                    <div class="tl-line"></div><div class="tl-dot"></div>
                    <div class="tl-content">
                        <div class="tl-date">${t.date}</div>
                        <div style="font-weight:700;">${t.desc} <button class="edit-mode-only-inline" style="border:none;background:none;color:#FC8181;margin-left:5px;cursor:pointer;" onclick="customConfirm('기록을 삭제할까요?', () => deleteTimelineItem(${idx}))"><i class="fa-solid fa-xmark"></i></button></div>
                    </div>
                </div>
            `).join('');
        }

        function addTimeline() {
            const date = document.getElementById('tlDate').value; const desc = document.getElementById('tlDesc').value;
            if(!date || !desc) return showToast('모두 입력해주세요.');
            timelineData.push({date, desc}); 
            localStorage.setItem('app_timeline', JSON.stringify(timelineData));
            hideModal('addTimelineModal'); document.getElementById('tlDate').value=''; document.getElementById('tlDesc').value=''; renderTimeline(); showToast("역사가 기록되었습니다.");
        }

        function deleteTimelineItem(idx) { 
            timelineData.splice(idx, 1); 
            localStorage.setItem('app_timeline', JSON.stringify(timelineData)); renderTimeline(); showToast("삭제되었습니다."); 
        }

        /* =========================================================
           5. 캘린더 시스템
           ========================================================= */
        let currentCalDate = new Date();
        
        function renderCalendar() {
            const year = currentCalDate.getFullYear(); const month = currentCalDate.getMonth();
            document.getElementById('cal-month-year').innerText = `${year}. ${String(month+1).padStart(2,'0')}`;
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const grid = document.getElementById('calendar-days');
            
            const daysArr = ['일','월','화','수','목','금','토'];
            let html = daysArr.map((d,i) => `<div class="cal-day-name" style="${i===0?'color:#E53E3E':(i===6?'color:#3182CE':'')}">${d}</div>`).join('');
            const todayStr = new Date().toISOString().split('T')[0];

            for(let i=0; i<firstDay; i++) html += `<div class="cal-cell empty"></div>`;
            
            for(let d=1; d<=daysInMonth; d++) {
                const mmdd = `${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const dateStr = `${year}-${mmdd}`;
                
                let classes = ['cal-cell'];
                if(dateStr === todayStr) classes.push('today');
                
                const dayOfWeek = new Date(year, month, d).getDay();
                
                // 휴일 체크 (기본 공휴일 + 커스텀 휴일)
                let holName = '';
                if(koreanHolidays[mmdd]) holName = koreanHolidays[mmdd];
                if(customHolidays[mmdd]) holName = customHolidays[mmdd];
                if(customHolidays[dateStr]) holName = customHolidays[dateStr]; // 연도 포함 지정 시
                
                if(dayOfWeek === 0 || holName !== '') classes.push('holiday');
                else if(dayOfWeek === 6) classes.push('saturday');

                // 해당 날짜의 다이어리/일정 탐색
                const dayEvents = postsData.filter(p => (p.category === '다이어리' || p.category === '일정') && p.date === dateStr);
                
                let markersHtml = '';
                dayEvents.slice(0, 2).forEach(ev => {
                    const bg = ev.color || (ev.category==='일정'?'#A0C4E2':'#FF8282');
                    markersHtml += `<div class="event-mini-label" style="background:${bg};">${ev.title}</div>`;
                });
                if(dayEvents.length > 2) markersHtml += `<div style="font-size:0.6rem; color:var(--text-muted); font-weight:700;">+${dayEvents.length-2}</div>`;

                html += `<div class="${classes.join(' ')}" onclick="openInlineView(this, '${dateStr}')">
                    <span style="z-index:2;">${d}</span>
                    <div class="cal-holiday-name">${holName}</div>
                    <div style="width:100%; display:flex; flex-direction:column; align-items:center; gap:2px; margin-top:auto; padding-bottom:2px;">${markersHtml}</div>
                </div>`;
            }
            grid.innerHTML = html;
        }

        function changeMonth(offset) { 
            currentCalDate.setMonth(currentCalDate.getMonth() + offset); 
            renderCalendar(); closeInlineView();
        }

        function openInlineView(cellEl, dateStr) {
            document.querySelectorAll('.cal-cell').forEach(c => c.classList.remove('selected'));
            cellEl.classList.add('selected');

            document.getElementById('inlineDateHdn').value = dateStr;
            const parts = dateStr.split('-');
            document.getElementById('inlineViewTitle').innerText = `${parts[0]}년 ${parts[1]}월 ${parts[2]}일`;
            
            const dayEvents = postsData.filter(p => (p.category === '다이어리' || p.category === '일정') && p.date === dateStr);
            const listEl = document.getElementById('inlineEntryList');
            
            if(dayEvents.length === 0) {
                listEl.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:30px 0;">등록된 기록이 없습니다.</p>`;
            } else {
                // 클릭 이벤트 전파 방지를 통해 모달 열기 정상화
                listEl.innerHTML = dayEvents.map(e => {
                    const bg = e.color || (e.category==='일정'?'#A0C4E2':'#FF8282');
                    return `
                        <div class="day-entry-item" style="border-left-color:${bg};" onclick="event.stopPropagation(); openDetailById('${e.id}')">
                            <span class="badge" style="background:${bg}30; color:${bg};">${e.category}</span>
                            <div style="font-weight:800; font-size:1.1rem; color:var(--text-main); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${e.title}</div>
                            <i class="fa-solid fa-chevron-right" style="color:var(--text-muted);"></i>
                        </div>
                    `;
                }).join('');
            }
            document.getElementById('calInlineView').classList.add('active');
        }

        function closeInlineView() {
            document.getElementById('calInlineView').classList.remove('active');
            document.querySelectorAll('.cal-cell').forEach(c => c.classList.remove('selected'));
        }

        /* =========================================================
           6. 글쓰기 로직
           ========================================================= */
        function toggleDateInput() {
            const cat = document.getElementById('postCategory').value;
            const dateWrap = document.getElementById('dateInputWrap');
            if(cat === '다이어리' || cat === '일정') {
                dateWrap.style.display = 'block';
            } else {
                dateWrap.style.display = 'none';
            }
        }

        function selectColor(el) {
            document.querySelectorAll('.color-opt').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('postColor').value = el.getAttribute('data-color');
        }

        function openWriteModal(catDefault, dateDefault) { 
            closeInlineView();
            document.getElementById('postCategory').value = catDefault || '일상';
            document.getElementById('postDate').value = dateDefault || new Date().toISOString().split('T')[0];
            document.getElementById('postTitle').value = '';
            document.getElementById('postContent').value = '';
            document.getElementById('postImage').value = '';
            document.getElementById('fileNameDisplay').innerText = '사진이나 영상을 선택해주세요';
            toggleDateInput(); 
            showModal('writeModal'); 
        }

        function submitPost() {
            const cat = document.getElementById('postCategory').value; 
            const title = document.getElementById('postTitle').value.trim(); 
            const content = document.getElementById('postContent').value.trim(); 
            const dateStr = document.getElementById('postDate').value || new Date().toISOString().split('T')[0];
            const color = document.getElementById('postColor').value;
            const file = document.getElementById('postImage').files[0];

            if(!title) return showToast('제목을 입력하세요.');
            if(cat === '갤러리' && !file) return showToast('갤러리는 사진 첨부가 필수입니다!');

            // 파일 URL 생성 (로컬 테스트용)
            let imgUrl = '';
            if(file) {
                // 실제 서비스 시 FileReader 또는 URL.createObjectURL을 서버업로드로 대체해야함.
                imgUrl = URL.createObjectURL(file); 
            } else if(cat === '갤러리') {
                imgUrl = 'https://images.unsplash.com/photo-1518199268839-497c413d806a?q=80&w=800&auto=format&fit=crop';
            }

            const newPost = {
                id: Date.now().toString(),
                author: authorName || '우리',
                title: title,
                category: cat,
                date: (cat==='다이어리'||cat==='일정') ? dateStr : '',
                color: color,
                content: content,
                image_url: imgUrl,
                created_at: formatDate(new Date())
            };
            
            postsData.unshift(newPost); 
            localStorage.setItem('app_posts', JSON.stringify(postsData));
            
            hideModal('writeModal'); showToast("기록이 저장되었습니다! 💖");
            
            if(document.getElementById('view-calendar').classList.contains('active')) { renderCalendar(); checkUpcomingEvents(); }
            if(document.getElementById('view-board').classList.contains('active')) processFilteredPosts();
        }

        /* =========================================================
           7. 스토리 게시판
           ========================================================= */
        function setBoardCategory(cat, btnEl) { 
            currentBoardTab = cat; currentPage = 1;
            document.querySelectorAll('.board-tab').forEach(b => b.classList.remove('active')); btnEl.classList.add('active'); 
            processFilteredPosts(); 
        }

        function processFilteredPosts() {
            const list = document.getElementById('boardList'); const pageArea = document.getElementById('paginationArea');
            list.innerHTML = ''; pageArea.innerHTML = '';
            
            currentFilteredPosts = postsData.filter(p => {
                if(currentBoardTab === '전체') return p.category !== '다이어리' && p.category !== '일정';
                return p.category === currentBoardTab;
            });
            
            if(currentFilteredPosts.length === 0) { list.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:50px 0;">등록된 기록이 없습니다.</p>`; list.className=''; return; }

            const totalPages = Math.ceil(currentFilteredPosts.length / postsPerPage);
            const startIndex = (currentPage - 1) * postsPerPage;
            const paginatedPosts = currentFilteredPosts.slice(startIndex, startIndex + postsPerPage);

            if(currentBoardTab === '갤러리') {
                list.className = 'gallery-grid';
                paginatedPosts.forEach((p) => {
                    if(!p.image_url) return;
                    list.innerHTML += `
                        <div class="gallery-item glass" onclick="openDetailById('${p.id}')">
                            ${getMediaHTML(p.image_url)}
                            <div class="gallery-overlay"><span>${p.title}</span></div>
                        </div>`;
                });
            } else {
                list.className = 'post-list';
                paginatedPosts.forEach((p) => {
                    const postComments = commentsData.filter(c => c.post_id === p.id);
                    const previewComments = postComments.slice(-3);
                    let inlineHtml = previewComments.map(c => `
                        <div class="inline-comment-item">
                            <div><span class="inline-comment-author">${c.author}</span><span style="color:var(--text-main); font-size:0.95rem;">${c.content}</span></div>
                            <span class="inline-comment-time">${(c.created_at||'').slice(5,16)}</span>
                        </div>
                    `).join('');
                    
                    if(!inlineHtml) inlineHtml = `<div style="font-size:0.85rem; color:var(--text-muted);">첫 댓글을 남겨보세요.</div>`;

                    list.innerHTML += `
                        <div class="post-card glass">
                            <div class="post-text-wrap">
                                <div onclick="openDetailById('${p.id}')">
                                    <div><span class="post-cat-badge">${p.category}</span></div>
                                    <div class="post-title">${p.title}</div>
                                    <div class="post-preview">${p.content}</div>
                                    <div class="post-timestamp">${p.created_at || ''} · ${p.author}</div>
                                </div>
                                <div class="inline-comments">
                                    <div style="font-size:0.85rem; font-weight:800; color:var(--primary); margin-bottom:10px;"><i class="fa-regular fa-comment-dots"></i> 댓글 (${postComments.length})</div>
                                    ${inlineHtml}
                                    <div class="inline-comment-input-wrap">
                                        <input type="text" id="inline-comment-${p.id}" placeholder="따뜻한 한마디..." onkeydown="if(event.key==='Enter') submitInlineComment('${p.id}')">
                                        <button onclick="submitInlineComment('${p.id}')">등록</button>
                                    </div>
                                </div>
                            </div>
                            ${p.image_url ? `<div style="width:110px; height:110px; flex-shrink:0;">${getMediaHTML(p.image_url)}</div>` : ''}
                        </div>`;
                });
            }

            if (totalPages > 1) {
                let pageHtml = '';
                for(let i=1; i<=totalPages; i++) pageHtml += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
                pageArea.innerHTML = pageHtml;
            }
        }

        function goToPage(num) {
            currentPage = num; processFilteredPosts();
            const container = document.getElementById('view-board');
            container.scrollTo({top:0, behavior:'smooth'});
        }

        function submitInlineComment(postId) {
            const input = document.getElementById(`inline-comment-${postId}`); const content = input.value.trim();
            if (!content) return;
            commentsData.push({ id: Date.now().toString(), post_id: postId, author: authorName || '우리', content: content, created_at: formatDate(new Date()) });
            localStorage.setItem('app_comments', JSON.stringify(commentsData));
            processFilteredPosts(); showToast('댓글이 등록되었습니다.');
        }

        /* =========================================================
           8. 상세 뷰 및 댓글
           ========================================================= */
        function openDetailById(id) {
            const p = postsData.find(item => item.id === id); if(!p) return;
            activePostId = id;
            document.getElementById('modalCategory').innerText = p.category;
            document.getElementById('modalDateMeta').innerText = p.date ? `일정/다이어리: ${p.date}` : p.created_at;
            document.getElementById('modalAuthor').innerText = p.author;
            document.getElementById('modalTitle').innerText = p.title;
            document.getElementById('modalContent').innerText = p.content;
            document.getElementById('modalImageWrap').innerHTML = getMediaHTML(p.image_url);
            
            renderComments(); showModal('detailModal');
        }

        function renderComments() {
            if(!activePostId) return;
            const postComments = commentsData.filter(c => c.post_id === activePostId);
            document.getElementById('modalCommentsHeader').innerHTML = `댓글 <span style="color:var(--primary);">${postComments.length}</span>`;
            document.getElementById('modalCommentsList').innerHTML = postComments.map(c => `
                <div style="display:flex; justify-content:space-between; font-size:0.95rem; border-bottom:1px solid var(--border-light); padding-bottom:10px;">
                    <div><b style="color:var(--text-main); margin-right:8px;">${c.author}</b> <span style="color:#4A5568;">${c.content}</span><br><span style="font-size:0.75rem; color:var(--text-muted);">${c.created_at||''}</span></div>
                    ${(document.body.classList.contains('edit-mode') || c.author === authorName) ? `<button style="background:none; border:none; color:var(--holiday); cursor:pointer; padding:5px;" onclick="customConfirm('댓글을 지울까요?', () => deleteComment('${c.id}'))"><i class="fa-solid fa-xmark"></i></button>` : ''}
                </div>
            `).join('');
            document.getElementById('modal-comment-input').value = '';
        }

        function submitComment() {
            if(!activePostId) return;
            const content = document.getElementById('modal-comment-input').value.trim(); if (!content) return;
            commentsData.push({ id: Date.now().toString(), post_id: activePostId, author: authorName || '우리', content: content, created_at: formatDate(new Date()) });
            localStorage.setItem('app_comments', JSON.stringify(commentsData));
            renderComments();
            if(document.getElementById('view-board').classList.contains('active')) processFilteredPosts();
        }
        
        function deleteComment(id) {
            commentsData = commentsData.filter(c => c.id !== id); 
            localStorage.setItem('app_comments', JSON.stringify(commentsData));
            renderComments(); processFilteredPosts(); showToast('삭제되었습니다.');
        }

        function deleteActivePost() {
            customConfirm("추억을 완전히 삭제할까요?", () => {
                postsData = postsData.filter(p => p.id !== activePostId);
                commentsData = commentsData.filter(c => c.post_id !== activePostId);
                localStorage.setItem('app_posts', JSON.stringify(postsData));
                localStorage.setItem('app_comments', JSON.stringify(commentsData));
                hideModal('detailModal');
                
                if(document.getElementById('view-calendar').classList.contains('active')) { renderCalendar(); closeInlineView(); checkUpcomingEvents(); }
                if(document.getElementById('view-board').classList.contains('active')) processFilteredPosts();
                
                showToast("삭제되었습니다.");
            });
        }
    </script>
</body>
</html>
